     cùng màu nền tối. Nằm ngay trong HTML — không tạo thêm file manifest (giữ đúng phạm vi
     ngoại lệ khách đã duyệt: chỉ thêm 1 file sw.js). -->

<!-- 10/09/2026 (S10/R8): mặc định SÁNG theo mẫu Figma. Máy nào đã chọn tối thì gắn lớp "toi" lên
     <html> TRƯỚC khi vẽ trang để không bị chớp màn sáng lúc mở app. Chỉ đọc 1 khoá hiển thị riêng. -->

<title>Peroma — Nhân viên</title>
<style>
/* ══ BỐ CỤC & MÀU THEO MẪU FIGMA "Full Dashboard with Widgets, Sidebar" — 10/09/2026 (S10 / R8) ══
   Khách chọn mẫu Figma (Giliard Gomes, Figma Community) thay cho giao diện Zaka của bản S9/R7:
   nền trắng xám, thẻ trắng bo tròn, điểm nhấn cam, biểu đồ xanh lá; máy tính có thanh menu nổi bên
   trái, điện thoại giữ tab trên cùng. Mặc định SÁNG như mẫu; nút 🌙/☀ đổi sang bản tối cùng tông.
   CHỈ đổi hiển thị + thêm trang Tổng quan chỉ-đọc ở Admin: không đổi logic, dữ liệu, đồng bộ.
   Tên biến màu cũ của Peroma (--amber, --cyan, --panel…) giữ nguyên và trỏ sang bảng mới.
   Ý nghĩa màu: --amber = nhấn chính (cam đậm để chữ đọc được); --cyan = thông tin/số lô (xanh
   dương); --ok = đúng/khớp (xanh lá); --warnTx = lệch/tạm/chưa lưu; --badTx = lỗi.
   Mọi màu chữ đã đo tương phản >= 4.5 trên mọi nền nó nằm lên, ở cả 2 chế độ. */
:root{
  /* Sáng — theo mẫu Figma */
  /* 11/09/2026 — khách: nền sáng đổi sang tông KEM cho dịu mắt hơn. Chỉ đổi trung tính
     (nền/chữ/viền); màu nhấn cam và các màu ok/warn/bad/info/pur giữ nguyên (đã đo tương phản).
     Mọi cặp chữ/nền mới đã đo lại ≥ 4.5:1 trên cả --bg và --card. */
  --bg:#F7F2E7; --bg2:#F1EAD9; --card:#FFFCF5; --c2:#F2EBDC; --line:#E7DDC7; --tx:#241F17; --tx2:#5E5647;
  --acc:#F5A524; --acc2:#FFCB7D; --accSoft:#FCEFD6; --brand:#FFFCF5; --brandTx:#241F17; --chart:#4CB86F;
  --ok:#23794A; --warn:#E0901A; --bad:#E5534B; --pur:#6B45C0; --info:#2A62A8;
  --okBg:#E7F6EC; --badBg:#FDECEA; --warnBg:#FFF3DC; --purBg:#F1ECFB; --infoBg:#EAF2FC;
  --shadow:0 12px 32px -18px rgba(48,38,20,.20); --shadowSm:0 1px 2px rgba(48,38,20,.06); --btnGlow:0 6px 16px -8px rgba(245,165,36,.5);
  --tx3:#746B5C; --line2:#E4D9C2; --rowAlt:#F2EBDA; --rowOn:#FCEACB;
  --accTx:#8A4C00; --warnTx:#8F5A00; --badTx:#C0342C; --badTx2:#9E2A23; --infoTx:#2A62A8;
  --okLine:#BFE3CB; --warnLine:#F6D9A6; --badLine:#F3C4BF; --infoLine:#C4D8F2;
  --btnA:#F5A524; --btnB:#F9BD55; --onAcc:#241F17;
  /* Tên biến cũ của Peroma -> trỏ sang bảng mới */
  --panel:var(--card); --row:var(--card); --row2:var(--rowAlt);
  --txt:var(--tx); --txt2:var(--tx2); --txt3:var(--tx3);
  --am:var(--accTx); --red:var(--badTx); --redd:var(--badBg); --cy:var(--infoTx); --cyd:var(--infoBg);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Roboto Mono","DejaVu Sans Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root.toi{
  /* Tối — cùng tông với mẫu (xám trung tính + cam), cho ai quen màn tối trong xưởng */
  --bg:#111113; --bg2:#141416; --card:#1C1C1F; --c2:#26262A; --line:#2E2E33; --tx:#EDEDEF; --tx2:#A6A6AF;
  --acc:#F5A524; --acc2:#B97A1C; --accSoft:#2B2213; --brand:#1C1C1F; --brandTx:#EDEDEF; --chart:#5BC47A;
  --ok:#5BC47A; --warn:#F5A524; --bad:#E5534B; --pur:#B39DFA; --info:#6FA8F5;
  --okBg:#15291C; --badBg:#2E1716; --warnBg:#2B2213; --purBg:#221B38; --infoBg:#14233A;
  --shadow:0 14px 34px -18px rgba(0,0,0,.7); --shadowSm:0 1px 2px rgba(0,0,0,.3); --btnGlow:0 6px 16px -8px rgba(245,165,36,.45);
  --tx3:#909099; --line2:#3A3A40; --rowAlt:#19191C; --rowOn:#2A2419;
  --accTx:#FFB547; --warnTx:#FFB547; --badTx:#FF7B72; --badTx2:#FFC2BC; --infoTx:#6FA8F5;
  --okLine:#2A5236; --warnLine:#5A4520; --badLine:#5C2B28; --infoLine:#28446B;
  --btnA:#F5A524; --btnB:#F9BD55; --onAcc:#1C1C1E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:var(--sans);color:var(--txt);font-size:16px;line-height:1.45;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.app{max-width:840px;margin:0 auto}
.stick{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.bar h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.04em;flex:1}
/* 10/09/2026: dòng phiên bản bị ngắt giữa chừng ("10/09/2026-" xuống dòng "R5") vì letter-spacing
   .12em làm chuỗi dài hơn bề ngang còn lại trên máy 375px. Giảm giãn chữ + cấm ngắt dòng, kèm
   ellipsis phòng khi tên bản dài hơn nữa. Chỉ đụng dòng phụ, không đổi tên hay cỡ tiêu đề chính. */
.bar h1 i{display:block;font-style:normal;font-size:10.5px;font-weight:600;color:var(--txt3);
  letter-spacing:.06em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:12.5px;font-weight:700;background:var(--row);color:var(--txt2);
  border:1px solid var(--line2);border-radius:7px;padding:7px 11px;cursor:pointer;white-space:nowrap}
/* 10/09/2026 — bản R5: 5 tab × min-width 88px = 440px, rộng hơn màn hình điện thoại 375px nên
   tab cuối ("Dữ liệu") bị đẩy khuất. Thanh cuộn lại bị ẩn (scrollbar-width:none) nên KHÔNG có
   dấu hiệu nào cho thấy còn tab bên phải — trong khi màn hình trống lại đang bảo người dùng
   "Vào tab Dữ liệu → Nạp cấu hình", và đó cũng là nơi khai kết nối Google Sheet.
   Sửa: min-width 0 để flex:1 chia đều theo bề ngang máy — luôn thấy đủ 5 tab, kể cả máy 320px.
   Giữ nguyên overflow-x:auto làm lưới an toàn nếu sau này thêm tab nữa. */
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:0;font:inherit;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:transparent;color:var(--txt3);border:none;border-bottom:2px solid transparent;padding:13px 6px;cursor:pointer}
.tab.on{color:var(--am);border-bottom-color:var(--am);background:var(--warnBg)}
.hom{padding:9px 14px;background:var(--cyd);color:var(--cy);font-size:13px;font-weight:700;border-bottom:1px solid var(--line)}
.hom.nhac{background:var(--redd);color:var(--badTx2)}
.pg{padding:0 0 40px}
.sec{font-size:10.5px;font-weight:800;letter-spacing:.11em;color:var(--txt3);text-transform:uppercase;
  padding:16px 14px 7px}
.r{display:flex;align-items:center;gap:12px;padding:15px 14px;border-bottom:1px solid var(--line);
  background:var(--row);cursor:pointer}
.r:nth-child(even){background:var(--row2)}
.r:active{background:var(--c2)}
.r .n{flex:1;min-width:0}
.r .n b{display:block;font-size:16px;font-weight:700}
.r .n span{display:block;font-size:12px;color:var(--txt3);margin-top:2px}
.r .go{color:var(--txt3);font-size:20px;flex:none}
.bdg{font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:4px;text-transform:uppercase;flex:none}
.bdg.tam{background:var(--warnBg);color:var(--warnTx)}
.bdg.dinh{background:var(--redd);color:var(--red)}
.card{margin:14px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--txt3);
  text-transform:uppercase;margin-bottom:6px}
.fld input,.fld select{width:100%;font:inherit;font-size:17px;background:var(--bg);color:var(--txt);
  border:1px solid var(--line2);border-radius:9px;padding:13px 12px}
.fld input.mn{font-family:var(--mono);font-weight:700;font-size:21px;text-align:right}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--am)}
.fld input.xau{border-color:var(--red)}
.big{background:var(--cyd);border:1px solid var(--infoLine);border-radius:10px;padding:14px;margin-bottom:13px;text-align:center}
.big .l{font-size:10.5px;font-weight:800;letter-spacing:.11em;color:var(--cy);text-transform:uppercase}
.big .v{font-family:var(--mono);font-size:38px;font-weight:800;color:var(--cy);line-height:1.15;margin-top:5px}
.big .s{font-size:12.5px;color:var(--txt2);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{font:inherit;font-size:14px;font-weight:600;background:var(--row);color:var(--txt2);
  border:1px solid var(--line2);border-radius:9px;padding:11px 14px;cursor:pointer}
.chips button.on{background:var(--am);border-color:var(--am);color:var(--onAcc);font-weight:800}
.pb{display:flex;gap:7px;align-items:center;margin-top:8px}
.pb select{flex:1;min-width:0;font:inherit;font-size:15px;background:var(--bg);color:var(--txt);
  border:1px solid var(--line2);border-radius:9px;padding:11px 8px}
.pb input{width:92px;flex:none;font-family:var(--mono);font-size:17px;font-weight:700;text-align:right;
  background:var(--bg);color:var(--txt);border:1px solid var(--line2);border-radius:9px;padding:11px 8px}
.pb .x{flex:none;font-size:17px;font-weight:800;color:var(--red);background:var(--redd);
  border:1px solid var(--badLine);border-radius:9px;padding:10px 13px;cursor:pointer;line-height:1}
.pbi{font-size:12.5px;color:var(--txt2);margin:5px 0 0 3px;line-height:1.5}
.pbi b{font-family:var(--mono);color:var(--cy)}
.pbi .du{color:var(--warnTx)}
.pbi .no{color:var(--red)}
.add{width:100%;margin-top:9px;font:inherit;font-size:14px;font-weight:700;padding:12px;
  background:var(--row);color:var(--am);border:1px dashed var(--line2);border-radius:9px;cursor:pointer}
.tong{margin-top:11px;padding-top:11px;border-top:1px solid var(--line2);display:flex;
  justify-content:space-between;gap:9px;font-size:13.5px;flex-wrap:wrap}
.tong b{font-family:var(--mono);font-size:15px}
.tong.khop b{color:var(--ok)} .tong.lech b{color:var(--warnTx)}
.canh{background:var(--redd);border:1px solid var(--badLine);border-radius:9px;padding:11px 12px;
  font-size:13px;line-height:1.55;color:var(--badTx2);margin-bottom:13px}
.canh b{color:var(--red)}
.note{background:var(--warnBg);border:1px solid var(--warnLine);border-radius:9px;padding:11px 12px;
  font-size:13px;line-height:1.55;color:var(--warnTx);margin-bottom:13px}
.pair{display:flex;gap:9px;margin-top:14px}
.pair button{flex:1;font:inherit;font-size:15px;font-weight:800;padding:15px;border-radius:10px;cursor:pointer}
.huy{background:var(--row);color:var(--txt2);border:1px solid var(--line2)}
.oke{background:var(--am);color:var(--onAcc);border:none}
.oke:disabled{opacity:.4;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--txt3);flex:none}
.kv b{text-align:right;word-break:break-word}
.lot h5{margin:0 0 10px;font-family:var(--mono);font-size:22px;font-weight:800;color:var(--am);letter-spacing:.05em}
.none{padding:26px 14px;text-align:center;color:var(--txt3);font-size:14px}
.xn{font-size:15px;line-height:1.75}
.xn .row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.xn .row span{color:var(--txt3);width:120px;flex:none;font-size:13px}
.xn .row b{flex:1}
.xn .lo{font-family:var(--mono);font-size:21px;color:var(--cy);font-weight:800}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
  background:var(--tx);color:var(--card);font-size:14px;font-weight:700;padding:12px 20px;border-radius:10px;
  opacity:0;transition:.22s;z-index:60;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mask{position:fixed;inset:0;background:rgba(12,18,15,.6);display:none;align-items:center;
  justify-content:center;z-index:70;padding:18px}
.mask.on{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:13px;padding:19px;max-width:460px;width:100%}
.dlg h3{margin:0 0 9px;font-size:17px}
.dlg p{margin:0 0 15px;font-size:14px;color:var(--txt2);line-height:1.65}
.dlg .pair{margin-top:0}
#temIn{display:none}
/* ══TEM-CSS══ Kiểu bản in tem — dùng CHUNG cho #temIn (lúc in) và #temDo (khung đo ẩn, xem coChuVua()),
   để cỡ chữ đo được luôn đúng bằng lúc in. S16/R10 (10/09/2026): tờ tem CỐ ĐỊNH đúng vùng in A4 lề 6 mm
   (197×284 mm, chừa 1 mm cho sai số máy in), ô lưới KHÔNG được giãn theo nội dung (min-height:0) — trước
   đây nội dung dài làm ô cao gấp đôi, tem đè nhau và tràn sang trang 2. Mọi cỡ chữ tính theo --co (cỡ gốc
   của bảng thông tin) do coChuVua() chọn cho vừa ô; 3 lớp to-lon/vua/nho chỉ còn là cỡ khởi đầu. */
#temDo{position:fixed;left:-10000px;top:0;visibility:hidden;pointer-events:none}
:is(#temIn,#temDo,.xemTem){background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:Arial,Helvetica,sans-serif;line-height:1.3;padding:0;margin:0}
:is(#temIn,#temDo,.xemTem) .to{display:grid;gap:1.5mm;page-break-after:always;width:197mm;height:284mm;box-sizing:border-box;overflow:hidden}
:is(#temIn,#temDo,.xemTem) .to.to-nhiet{width:61mm;height:61mm}
:is(#temIn,#temDo,.xemTem) .to.to-nhiet5070{width:46mm;height:66mm}
:is(#temIn,#temDo,.xemTem) .to.to-nhiet7050{width:66mm;height:46mm}
:is(#temIn,#temDo,.xemTem) :is(.to-nhiet,.to-nhiet5070,.to-nhiet7050) .tem{padding:.3em .32em .22em;line-height:1.15}
:is(#temIn,#temDo,.xemTem) :is(.to-nhiet,.to-nhiet5070,.to-nhiet7050) .tem .t1{margin:0 0 .1em}
:is(#temIn,#temDo,.xemTem) :is(.to-nhiet,.to-nhiet5070,.to-nhiet7050) .tem .t2{margin:0 0 .03em;font-size:1.22em}
:is(#temIn,#temDo,.xemTem) :is(.to-nhiet,.to-nhiet5070,.to-nhiet7050) .tem .t3{margin:0 0 .14em}
:is(#temIn,#temDo,.xemTem) :is(.to-nhiet,.to-nhiet5070,.to-nhiet7050) .tem td{padding:.04em .14em}
:is(#temIn,#temDo,.xemTem) :is(.to-nhiet,.to-nhiet5070,.to-nhiet7050) .tem td.k{width:30%}
/* 16/09/2026: nén khối công ty (.kh) riêng ở khổ nhiệt — xem chú thích đầy đủ ở bản Admin. */
:is(#temIn,#temDo,.xemTem) :is(.to-nhiet,.to-nhiet5070,.to-nhiet7050) .tem .kh{padding:.1em;font-size:.8em;line-height:1.1}
:is(#temIn,#temDo,.xemTem) :is(.to-nhiet,.to-nhiet5070,.to-nhiet7050) .tem .cb{margin-top:.16em;font-size:.8em;line-height:1.1}
:is(#temIn,#temDo,.xemTem) .to:last-child{page-break-after:auto}
:is(#temIn,#temDo,.xemTem) .to-lon{--co:8.5pt} :is(#temIn,#temDo,.xemTem) .to-vua{--co:6.8pt} :is(#temIn,#temDo,.xemTem) .to-nho{--co:5.3pt}
:is(#temIn,#temDo,.xemTem) .tem{border:1pt solid #000;padding:.9em .7em .55em;box-sizing:border-box;overflow:hidden;width:100%;height:100%;min-width:0;min-height:0;font-size:var(--co);color:var(--temChu,#000);border-color:var(--temVien,#000);font-weight:var(--temDamChu,400);font-style:var(--temNghiengChu,normal)}
:is(#temIn,#temDo,.xemTem) .t1{color:var(--temTieuDe,#000);text-align:center;font-weight:var(--temDamTieuDe,700);font-style:var(--temNghiengTieuDe,normal);letter-spacing:.05em;margin:0 0 .25em;font-size:1.06em}
:is(#temIn,#temDo,.xemTem) .t2{color:var(--temTieuDe,#000);text-align:center;font-weight:var(--temDamTieuDe,700);font-style:var(--temNghiengTieuDe,normal);margin:0 0 .1em;line-height:1.15;font-size:1.65em}
:is(#temIn,#temDo,.xemTem) .t3{text-align:center;margin:0 0 .35em;font-size:1.06em}
:is(#temIn,#temDo,.xemTem) table{width:100%;border-collapse:collapse;font-size:1em}
:is(#temIn,#temDo,.xemTem) td{border:.5pt solid var(--temVien,#000);padding:.3em .35em .24em;vertical-align:top}
:is(#temIn,#temDo,.xemTem) td.k{width:32%;font-weight:bold}
:is(#temIn,#temDo,.xemTem) .kh{border:.5pt solid var(--temVien,#000);border-top:none;padding:.3em;line-height:1.3;font-size:1em}
:is(#temIn,#temDo,.xemTem) .cb{font-style:italic;margin-top:.4em;line-height:1.25;font-size:1em}
/* ══HẾT-TEM-CSS══ */
@media print{
  @page{size:A4;margin:6mm}
  @page nhiet{size:65mm 65mm;margin:2mm}
  @page nhiet5070{size:50mm 70mm;margin:2mm}
  @page nhiet7050{size:70mm 50mm;margin:2mm}
  #temIn .to-nhiet{page:nhiet}
  #temIn .to-nhiet5070{page:nhiet5070}
  #temIn .to-nhiet7050{page:nhiet7050}
  /* S16/R10: bỏ lề trong của trang app khi in (khoảng chừa thanh trạng thái / thanh menu trái trên máy tính)
     — không bỏ thì tờ tem 284 mm bị đẩy xuống + lệch phải, tràn sang trang 2 */
  html,body{background:#fff!important;margin:0!important;padding:0!important;min-height:0!important;height:auto!important}
  body>*{display:none!important}
  #temIn{display:block!important}
}
@media(min-width:700px){ .chips button{font-size:15px} .r{padding:17px 16px} }

/* ══ LỚP BỐ CỤC THEO MẪU FIGMA (S10/R8) — đặt cuối để đè lên kiểu cũ, chỉ đổi hiển thị ══ */
html,body{background:var(--bg);min-height:100%}
.stick{background:var(--card);box-shadow:var(--shadowSm);border-bottom:1px solid var(--line)}
.bar{background:var(--card);color:var(--tx)}
.bar h1{letter-spacing:0}
.bar h1 i{color:var(--tx3)}
/* chấm tròn cam trước tên app — như logo quả cam của mẫu */
.bar h1::before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));vertical-align:0}
.tabs{background:var(--card);border-top:0;border-bottom:0}
.tab{font-weight:600;letter-spacing:0;text-transform:none;color:var(--tx2);border-bottom:3px solid transparent;line-height:1.2}
.tab .ic{display:block;width:19px;height:19px;margin:0 auto 4px}
.tab.on{color:var(--tx);border-bottom-color:var(--acc);background:var(--accSoft)}
.tab.on .ic{color:var(--acc)}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.toast{border-radius:14px;box-shadow:var(--shadow)}
.bdg{border-radius:8px}
#btnSangToi{font-size:15px;line-height:1;padding:7px 10px;flex:none}
@media(min-width:900px){
  /* MÁY TÍNH: thanh menu nổi bên trái như mẫu. Dùng lại đúng khối .stick có sẵn (thanh tiêu đề +
     tab) — chỉ đổi vị trí hiển thị, không đổi HTML/JS nào đang dùng các phần tử này. */
  :root{--sideW:236px}
  body{padding-left:calc(var(--sideW) + 30px)}
  .stick{position:fixed;left:14px;top:14px;bottom:14px;width:var(--sideW);z-index:30;display:flex;flex-direction:column;
    border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px 12px 70px;overflow-y:auto;overflow-x:hidden}
  .bar{flex-wrap:wrap;padding:4px 8px 16px;margin-bottom:10px;border-bottom:1px solid var(--line)}
  .bar h1{flex:1 1 100%;font-size:16px}
  .tabs{flex-direction:column;gap:3px;overflow:visible}
  .tab{flex:none;display:flex;align-items:center;gap:11px;text-align:left;padding:10px 12px;border-radius:12px;
    border-bottom:0;font-size:14px;font-weight:500;white-space:nowrap}
  .tab .ic{margin:0;width:18px;height:18px;flex:none}
  .tab:hover{background:var(--c2);color:var(--tx)}
  .tab.on{background:var(--accSoft);color:var(--tx);font-weight:700}
  /* nút sáng/tối xuống đáy thanh menu, có chữ — như mục "Settings" của mẫu */
  #btnSangToi{position:absolute;left:12px;right:12px;bottom:14px;display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:12px;font-size:15px;text-align:left}
  #btnSangToi::after{content:attr(data-nhan);font-size:13.5px;font-weight:600}
}
/* 5 tab trên máy 375px: biểu tượng trên, chữ dưới, cho phép xuống dòng ("Chốt thực tế") thay vì bị cắt */
.tab{font-size:12px;padding:10px 2px 9px;white-space:normal}
.bar h1{min-width:0}
.who{background:var(--c2);color:var(--tx);border-color:var(--line);border-radius:12px}
.oke,.chips button.on{background:linear-gradient(135deg,var(--btnA) 0%,var(--btnB) 100%);color:var(--onAcc);
  border-color:transparent;box-shadow:var(--btnGlow)}
.oke:disabled{box-shadow:none}
.card{border-radius:20px;border-color:var(--line);box-shadow:var(--shadowSm)}
.fld input,.fld select{border-radius:14px}
.pb select,.pb input,.chips button,.pb .x{border-radius:12px}
.big{border-radius:18px}
.add,.pair button,.canh,.note{border-radius:14px}
@media(min-width:900px){
  .app{max-width:980px;margin:0 auto;padding:16px 16px 0 0}
  .stick{padding-bottom:118px}
  /* khối người dùng ở đáy menu như mẫu (tên + vai trò), trên nút sáng/tối */
  #whoBtn{position:absolute;left:12px;right:12px;bottom:62px;padding:10px 12px;text-align:left;font-size:14px}
  #dbDen{padding:0 0 0 20px}
  .hom{margin-top:12px;border:0;border-radius:14px;font-size:12.5px}
  .card{margin:0 0 14px}
  .pg>.sec:first-child{padding-top:4px}
}
/* R9: nút phụ "Lưu file … để in ở máy khác" + ghi chú nhỏ ở tab Tra lô */
.add.ghe{background:transparent;color:var(--txt2);border:1px dashed var(--line2);font-weight:600;font-size:13px}
.add.ghe:hover{color:var(--tx);border-color:var(--acc)}
.ghichu{font-size:12.5px;color:var(--txt2);line-height:1.5;margin-top:8px}
.ghichu.htnhan{background:var(--infoBg);color:var(--infoTx);border-radius:12px;padding:9px 12px;margin:0 0 10px;font-weight:600}
/* ══ S17/R11: bảng "Dàn trang tem" — chọn số tem mỗi hàng × số hàng, xem trước tờ A4 ══ */
.dt-mask{position:fixed;inset:0;z-index:80;background:rgba(12,18,15,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dt-hop{width:100%;max-width:860px;max-height:calc(100vh - 32px);overflow:auto;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.dt-dau{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dt-dau b{display:block;font-size:17px}.dt-dau span{display:block;font-size:12.5px;color:var(--tx2);margin-top:2px}
.dt-x{font:inherit;font-size:20px;line-height:1;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--c2);color:var(--tx2);cursor:pointer;flex:none}
.dt-than{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;padding:18px 20px}
.dt-xem{min-width:0}
.dt-giay{position:relative;width:100%;aspect-ratio:210/297;background:#fff;border:1px solid var(--line2);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.dt-vung{position:absolute;left:0;top:0;transform-origin:0 0}
.dt-cap{font-size:12px;color:var(--tx2);text-align:center;margin-top:8px}
.dt-dk{min-width:0;display:flex;flex-direction:column;gap:12px}
.dt-o label{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.dt-so{display:flex;align-items:stretch;gap:6px}
.dt-so button{font:inherit;font-size:20px;font-weight:700;width:44px;border-radius:12px;border:1px solid var(--line2);background:var(--c2);color:var(--tx);cursor:pointer}
.dt-so input{width:70px;text-align:center;font:inherit;font-size:20px;font-weight:700;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--tx);padding:8px}
.dt-so input:focus{outline:none;border-color:var(--acc)}
.dt-nhanh-t{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:-6px}
.dt-nhanh{display:flex;flex-wrap:wrap;gap:6px}
.dt-nhanh button{font:inherit;font-size:13px;font-weight:700;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--tx);padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:58px}
.dt-nhanh button small{font-size:10.5px;font-weight:600;color:var(--tx2)}
.dt-nhanh button.ok{border-color:var(--okLine)}.dt-nhanh button.nho{border-color:var(--warnLine);background:var(--warnBg)}.dt-nhanh button.tran{border-style:dashed;color:var(--tx3)}
.dt-nhanh button.on{outline:2px solid var(--acc);outline-offset:1px}
.dt-kq{font-size:14px;line-height:1.5;background:var(--c2);border-radius:12px;padding:10px 12px}
.dt-tt{font-size:13.5px;font-weight:600;border-radius:12px;padding:9px 12px}
.dt-tt.ok{background:var(--okBg);color:var(--ok)}.dt-tt.nho{background:var(--warnBg);color:var(--warnTx)}.dt-tt.tran{background:var(--badBg);color:var(--badTx)}
.dt-goiy{font-size:13px;color:var(--tx2)}
.dt-goiy button{font:inherit;font-weight:700;color:var(--accTx);background:var(--accSoft);border:1px solid var(--acc);border-radius:999px;padding:3px 10px;cursor:pointer;margin-left:4px}
.dt-nut{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card);border-radius:0 0 20px 20px}
.dt-nut button{font:inherit;font-size:15px;font-weight:700;border-radius:14px;padding:12px 20px;cursor:pointer}
.dt-huy{background:var(--c2);color:var(--tx);border:1px solid var(--line2)}
.dt-in{background:linear-gradient(135deg,var(--btnA),var(--btnB));color:var(--onAcc);border:0;box-shadow:var(--btnGlow)}
.dt-in:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
@media(max-width:700px){.dt-than{grid-template-columns:1fr}.dt-xem{max-width:240px;margin:0 auto;width:100%}}
/* S19/R13: mục "Sửa nội dung tem lần cuối" trong bảng Dàn trang */
.dt-sua{margin:0 20px 6px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.dt-sua summary{cursor:pointer;padding:11px 14px;font-weight:700;font-size:14px}
.dt-sua summary small{font-weight:500;color:var(--tx2)}
.dt-sua-luoi{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 14px 10px}
.dt-f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--tx2)}
.dt-f.dai{grid-column:1/-1}
.dt-f input,.dt-f textarea{font:inherit;font-size:13.5px;font-weight:400;color:var(--tx);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:8px 10px}
.dt-f textarea{min-height:58px;resize:vertical;line-height:1.45}
.dt-f input:focus,.dt-f textarea:focus{outline:none;border-color:var(--acc)}
.dt-sua-cuoi{padding:0 14px 12px;font-size:12.5px;color:var(--tx2);line-height:1.5}
.dt-luu{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:700;color:var(--tx)}
@media(max-width:700px){.dt-sua-luoi{grid-template-columns:1fr}}
.dt-sua-ten{margin:0 14px 10px;padding:9px 12px;border-radius:10px;background:var(--infoBg);color:var(--infoTx);font-size:12.5px;line-height:1.5}
/* S22/R15: màu in tem trong bảng Dàn trang */
.dt-mau-tom{display:inline-flex;gap:3px;margin-left:6px;vertical-align:-2px}
.dt-mau-tom i{width:13px;height:13px;border-radius:4px;border:1px solid var(--line2)}
.dt-mau-than{padding:2px 14px 12px;display:flex;flex-direction:column;gap:10px}
.dt-mau-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dt-mau-r>span{min-width:170px;font-size:13px;font-weight:600;color:var(--tx2)}
.dt-mau-ds{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dt-mau-o{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line2);cursor:pointer;padding:0}
.dt-mau-o.on{box-shadow:0 0 0 2px var(--acc)}
.dt-kieu-o{min-width:38px;height:28px;padding:0 10px;border-radius:8px;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line2);cursor:pointer;background:var(--card2);color:var(--tx)}
.dt-kieu-o.on{box-shadow:0 0 0 2px var(--acc);color:var(--acc)}
.dt-mau-tu{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--tx2);cursor:pointer;border:1px dashed var(--line2);border-radius:999px;padding:2px 10px 2px 3px}
.dt-mau-tu input{width:24px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.dt-mau-cuoi{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2)}
.dt-mau-cuoi button{font:inherit;font-weight:700;border:1px solid var(--line2);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;cursor:pointer}
.dt-mau-cuoi .nhat{color:var(--warnTx);font-weight:600}
.temmau-tt i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line2);margin-right:2px;vertical-align:-1px}
/* ══ S23/R16: CHUYỂN ĐỘNG GIAO DIỆN — khách hỏi "UI animation làm được không" (10/09/2026).
   Nhẹ và ngắn (≤ 0,45 s), chỉ để mắt theo kịp thay đổi: nội dung tab trồi lên khi chuyển tab, thẻ mặt hàng
   trượt mở, hộp thoại bật ra, nút lún nhẹ khi bấm, ô số liệu nhấc lên khi rê chuột. Tắt HẲN khi máy bật
   "giảm chuyển động" (Windows/iPhone/Android) và khi chạy bộ kiểm tra tự động (html.hv-tat). Không đụng bản in. */
@keyframes hvLen{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes hvHien{from{opacity:0}to{opacity:1}}
@keyframes hvPop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes hvXuong{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.vao{animation:hvLen .3s cubic-bezier(.2,.7,.2,1) both}
.vao .tq>.w,.vao .tqphai .w{animation:hvLen .45s cubic-bezier(.2,.7,.2,1) both}
.vao .tq>.w:nth-child(2){animation-delay:.05s}.vao .tq>.w:nth-child(3){animation-delay:.1s}
.vao .tq>.w:nth-child(4){animation-delay:.15s}.vao .tq>.w:nth-child(n+5){animation-delay:.2s}
.r.vuamo .det{animation:hvXuong .26s cubic-bezier(.2,.7,.2,1) both}
.mask.on,.dt-mask{animation:hvHien .18s ease-out both}
.mask.on .dlg,.dt-mask .dt-hop{animation:hvPop .24s cubic-bezier(.2,.8,.2,1) both}
button:not(:disabled){transition:transform .1s ease,background-color .15s,border-color .15s,color .15s,box-shadow .15s}
button:active:not(:disabled){transform:scale(.97)}
.gt-the,.tq .w{transition:transform .18s,box-shadow .18s,border-color .18s}
.gt-the:hover,.tq .w:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
html.hv-tat *,html.hv-tat *::before,html.hv-tat *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{*,*::before,*::after{animation:none!important;transition:none!important}}
/* S26/R19: chuyển khổ A4 / cuộn nhiệt trong bảng Dàn trang tem */
.dt-kho{display:flex;gap:3px;background:var(--c2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 20px 14px}
.dt-kho button{flex:1;font:inherit;font-size:12.5px;font-weight:700;border:0;background:none;color:var(--tx2);border-radius:9px;padding:8px 8px;cursor:pointer}
.dt-kho button.on{background:var(--acc);color:var(--onAcc)}
.tk-kho{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.tk-kho button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line2);background:var(--card);color:var(--tx2);border-radius:12px;padding:9px 14px;cursor:pointer}
.tk-kho button.on{background:var(--acc);color:var(--onAcc);border-color:var(--acc)}

:root{--sans:Raleway,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{font-family:var(--sans);font-feature-settings:"lnum" 1}
.to,.to *,.tem,.tem *{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
:root:not(.toi){
  --bg:#FBF7F5; --bg2:#F7EFEB; --card:#FFFFFF; --c2:#FFF3EE; --line:#F3DCD4; --line2:#EDC5B9; --tx:#1F242B; --tx2:#4B5361; --tx3:#6E7684;
  --acc:#F3654A; --acc2:#FFB9AC; --accSoft:#FEF0ED; --accTx:#C63D23; --brand:#FFFFFF; --brandTx:#1F242B;
  --rowAlt:#FFF8F5; --rowOn:#FDE4DA; --btnA:#F3654A; --btnB:#FFB9AC; --onAcc:#FFFFFF;
  --shadow:-4px 8px 20px -5px rgba(119,114,147,.2); --shadowSm:0 1px 2px rgba(179,173,173,.08); --btnGlow:0 20px 26px -8px rgba(15,22,58,.15);
  background:var(--bg)}
:root:not(.toi) body{background:radial-gradient(circle at 92% 4%,rgba(244,162,127,.38),transparent 40%),radial-gradient(circle at 0% 60%,rgba(255,196,140,.26),transparent 34%),var(--bg) fixed;min-height:100vh}
:root:not(.toi) .card{border:1px solid #F7E3DE;border-radius:24px;box-shadow:-4px 8px 20px -5px rgba(119,114,147,.2)}
:root:not(.toi) .tab.on{background:#FEF0ED;border-bottom-color:#F3654A;color:#C63D23}
:root:not(.toi) .tab.on .ic{color:#F3654A}
@property --goc{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes vienChay{to{--goc:360deg}}
:root:not(.toi) :is(.oke,.chips button.on){background:linear-gradient(90deg,#F3654A 0%,#FFB9AC 100%)!important;color:#fff!important;border:1px solid #FAC1B7!important;border-radius:999px;position:relative;
  box-shadow:inset 0 -1px 2px rgba(255,255,255,.3),inset 0 -2px 5px 1px rgba(255,255,255,.12),inset 0 1px 2px rgba(21,26,54,.3),inset 0 2px 6px rgba(21,26,54,.15),inset 0 -2px 14px rgba(255,255,255,.15),0 20px 26px -8px rgba(15,22,58,.15)!important}
:root:not(.toi) .oke:not(:disabled)::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:2px;pointer-events:none;
  background:conic-gradient(from var(--goc),#FAC1B7,rgba(255,255,255,0),#FFFFFF,rgba(255,255,255,0),#FAC1B7);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box exclude,linear-gradient(#fff 0 0);animation:vienChay 1.5s linear infinite}
:root:not(.toi) :is(.huy,.add){background:#fff;border:1px solid #FAC1B7!important;border-style:solid!important;border-radius:999px;color:#1F242B;
  box-shadow:0 1px 2px rgba(179,173,173,.05),0 4px 4px rgba(179,173,173,.04),0 9px 5px rgba(179,173,173,.03)}
:root:not(.toi) .add{color:#C63D23}
:root:not(.toi) .big{border-radius:20px}
:root:not(.toi) h1{font-weight:800}
@media (prefers-reduced-motion:reduce){.oke::before{animation:none!important}}
@media print{.oke::before{display:none}}
#thanhChuaGui{position:fixed;left:8px;right:8px;bottom:8px;z-index:9000;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:#B42318;color:#fff;padding:10px 12px;border-radius:14px;font-size:13.5px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
#thanhChuaGui button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:8px 16px;background:#fff;color:#B42318;cursor:pointer}
@media print{#thanhChuaGui{display:none}}

/* ═══ 19/10/2026 — R46 HOẠT ẢNH (đồng bộ với Admin S79): huy hiệu khi ghi mẻ (số lô quay như máy đếm), số "hương cần đổ" nảy khi đổi,
   thanh "mẻ chưa gửi" trượt lên + nhịp, đèn đồng bộ nhịp xanh, ô sai rung. Tắt khi "giảm chuyển động", khi chạy kiểm tra (hv-tat), khi in. */
#huyHieu{position:fixed;left:50%;top:12px;z-index:9500;transform:translate(-50%,-160%);display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100vw - 24px);
  background:var(--card);color:var(--tx);border:1.5px solid #FAC1B7;border-radius:18px;padding:10px 16px 10px 10px;box-shadow:0 22px 40px -18px rgba(0,0,0,.45);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
#huyHieu.hien{transform:translate(-50%,0)}
#huyHieu .ic{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#F3654A,#FFB9AC)}
#huyHieu.hien .ic{animation:hhXoay .7s .15s both}@keyframes hhXoay{from{transform:rotateY(180deg) scale(.4)}to{transform:none}}
#huyHieu b{display:block;font-size:15px}#huyHieu small{display:block;font-size:12.5px;color:var(--tx3)}
#huyHieu .hh-lo{font:800 20px/1.15 var(--mono);letter-spacing:.04em;color:#C63D23;margin-top:2px}
.so-quay{display:inline-flex;gap:.04em}.so-quay .qs{display:inline-block!important;height:1.15em;overflow:hidden;vertical-align:bottom}.so-quay .qs>span{display:flex!important;flex-direction:column;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.so-quay .qs>span>.sqd{display:block!important;width:auto!important;background:none!important;height:1.15em;line-height:1.15em;font-size:inherit;font-weight:inherit;font-style:normal}.so-quay .qs{line-height:1.15em}
.xv-lo.dang-quay{background:none!important;-webkit-text-fill-color:currentColor!important;color:#E8664A!important}.so-quay .cach{width:.35em}
@keyframes soNay{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.big .v.nay{animation:soNay .35s ease}
@keyframes rung{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}.rung{animation:rung .36s ease}
@keyframes thanhLen{from{transform:translateY(120%)}to{transform:none}}
@keyframes thanhTho{50%{box-shadow:0 0 0 5px rgba(180,35,24,.25),0 10px 24px -10px rgba(0,0,0,.5)}}
#thanhChuaGui{animation:thanhLen .45s cubic-bezier(.3,1.4,.5,1) both,thanhTho 2.4s 1s ease-in-out infinite}
@keyframes denNhip{0%{box-shadow:0 0 0 0 rgba(46,158,75,.55)}100%{box-shadow:0 0 0 12px rgba(46,158,75,0)}}
@keyframes denCho{50%{opacity:.45}}
#dbDen{border-radius:999px;padding:2px 8px}#dbDen[data-tt="ok"].nhay{animation:denNhip 1s ease-out}#dbDen[data-tt="dang"]{animation:denCho 1s ease-in-out infinite}
.pbi b{display:inline-block}.pbi .tu-tinh{animation:soNay .4s ease}
@media print{#huyHieu{display:none}}

  const nhom={};

/* ── TỰ DÀN CHỮ TEM CHO VỪA Ô — 10/09/2026 (Admin S16 / Nhân viên R10) ──
   Khách gửi ảnh bản in: tem đè lên nhau, tràn sang trang 2. Gốc rễ: tờ tem cao "100%" nhưng
   #temIn không có chiều cao nên không giới hạn thật; ô lưới lại được phép giãn theo nội dung
   (min-height:auto), nên nội dung dài (công dụng, hướng dẫn…) làm hàng cao gấp đôi, chèn hàng
   dưới và đẩy sang trang sau; cỡ chữ chỉ có 3 mức cố định theo SỐ tem/tờ, không theo độ DÀI nội dung.
   Nay: tờ tem cố định đúng vùng in A4 (lề 6 mm), mỗi ô cố định; coChuVua() đo thật nội dung tem
   trong khung ẩn #temDo (cùng kiểu với lúc in) và chọn cỡ chữ LỚN NHẤT vừa ô (tìm nhị phân).
   Chữ phải co dưới TEM_CO_DOC (khó đọc) thì hỏi trước khi in và đề xuất khổ ít tem/tờ hơn cho chữ
   đủ lớn. KHÔNG đổi nội dung tem (temHTML giữ nguyên), chỉ đổi cách dàn lên giấy. */
// 14-15/09/2026: thử nâng sàn 4pt→6pt→5pt rồi TRẢ VỀ 4pt — đo thật cho thấy nâng sàn (kể cả 5pt)
// khoá được cả hồ sơ TCCS thật dài (VD Little Mars) dù ở khổ A4 không hề nhỏ; khách cũng tự kiểm
// chứng in từ Word cùng máy/cùng cài đặt vẫn nét đậm → 4pt không phải nguyên nhân gây nhoè, do
// đường in Chrome. Xem chú thích đầy đủ ở bản Admin (bang-tra-huong-lieu.html), HAI APP GIỐNG NHAU.
const TEM_CO_MIN=4, TEM_CO_MAX=14, TEM_CO_DOC=6; // pt
const temCoCache=new Map();
function khungDoTem(){let d=document.getElementById('temDo');
  if(!d){d=document.createElement('div');d.id='temDo';d.setAttribute('aria-hidden','true');document.body.appendChild(d)}return d}
function coChuVua(mot,cot,hang,nhiet){
  const kn=nhiet===true?'nhiet':(nhiet||''); // tương thích lời gọi cũ truyền boolean true = khổ 'nhiet' 65×65
  const khoa=(kn||cot+'x'+hang)+'|'+mot; if(temCoCache.has(khoa))return temCoCache.get(khoa);
  const d=khungDoTem();
  d.innerHTML=kn?'<div class="to to-'+kn+'">'+mot+'</div>':'<div class="to" style="grid-template-columns:repeat('+cot+',1fr);grid-template-rows:repeat('+hang+',1fr)">'+mot+'</div>';
  const tem=d.querySelector('.tem'); let kq;
  if(!tem){kq={co:8.5,tran:false}}
  else{
    /* 30/09/2026: khách "1 số bản in bị mất chữ ở góc dưới cùng" (dòng cuối "Thông tin, Cảnh báo" bị cắt). Đo trên máy chỉ
       vừa khít (dư 2–9 px) — máy in/máy khác dựng phông rộng hơn chút là tràn. Chừa DƯ 6% chiều cao: nội dung phải kết
       thúc trước 94% khung. ponytail: tỉ lệ cố định; tăng lên nếu vẫn còn máy in cắt chữ. */
    const vua=co=>{tem.style.setProperty('--co',co+'pt');
      const c=tem.lastElementChild, rt=tem.getBoundingClientRect(), cao=rt.height||1, day=c?(c.getBoundingClientRect().bottom-rt.top)/cao:0;
      return tem.scrollHeight<=tem.clientHeight+1&&tem.scrollWidth<=tem.clientWidth+1&&day<=0.94};
    if(vua(TEM_CO_MAX))kq={co:TEM_CO_MAX,tran:false};
    else if(!vua(TEM_CO_MIN))kq={co:TEM_CO_MIN,tran:true};
    else{let lo=TEM_CO_MIN,hi=TEM_CO_MAX;for(let k=0;k<10;k++){const m=(lo+hi)/2;if(vua(m))lo=m;else hi=m}
      kq={co:Math.floor(lo*10)/10,tran:false}}
  }
  d.innerHTML='';
  if(temCoCache.size>60)temCoCache.clear();
  temCoCache.set(khoa,kq); return kq;
}
/* Khổ đề xuất: nhiều tem/tờ nhất mà chữ vẫn ≥ TEM_CO_DOC (ưu tiên chữ to hơn khi bằng số tem) */
function khoTemGoiY(mot,cot,hang){
  let tot=null;
  for(let c=1;c<=6;c++)for(let h=1;h<=8;h++){
    const n=c*h; if(n>=cot*hang)continue;
    const k=coChuVua(mot,c,h); if(k.tran||k.co<TEM_CO_DOC)continue;
    if(!tot||n>tot.n||(n===tot.n&&k.co>tot.co))tot={c,h,n,co:k.co};
  }
  return tot;
}

  const w=(TEM_VUNG_W-(cot-1)*TEM_KHE)/cot, h=(TEM_VUNG_H-(hang-1)*TEM_KHE)/hang;

  const mot=temHTML(r,p);
  if(laKhoNhiet(temKho)){ // 1 tem/trang, khớp @page cùng tên khổ (xem CSS)
    const vua=coChuVua(mot,1,1,temKho);
    return `<div class="to to-${temKho}" data-co="${vua.co}"${vua.tran?' data-tran="1"':''} style="--co:${vua.co}pt;${temMauCSS()};${temKieuCSS()}">${mot}</div>`;
  }
  const cot=Math.max(1,Math.min(10,+temCot||5)), hang=Math.max(1,Math.min(10,+temHang||4));
  const moiTo=cot*hang;
  const cls=moiTo<=2?'to-lon':(moiTo<=6?'to-vua':'to-nho');
  const vua=coChuVua(mot,cot,hang); // S16/R10: cỡ chữ lớn nhất vừa ô (đo thật), thay 3 mức cố định
  return `<div class="to ${cls}" data-co="${vua.co}"${vua.tran?' data-tran="1"':''} style="grid-template-columns:repeat(${cot},1fr);grid-template-rows:repeat(${hang},1fr);--co:${vua.co}pt;${temMauCSS()};${temKieuCSS()}">`
    +Array.from({length:moiTo}).map(()=>mot).join('')+`</div>`;
}
/* Tra theo id, KHÔNG theo lot — nhiều mẻ cố ý dùng chung 1 số lô (bug H2). */
/* Đánh dấu huỷ / bỏ huỷ 1 mẻ trên máy này — giữ nguyên bản ghi (không xoá), chỉ chặn in tem
   và không tính vào "Hôm nay đã ghi N mẻ". 25/08/2026, đồng bộ với cơ chế bên Admin. */
async function huyLo(id){
  const r=nk.find(x=>x.id===id); if(!r)return;
  if(r.huy){
    const c=await hoi('Bỏ huỷ lô này?',`Lô <b>${lotDep(r.lot)}</b> in tem được lại như bình thường.`,{nutOK:'Bỏ huỷ'});
    if(!c)return; r.huy=false; r.huyLuc='';
    ghiAudit('batch',r.id,'CANCEL',{huy:true},{huy:false});
    await luu(); ve(); bao('Đã bỏ huỷ'); return;
  }
  const c=await hoi('Huỷ lô này?',
    `Lô <b>${lotDep(r.lot)}</b> · ${esc(r.sp)} · ${fmt(r.sl)} kg sẽ KHÔNG in tem được nữa.<br><br>Dữ liệu vẫn còn, bỏ huỷ lại được bất cứ lúc nào.`,
    {nutOK:'Huỷ lô này',nguyHiem:true});
  if(!c)return;
  r.huy=true; r.huyLuc=new Date().toISOString();
  ghiAudit('batch',r.id,'CANCEL',{huy:false},{huy:true});
  await luu(); ve(); bao('Đã huỷ lô');
}

/* 27/08/2026 (phản hồi lần 3): khách yêu cầu 1 loạt sửa trên phiếu công thức —
   (1) dòng "Mẻ chuẩn công thức" đã ĐÚNG lấy từ p.kg/p.ml (số gắn ở đầu mặt hàng, không đổi
   theo lệnh sản xuất) — chỉ in ĐẬM để khỏi lẫn với dòng "Kế hoạch đầu vào" (số kg lệnh) ngay
   bên dưới, 2 số kg cạnh nhau dễ lẫn nếu không phân biệt rõ.
   (2) tên hương in đậm cho dễ đọc lúc pha.
   (3) "Hàm lượng nguyên liệu" — khách hiểu nhầm từng dòng phải bằng nguyên số kg đầu vào;
   thực chất đây là 1 trong NHIỀU loại cấu thành mẻ — thêm câu chú thích ngắn ngay dưới bảng.
   (4) "Số lô" không lặp lại chữ "Quy cách X" khi chỉ có ĐÚNG 1 dòng quy cách (đã hiện ở dòng
   "Quy cách đóng gói" ngay trên rồi, lặp lại là thừa) — chỉ lặp khi có NHIỀU dòng cần phân biệt.
   (5) bỏ dòng "Người pha" riêng, dồn vào cuối dòng "Kế hoạch đầu vào của lệnh".
   (6) thêm dòng "Đầu ra" — số bao/túi tính sẵn theo từng quy cách, đỡ phải tự chia tay. */
function phieuHTML(p){
  const kg=num(p.sl), ml=fragranceDoseG(p,kg,p.huongMe);
  const kv=(k,v)=>`<tr><td class="k">${esc(k)}</td><td>${v}</td></tr>`;
  const dong=(p.pb||[]).filter(d=>d.qc&&num(d.kg)>0);
  const quyCachDG=dong.length?dong.map(d=>esc(d.qc)).join(', '):'Chưa chọn quy cách đóng gói';
  const chiNhieuDong=dong.length>1;
  const soLo=dong.length
    ? dong.map(d=>{const rl=sinhLot(p,p.huongMe,d.qc,p.ngaysx||isoNay());
        const tien=chiNhieuDong?`Quy cách <b>${esc(d.qc)}</b> · `:'';
        return rl.thieu.length?`${tien}Chưa ra được số lô (${rl.thieu.map(esc).join(', ')})`:`${tien}Số lô <b>${lotDep(rl.lot)}</b>`}).join('<br>')
    : 'Chưa chọn quy cách đóng gói';
  // 27/08/2026 (phản hồi lần 4): bỏ lặp lại "quy cách:" ở đầu dòng Đầu ra khi CHỈ có 1 quy
  // cách (đã có ở dòng "Quy cách đóng gói" ngay trên rồi) — cùng cách xử lý với dòng Số lô.
  const dauRa=dong.length
    ? dong.map(d=>{const cb=chiaBao(d.kg,d.qc);
        const tien=chiNhieuDong?`${esc(d.qc)}: `:'';
        return cb?`${tien}<b>${cb.so}</b> ${donVi(d.qc)} × ${fmt(cb.dv)} kg${cb.du>0?` · dư ${fmt(cb.du)} kg`:''}`:`${tien}chưa tính được`}).join('<br>')
    : '—';
  const chuKy=(p.xacNhanCT&&p.xacNhanCTBoi)?esc(p.xacNhanCTBoi):'______________________';
  const nlList=nlDong(p,kg||num(p.kg));
  // 27/08/2026 (phản hồi lần 4): sửa lại chú thích SAI ở bản trước — hương liệu (đo bằng gram)
  // KHÔNG tính vào trọng lượng nguyên liệu (đo bằng kg): các dòng nguyên liệu cộng lại đã ĐỦ
  // đúng số kg đầu vào rồi, không cần cộng thêm hương liệu vào mới đủ.
  const nlRow=nlList.length
    ?`<tr><td class="k">Hàm lượng nguyên liệu</td><td>${nlList.map(x=>`${esc(x.ten||'?')}: <b>${fmt(x.kg)}</b> kg`).join('<br>')}
      <div style="font-size:9pt;color:#555;margin-top:3pt">* mỗi dòng là 1 loại nguyên liệu cấu thành mẻ — cộng các dòng nguyên liệu lại là đã đủ đúng số kg đầu vào (hương liệu tính riêng theo gram ở dòng trên, không tính vào trọng lượng nguyên liệu).</div></td></tr>`
    :'';
  return `<div class="to" style="display:block;padding:14pt"><div class="tem" style="max-width:480pt;margin:0 auto">
    <div class="t1">PHIẾU CÔNG THỨC PHA CHẾ</div>
    <div class="t2">${esc(p.ten)}</div>
    <table>
      ${kv('Phiên bản công thức', esc('v'+(num(p.recipeVersion)||1)+(p.recipeEffectiveFrom?' · hiệu lực từ '+vnNgay(p.recipeEffectiveFrom.slice(0,10)):'')))}
      ${kv('Mẻ chuẩn công thức', `<b>${fmt(num(p.kg))} kg ứng ${fmt(num(p.ml))} g hương</b>`)}
      ${kv('Hương của mẻ này', p.huongMe?`<b>${esc(p.huongMe)}</b>`:'chưa chọn')}
      ${kv('Kế hoạch đầu vào của lệnh', (kg>0?fmt(kg)+' kg':'chưa nhập')+' · Người pha: '+esc(toi||'________'))}
      ${kv('Hương liệu cần đổ', kg>0?fmt(Math.round(ml*10)/10)+' g':'—')}
      ${nlRow}
      ${kv('Ngày sản xuất', esc(vnNgay(p.ngaysx||isoNay())))}
      <tr><td class="k">Quy cách đóng gói</td><td>${quyCachDG}</td></tr>
      <tr><td class="k">Đầu ra</td><td>${dauRa}</td></tr>
      <tr><td class="k">Số lô</td><td>${soLo}</td></tr>
    </table>
    <div class="kh" style="margin-top:8pt">Tôi xác nhận đã đọc và sẽ pha đúng công thức trên. Nếu sau này phát sinh sai lệch, phiếu này dùng để đối chiếu trách nhiệm.<br><br>Chữ ký người chịu trách nhiệm sản xuất: ${chuKy}</div>
  </div></div>`;
}

/* 26/08/2026 — PATCH V1.1 mục P1-B: trạng thái vòng đời tối giản của MỘT DÒNG đã ghi trong
   nk[] — PLANNED/CONFIRMED đã có sẵn ở p.daInPhieu/p.xacNhanCT (không cần một field mới song
   song với hai cờ đó). Từ đây (RECORDED) trở đi mới cần theo dõi trên chính record, và trạng

const TRANG_THAI_SX={CANCELLED:{n:'Đã huỷ',mau:'var(--red)'},RECORDED:{n:'Đã ghi — chờ chốt thực tế',mau:'var(--am)'},COMPLETED:{n:'Đã chốt thực tế',mau:'var(--cy)'}};
function trangThaiSXCua(r,dsBaoCao){
  if(!r)return null;

/* 26/08/2026 — PATCH V1.1 mục P1-A: snapshot NỘI DUNG công thức (khác snapshot CHI PHÍ đã có
   sẵn ở P0/bản O) — chụp lại đúng công thức tại thời điểm ghi mẻ, gắn cứng vào record, để sau
   này Admin sửa công thức gốc không làm thay đổi ý nghĩa của mẻ đã ghi trước đó. Trả object
   JSON thuần (không giữ tham chiếu tới sp[]) nên an toàn khi serialize lưu/đồng bộ. */
function recipeSnapshot(p,selected,kg){
  return {
    version:num(p.recipeVersion)||1,
    effectiveFrom:p.recipeEffectiveFrom||'',
    productName:p.ten,
    basisKg:num(p.kg), fragranceDoseGPerBasis:num(p.ml),
    selectedFragrance:selected||'',
    selectedDoseG:Math.round(fragranceDoseG(p,kg,selected)*10)/10,
    nguyenLieu:(p.congThucNL||[]).map(x=>({ten:String((x&&x.ten)||''),kgTrenMe:num(x&&x.kg)})),
    pkb:!!p.pkb, pkbPhut:p.pkbPhut||'', pkbChat:p.pkbChat||'',
    congThucPhun:p.pkb?ctHL(p).ct:'', congThucPhunRieng:p.pkb?!!ctHL(p).rieng:false,
    taoLuc:new Date().toISOString()
  };
}

/* ── FILE IN MANG SANG MÁY KHÁC — 10/09/2026 (Admin S13 / Nhân viên R9) ──
   Khách: "máy in của máy tạo phiếu in tem có khi bị hư, cần chuyển sang máy khác nên cần backup
   sang được máy khác hoặc chuyển giao bản in sang máy khác dễ dàng".
   taiFileIn() lưu ĐÚNG bản in (cùng temHTML/trangTem/phieuHTML, cùng khổ A4, cùng cỡ chữ) thành
   MỘT file .html tự chứa. Gửi file qua Zalo/USB/email sang bất kỳ máy nào có máy in, mở bằng trình
   duyệt rồi bấm In — máy đó KHÔNG cần cài Peroma, KHÔNG cần mạng, KHÔNG cần đồng bộ.
   Kiểu in lấy thẳng từ khối @media print của chính trang này lúc bấm (không chép tay lần 2) nên file
   luôn in giống hệt in tại máy. File chỉ chứa nội dung tem/phiếu — không có mật khẩu, địa chỉ
   Apps Script hay dữ liệu nào khác. */
function cssBanIn(){
  const t=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  // S16/R10: kiểu tem nằm giữa 2 mốc ══TEM-CSS══ (dùng chung lúc in + khung đo); còn @media print chỉ ẩn/hiện
  const m0=t.indexOf('/* ══TEM-CSS══'), m1=t.indexOf('/* ══HẾT-TEM-CSS══ */');
  const khoiTem=(m0>=0&&m1>m0)?t.slice(m0,m1)+'\n':'';
  return khoiTem+cssBanInCu(t);
}
function cssBanInCu(t){
  const i=t.indexOf('@media print{'); if(i<0)return '';
  const j=t.indexOf('{',i); let d=0;
  for(let k=j;k<t.length;k++){if(t[k]==='{')d++;else if(t[k]==='}'){d--;if(!d)return t.slice(j+1,k)}}
  return '';
}
function taiFileIn(tenFile,tieuDe,moTa,htmlIn){
  // bỏ đúng 1 dòng "ẩn mọi thứ trừ bản in" — trong file chỉ có thanh nút In + bản in, và thanh nút
  // tự ẩn khi in (xem @media print cuối file)
  const css=cssBanIn().split('\n').filter(l=>!/body>\*\{display:none/.test(l)).join('\n');
  // chữ trên tem kế thừa cỡ chữ + độ giãn dòng của trang app — chép đúng 2 giá trị đó sang file,
  // không thì tem trong file thấp/cao hơn tem in tại máy (đo được: 427px so với 507px)
  const ci=getComputedStyle(document.getElementById('temIn')), co=parseFloat(ci.fontSize)||16,
        gd=(parseFloat(ci.lineHeight)/co)||1.4;
  const doc='<!DOCTYPE html>\n<html lang="vi"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(tieuDe)+'</title><style>'
    +'body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111}#temIn{font-size:'+co+'px;line-height:'+(Math.round(gd*1000)/1000)+'}'
    +'.thanh{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px;display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.06)}'
    +'.thanh b{font-size:16px}.thanh span{font-size:13px;color:#555;flex:1;min-width:220px;line-height:1.45}'
    +'.thanh button{font:inherit;font-size:15px;font-weight:700;background:#F5A524;color:#1C1C1E;border:0;border-radius:10px;padding:11px 24px;cursor:pointer}'
    +css
    +'@media screen{html,body{background:#E9E9EC!important}#temIn{padding:16px}'
    +'#temIn .to{background:#fff;margin:0 auto 16px;box-shadow:0 2px 14px rgba(0,0,0,.16)}'
    +'#temIn>:not(.to){background:#fff;max-width:198mm;margin:0 auto 16px;padding:8mm;box-shadow:0 2px 14px rgba(0,0,0,.16)}}'
    +'@media print{.thanh{display:none!important}#temIn{padding:0}}'
    +'</sty'+'le></he'+'ad><bo'+'dy><div class="thanh"><b>PEROMA · '+esc(tieuDe)+'</b><span>'+esc(moTa)+'</span>'
    +'<button type="button" onclick="window.print()">In</button></div><div id="temIn">'+htmlIn+'</div></bo'+'dy></ht'+'ml>'; // tách chữ thẻ để mã nguồn app chỉ có ĐÚNG 1 thẻ đóng body/html thật
  const b=new Blob([doc],{type:'text/html'}), u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=String(tenFile).replace(/[\\/:*?"<>|\s]+/g,'-').replace(/-+/g,'-');
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);
  return doc;
}

/* ── LÔ DO MÁY KHÁC GHI (qua Google Sheet) — 10/09/2026 (R9) ──
   Máy nhân viên trước giờ chỉ tải CẤU HÌNH, không thấy mẻ do máy nhân viên khác ghi — nên khi máy
   in của máy A hỏng (hoặc máy A hỏng hẳn), máy B không in được tem cho lô máy A đã ghi.
   taiLoHeThong() đọc nhật ký trên Sheet bằng đúng hành động 'nhatky' Code.gs đã có sẵn (không đổi
   Code.gs, không cần triển khai lại). Các mẻ tải về giữ RIÊNG trong nkHT, CHỈ NẰM TRONG BỘ NHỚ:
   - KHÔNG gộp vào nk, KHÔNG lưu xuống máy, KHÔNG gửi ngược lên Sheet (không thể tạo mẻ trùng);
   - chỉ để xem và in tem; không huỷ/sửa được lô của máy khác từ đây;
   - tắt app mở lại là mất, cần thì bấm tải lại. */
/* 17/10/2026 (khách: "máy tôi và máy nhân viên đều đồng bộ hẳn hoi nhưng danh sách lô khác nhau"): trước đây chỉ tải khi BẤM nút và
   mất khi mở lại app → máy chưa bấm không thấy lô của máy khác. Nay TỰ TẢI lúc mở app + mỗi 2 phút, và nhớ bản tải gần nhất trên
   máy (localStorage riêng, vẫn KHÔNG gộp vào nk, KHÔNG gửi ngược lên). Bấm nút = tải ngay. */
let nkHT=[], nkHTLuc='';
try{const c=JSON.parse(localStorage.getItem('peroma_nkHT')||'null');if(c&&Array.isArray(c.ds)){nkHT=c.ds;nkHTLuc=c.luc||''}}catch(e){}
async function taiLoHeThong(im){
  if(!DONGBO_URL){if(!im)bao('Máy này chưa khai kết nối Google Sheet — vào tab Dữ liệu để khai');return}
  if(!im)bao('Đang tải các lô trên hệ thống…');
  try{
    const j=await dbGoi(DONGBO_URL+'?mk='+encodeURIComponent(LEGACY_SHARED_TOKEN)+'&a=nhatky');
    if(!j||!j.ok||!Array.isArray(j.nk))throw new Error((j&&j.loi)||'hệ thống không trả dữ liệu');
    const coSan=new Set(nk.map(r=>r.id));
    nkHT=j.nk.filter(r=>r&&r.id&&r.lot&&!coSan.has(r.id)).map(r=>Object.assign({},r,{_heThong:true}));
    nkHTLuc=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});

  if(khongTem(p)){await hoi('Mặt hàng không in tem phụ',`<b>${esc(p.ten)}</b> được cài <b>không in tem phụ</b> — bao bì đã có đủ thông tin, chỉ cần ghi số lô <b>${esc(lotDep(r.lot))}</b>.`,{nutOK:'Đã hiểu',nutHuy:'Đóng'});return}
  const th=temThieu(p);

    {nutOK:'Đã hiểu',nutHuy:'Đóng'});return}
  // S17/R11: mở bảng dàn trang khi bấm "Dàn trang", hoặc khi khổ đang lưu không vừa / chữ nhỏ chưa được duyệt
  let pIn=p;
  if(luonHoi||xetKhoTem(r,p)){ const kqDT=await moDanTem(r,p,quaFile); if(!kqDT)return;
    if(kqDT.hstem&&kqDT.hstem!==true){pIn={...p,hstem:kqDT.hstem}; bao(kqDT.daLuu?'Đã lưu nội dung sửa vào hồ sơ tem':'In với nội dung sửa lần cuối — hồ sơ tem không đổi')} }
  const htmlTem=trangTem(r,pIn);
  if(!quaFile)$('temIn').innerHTML=htmlTem; // đặt bản in NGAY (trước lần chờ lưu) như hành vi cũ
  // lô của máy khác: không đánh dấu gì lên máy này (bản ghi đó không thuộc máy này, không lưu)
  if(!r._heThong){r.daInTem=true;r.inTemLuc=new Date().toISOString();await luu()}
  if(quaFile){
    taiFileIn('PEROMA-tem-lo-'+r.lot+'-'+r.sp+'.html','Tem phụ lô '+lotDep(r.lot),
      r.sp+' · '+(r.huong||'')+' · '+(r.quyCach||'')+' · ngày SX '+vnNgay(r.ngaysx)+'. Mở file này trên máy có máy in rồi bấm In — cần thêm bản thì chọn "Số bản in" trong hộp thoại in.',htmlTem);
    bao('Đã lưu file tem — gửi file sang máy có máy in (Zalo, USB…), mở bằng trình duyệt rồi bấm In');
    return}
  bao('1 trang tem đã sẵn sàng — cần thêm bản thì dùng "Số bản in" trong hộp thoại in.');

async function kiemRoiGhi(){
  if(dangGhi)return;                                   // (1) chặn bấm hai lần
  const p=sp[moSP]; if(!p)return;
  const ngay=p.ngaysx||isoNay(), kg=num(p.sl);
  if((p.tt||'ok')==='dinh'){await hoi('Không ghi được','Mặt hàng đang đình chỉ sản xuất.',{nutOK:'Đã hiểu',nutHuy:'Đóng'});return}
  if(!toi){await hoi('Chưa chọn tên','Bấm nút tên ở góc trên bên phải để chọn tên bạn.',{nutOK:'Đã hiểu',nutHuy:'Đóng'});return}
  if(kg<=0){bao('Chưa nhập số kg đầu vào');return}
  if(!p.huongMe){bao('Chưa chọn hương');return}
  if(!p.daInPhieu||!p.xacNhanCT){bao('Cần in phiếu công thức và xác nhận trước khi ghi mẻ');return}
  const dong=(p.pb||[]).filter(d=>d.qc&&num(d.kg)>0);
  if(!dong.length){bao('Chưa nhập quy cách đóng gói');return}
  const tq=dong.map(d=>d.qc).filter((v,k,a)=>a.indexOf(v)!==k);
  if(tq.length){await hoi('Trùng quy cách',`Quy cách <b>${esc(tq[0])}</b> có ở hai dòng. Gộp lại làm một.`,{nutOK:'Đã hiểu',nutHuy:'Đóng'});return}
  const kq=dong.map(d=>({d,r:sinhLot(p,p.huongMe,d.qc,ngay)}));
  const hong=kq.filter(x=>x.r.thieu.length);
  if(hong.length){await hoi('Chưa ra được số lô',
    hong.map(x=>`<b>${esc(x.d.qc)}</b> — ${x.r.thieu.map(esc).join(' · ')}`).join('<br>')+
    `<br><br>Thiếu mã số thì báo quản lý.`,{nutOK:'Đã hiểu',nutHuy:'Đóng'});return}

  // (2) chặn ghi trùng — cùng SP, hương, ngày, kg
  const trung=nk.find(r=>r.sp===p.ten&&r.huong===p.huongMe&&r.ngaysx===ngay&&num(r.sl)===num(dong[0].kg));
  if(trung){const c=await hoi('Hình như mẻ này đã ghi rồi',
    `Đã có mẻ <b>${esc(p.ten)}</b> · hương <b>${esc(p.huongMe)}</b> · <b>${fmt(num(trung.sl))} kg</b> ghi ngày <b>${vnNgay(ngay)}</b>.<br>Số lô <b>${lotDep(trung.lot)}</b>.<br><br>Đây là mẻ MỚI hay bấm nhầm lần hai?`,
    {nutOK:'Mẻ mới, cứ ghi',nutHuy:'Bấm nhầm, hủy',nguyHiem:true}); if(!c)return}

  // 27/08/2026 (phản hồi lần 4): khách yêu cầu bỏ hẳn bước "Đọc lại rồi xác nhận" — bấm
  // "Xác nhận" (trước đây "Kiểm tra rồi ghi") là ghi thẳng luôn, không qua hộp thoại đọc lại
  // nữa. Việc kiểm tra công thức đã có ở bước in phiếu + xác nhận công thức (data-xnct) rồi.
  dangGhi=true;
  const goc='M'+Date.now();
  /* 26/08/2026 — PATCH V1.1 mục P0.2 (UNSCENTED): "Không mùi" → dm=0 nên mlDung luôn ra 0
     bất kể công thức p.ml/p.kg của mặt hàng — không tiêu hao hương, không phát sinh chi phí. */
  const dm=isUnscented(p.huongMe)?0:(num(p.kg)>0?num(p.ml)/num(p.kg):0);
  const chung={ts:new Date().toISOString(),sp:p.ten,ngaysx:ngay,nv:toi,
    maSP:hai(p.maSP),maHuong:hai(maHuong[p.huongMe]),thangSX:mmyy(ngay),
    huong:p.huongMe,huongList:[...(p.huongs||[])],meChuan:num(p.kg),mlChuan:num(p.ml),
    pkb:!!p.pkb,pkbPhut:p.pkbPhut||'',pkbChat:p.pkbChat||'',
    pkbCT:p.pkb?ctHL(p).ct:'',pkbCTRieng:p.pkb?ctHL(p).rieng:false,
    nguyenlieu:p.nguyenlieu||'',trangThai:p.tt||'ok',kgVao:kg,soDong:kq.length,tuNV:1,daGui:0,
    /* PATCH V1.1 mục P1-A (acceptance #5): dùng ĐÚNG timestamp đã lưu lúc bấm "Xác nhận công
       thức" (p.xacNhanCTLuc) — không tạo timestamp mới ở đây nữa. Nếu vì lý do cũ (dữ liệu từ
       trước bản vá, hoặc đường vòng nào đó) mà chưa có, mới rơi về giờ hiện tại để không rỗng. */
    xacNhanCT:true,xacNhanCTLuc:p.xacNhanCTLuc||new Date().toISOString(),xacNhanCTBoi:p.xacNhanCTBoi||toi,
    recipeVersion:num(p.recipeVersion)||1,recipeSnapshot:recipeSnapshot(p,p.huongMe,kg),
    /* PATCH V1.1 mục P1-B: batchId chung cho MỌI dòng quy cách sinh ra từ CÙNG một lần bấm
       "Kiểm tra rồi ghi" — một lệnh SX có thể ra nhiều quy cách (VD 5kg + 10kg cùng lúc), mỗi
       dòng vẫn có id riêng (goc+'-'+n như cũ) nhưng giờ nhận diện được là "cùng một đợt sản
       xuất" qua batchId, phục vụ báo cáo/tra cứu sau này mà không đổi gì ở sinhLot()/LOT. */
    batchId:goc,
    /* 26/08/2026 — PATCH KIẾN TRÚC V1, mục D1: bản Nhân viên KHÔNG giữ bảng giá hương liệu
       (nguonHuong/huongDangDung chỉ có ở Admin) nên KHÔNG tự snapshot giá ở đây — luôn gửi
       null, để Admin snapshot đúng 1 lần lúc nhận mẻ lần đầu (xem #nvIn ở bản Admin, mục D2).
       Sau khi đã có giá trị (không null) thì không được ghi đè lại nữa.
       26/08/2026 — PATCH V1.1 mục P0.2: RIÊNG "Không mùi" thì biết chắc chi phí = 0 ngay từ
       đây (không cần chờ giá hương), nên snapshot thẳng 0/0 luôn, khỏi qua bước null. */
    giaHuongTheoGLucSX:isUnscented(p.huongMe)?0:null,
    chiPhiHuongLucSX:isUnscented(p.huongMe)?0:null};
  kq.forEach((x,k)=>{const g=num(x.d.kg), cb=chiaBao(g,x.d.qc);
    x.id=goc+'-'+(k+1); // lưu lại id thật đã sinh — dùng cho nút "In tem" trong hộp thoại "Đã ghi xong"
    nk.push({...chung,id:x.id,lot:x.r.lot,sl:g,maQC:hai(maQC[x.d.qc]),quyCach:x.d.qc,
      soBao:cb?cb.so:'',kgBao:cb?cb.dv:'',kgDu:cb?cb.du:'',mlDung:Math.round(dm*g*10)/10})});
  ghiAudit('batch',goc,'RECORD_BATCH',null,
    {sp:p.ten,huong:p.huongMe,soDong:kq.length,quyCach:kq.map(x=>x.d.qc),tongKg:kg,lot:kq.map(x=>x.r.lot)});
  p.sl='';p.pb=[];p.huongMe='';p.daInPhieu=false;p.xacNhanCT=false;p.xacNhanCTBoi='';p.xacNhanCTSnap='';p.xacNhanCTLuc=''; pbTuDong(p);
  // 13/09/2026: khách hỏi lại "thiếu chỗ kiểm tra/sửa tem phụ lần cuối" — bỏ hộp thoại (27/08)
  // vẫn đúng (khách từng yêu cầu), nhưng phải tự đưa NV tới đúng lô vừa ghi ở tab Tra lô, không
  // bắt tự tìm trong dropdown — "Dàn trang & sửa tem lần cuối" đã có sẵn ở đó (xem veLo()).
  tab='lo'; traLot=kq[0].r.lot;
  await luu(); dangGhi=false; ve();
  dbDayMe(nk.filter(r=>r.id.startsWith(goc)));
  bao(`Đã lưu ${kq.length} lô: `+kq.map(x=>lotDep(x.r.lot)).join(', ')+' — sang tab Tra lô để in/sửa tem.');
  huyHieu('🏷️',`Đã ghi ${kq.length} lô · ${p.ten}`,kq.length>1?'và '+kq.slice(1).map(x=>lotDep(x.r.lot)).join(', '):'mở tab Tra lô để in / sửa tem',lotDep(kq[0].r.lot));
}

function baoBanMoi(moi){
  if(!moi||!BAN_HIEN_TAI||moi===BAN_HIEN_TAI||moi===banDaBoQua||document.getElementById('banMoi'))return false;
  const d=document.createElement('div');d.id='banMoi';d.setAttribute('role','alert');
  d.style.cssText='position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:max-content;max-width:calc(100% - 24px);padding:12px 14px;border-radius:14px;background:var(--card,#fff);color:var(--txt,var(--tx,#222));border:1.5px solid var(--acc,var(--am,#b8860b));box-shadow:0 8px 28px rgba(0,0,0,.18);font-size:14px;line-height:1.4';
  d.innerHTML='<span>Đã có <b>phiên bản mới</b> ('+esc(moi)+', đang dùng '+esc(BAN_HIEN_TAI)+'). Tải lại trang để dùng bản mới — dữ liệu đã lưu không mất.</span>'
    +'<button type="button" id="banMoiOK" style="font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;background:var(--acc,var(--am,#b8860b));color:var(--onAcc,#fff)">Tải lại</button>'
    +'<button type="button" id="banMoiSau" style="font:inherit;border:1px solid currentColor;border-radius:10px;padding:8px 12px;cursor:pointer;background:transparent;color:inherit;opacity:.75">Để sau</button>';
  document.body.appendChild(d);
  d.querySelector('#banMoiOK').onclick=()=>location.reload();
  d.querySelector('#banMoiSau').onclick=()=>{banDaBoQua=moi;d.remove()};
  return true;
}
async function kiemTraBanMoi(){
  if(document.hidden||!navigator.onLine)return;
  try{const r=await fetch(location.pathname,{cache:'no-store'});if(r.ok)baoBanMoi(banTrongHTML(await r.text()))}catch(e){}
}
(function(){
  const web=/^https?:$/.test(location.protocol)&&!/googleusercontent\.com$|script\.google\.com$/.test(location.hostname);
  if(!web||!BAN_HIEN_TAI)return;
  setInterval(kiemTraBanMoi,5*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)kiemTraBanMoi()});
})();
</script>
</body>
</html>
