<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 10/09/2026: cho phép 'Thêm vào màn hình chính' mở toàn màn hình như app, thanh trạng thái
     cùng màu nền tối. Nằm ngay trong HTML — không tạo thêm file manifest (giữ đúng phạm vi
     ngoại lệ khách đã duyệt: chỉ thêm 1 file sw.js). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peroma QL">
<meta name="theme-color" content="#FFFFFF">
<!-- 10/09/2026 (S10/R8): mặc định SÁNG theo mẫu Figma. Máy nào đã chọn tối thì gắn lớp "toi" lên
     <html> TRƯỚC khi vẽ trang để không bị chớp màn sáng lúc mở app. Chỉ đọc 1 khoá hiển thị riêng. -->
<script>try{if(localStorage.getItem('peroma:sangtoi')==='toi')document.documentElement.classList.add('toi')}catch(e){}</script>
<title>Pha hương liệu — Quản trị</title>
<style>
/* ══ BỐ CỤC & MÀU THEO MẪU FIGMA "Full Dashboard with Widgets, Sidebar" — 10/09/2026 (S10 / R8) ══
   Khách chọn mẫu Figma (Giliard Gomes, Figma Community) thay cho giao diện Zaka của bản S9/R7:
   nền trắng xám, thẻ trắng bo tròn, điểm nhấn cam, biểu đồ xanh lá; máy tính có thanh menu nổi bên
   trái, điện thoại giữ tab trên cùng. Mặc định SÁNG như mẫu; nút 🌙/☀ đổi sang bản tối cùng tông.
   CHỈ đổi hiển thị + thêm trang Tổng quan chỉ-đọc ở Admin: không đổi logic, dữ liệu, đồng bộ.
   Tên biến màu cũ của Peroma (--amber, --cyan, --panel…) giữ nguyên và trỏ sang bảng mới.
   Ý nghĩa màu: --amber = nhấn chính (cam đậm để chữ đọc được); --cyan = thông tin/số lô (xanh
   dương); --ok = đúng/khớp (xanh lá); --warnTx = lệch/tạm/chưa lưu; --badTx = lỗi.
   Mọi màu chữ đã đo tương phản >= 4.5 trên mọi nền nó nằm lên, ở cả 2 chế độ. */
:root{
  /* Sáng — theo mẫu Figma */
  --bg:#F4F4F5; --bg2:#EFEFF1; --card:#FFFFFF; --c2:#F6F6F7; --line:#E9E9EC; --tx:#1C1C1E; --tx2:#585860;
  --acc:#F5A524; --acc2:#FFCB7D; --accSoft:#FFF4E0; --brand:#FFFFFF; --brandTx:#1C1C1E; --chart:#4CB86F;
  --ok:#23794A; --warn:#E0901A; --bad:#E5534B; --pur:#6B45C0; --info:#2A62A8;
  --okBg:#E7F6EC; --badBg:#FDECEA; --warnBg:#FFF3DC; --purBg:#F1ECFB; --infoBg:#EAF2FC;
  --shadow:0 12px 32px -18px rgba(20,20,30,.22); --shadowSm:0 1px 2px rgba(20,20,30,.04); --btnGlow:0 6px 16px -8px rgba(245,165,36,.55);
  --tx3:#6B6B73; --line2:#DCDCE0; --rowAlt:#FAFAFA; --rowOn:#FFF6E6;
  --accTx:#945400; --warnTx:#8F5A00; --badTx:#C0342C; --badTx2:#9E2A23; --infoTx:#2A62A8;
  --okLine:#BFE3CB; --warnLine:#F6D9A6; --badLine:#F3C4BF; --infoLine:#C4D8F2;
  --btnA:#F5A524; --btnB:#F9BD55; --onAcc:#1C1C1E;
  /* Tên biến cũ của Peroma -> trỏ sang bảng mới */
  --panel:var(--card); --row:var(--card); --row-alt:var(--rowAlt); --row-on:var(--rowOn); --line-2:var(--line2);
  --txt:var(--tx); --txt-2:var(--tx2); --txt-3:var(--tx3);
  --amber:var(--accTx); --red:var(--badTx); --red-dim:var(--badBg); --cyan:var(--infoTx); --cyan-dim:var(--infoBg);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Roboto Mono","DejaVu Sans Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root.toi{
  /* Tối — cùng tông với mẫu (xám trung tính + cam), cho ai quen màn tối trong xưởng */
  --bg:#111113; --bg2:#141416; --card:#1C1C1F; --c2:#26262A; --line:#2E2E33; --tx:#EDEDEF; --tx2:#A6A6AF;
  --acc:#F5A524; --acc2:#B97A1C; --accSoft:#2B2213; --brand:#1C1C1F; --brandTx:#EDEDEF; --chart:#5BC47A;
  --ok:#5BC47A; --warn:#F5A524; --bad:#E5534B; --pur:#B39DFA; --info:#6FA8F5;
  --okBg:#15291C; --badBg:#2E1716; --warnBg:#2B2213; --purBg:#221B38; --infoBg:#14233A;
  --shadow:0 14px 34px -18px rgba(0,0,0,.7); --shadowSm:0 1px 2px rgba(0,0,0,.3); --btnGlow:0 6px 16px -8px rgba(245,165,36,.45);
  --tx3:#909099; --line2:#3A3A40; --rowAlt:#19191C; --rowOn:#2A2419;
  --accTx:#FFB547; --warnTx:#FFB547; --badTx:#FF7B72; --badTx2:#FFC2BC; --infoTx:#6FA8F5;
  --okLine:#2A5236; --warnLine:#5A4520; --badLine:#5C2B28; --infoLine:#28446B;
  --btnA:#F5A524; --btnB:#F9BD55; --onAcc:#1C1C1E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:var(--sans);color:var(--txt);font-size:15px;line-height:1.4;
  padding-bottom:calc(60px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.app{max-width:760px;margin:0 auto}

.stick{position:sticky;top:0;z-index:20;background:var(--panel)}
.bar{display:flex;align-items:center;gap:10px;padding:calc(9px + env(safe-area-inset-top)) 12px 9px}
.bar h1{margin:0;font-size:14px;font-weight:700;letter-spacing:.02em;flex:1;text-transform:uppercase}
.adm{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.12em;
  background:var(--amber);color:var(--onAcc);padding:2px 6px;border-radius:4px;vertical-align:2px}
.bar h1 i{display:block;font-style:normal;font-size:10.5px;font-weight:600;color:var(--txt-3);letter-spacing:.12em;margin-top:2px}
.tbtn{font:inherit;font-size:12.5px;font-weight:700;background:transparent;color:var(--txt-2);
  border:1px solid var(--line-2);border-radius:7px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.tbtn.on{background:var(--amber);border-color:var(--amber);color:var(--onAcc)}

.tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tab{flex:1;font:inherit;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;color:var(--txt-3);border:none;border-bottom:2px solid transparent;
  padding:12px 4px;cursor:pointer}
.tab.on{color:var(--amber);border-bottom-color:var(--amber);background:var(--warnBg)}

.apply{border-bottom:1px solid var(--line);padding:9px 12px 10px}
.arow{display:flex;align-items:center;gap:8px}
.alab{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--txt-3);text-transform:uppercase;white-space:nowrap}
.ainp{width:96px;flex:none;font-family:var(--mono);font-size:18px;font-weight:700;
  background:var(--bg);color:var(--txt);border:1px solid var(--line-2);border-radius:7px;
  padding:7px 10px;text-align:right;-moz-appearance:textfield}
.ainp::-webkit-outer-spin-button,.ainp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ainp:focus{outline:none;border-color:var(--amber)}
.abtn{font:inherit;font-size:12.5px;font-weight:700;background:var(--row);color:var(--txt-2);
  border:1px solid var(--line-2);border-radius:7px;padding:9px 12px;cursor:pointer;white-space:nowrap}
.quick{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.q{font-family:var(--mono);font-size:12.5px;font-weight:700;background:var(--row);color:var(--txt-2);
  border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap}

.find{padding:10px 12px 0}
.find input{width:100%;font:inherit;font-size:15px;background:var(--panel);color:var(--txt);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.find input::placeholder{color:var(--txt-3)}
.find input:focus{outline:none;border-color:var(--line-2)}

.thead{display:flex;align-items:center;gap:8px;padding:11px 12px 7px;
  font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--txt-3);
  text-transform:uppercase;border-bottom:1px solid var(--line)}
.c-no{width:22px;flex:none}
.c-nm{flex:1;min-width:0}
.c-me{width:78px;flex:none;text-align:right}
.c-cd{width:80px;flex:none;text-align:right}

.rows{display:flex;flex-direction:column}
.r{border-bottom:1px solid var(--line);background:var(--row)}
.r:nth-child(even){background:var(--row-alt)}
.r.open{background:var(--row-on)}
.r.pkb{box-shadow:inset 3px 0 0 var(--red)}
.rmain{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.no{width:22px;flex:none;font-family:var(--mono);font-size:12px;color:var(--txt-3);font-weight:600}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.bdg{font-size:9.5px;font-weight:800;letter-spacing:.07em;padding:2px 6px;border-radius:4px;text-transform:uppercase}
.bdg.pkb{background:var(--red-dim);color:var(--red)}
.bdg.sc{background:var(--cyan-dim);color:var(--cyan);text-transform:none;letter-spacing:.02em;font-size:10.5px;font-weight:700}
.bdg.unsaved{background:var(--warnBg);color:var(--warnTx);text-transform:none;letter-spacing:.02em;font-size:10px}
.when{font-family:var(--mono);font-size:10px;color:var(--txt-3)}
.me{width:78px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.meinp{width:52px;font-family:var(--mono);font-size:16px;font-weight:700;color:var(--cyan);
  background:var(--bg);border:1px solid var(--line-2);border-radius:6px;
  padding:5px 7px;text-align:right;-moz-appearance:textfield}
.meinp::-webkit-outer-spin-button,.meinp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.meinp:focus{outline:none;border-color:var(--cyan)}
.meu{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--txt-3)}
.cd{width:80px;flex:none;text-align:right;font-family:var(--mono)}
.cd b{font-size:21px;font-weight:700;color:var(--amber);display:block;line-height:1.1}
.cd span{font-size:10px;font-weight:700;color:var(--txt-3);letter-spacing:.08em}
.r.zero .cd b{color:var(--txt-3)}
/* 27/08/2026 (phản hồi lần 2): khách thấy "Cần dùng" (g) và "Định lượng hương" (g) không
   khớp — vì "Cần dùng" luôn tính theo cột "Mẻ" (số kg đang định làm NGAY bây giờ), còn
   "Định lượng hương" trong chi tiết là con số GỐC cho mỗi mẻ chuẩn. Khi 2 số kg này khác
   nhau thì "Cần dùng" khác "Định lượng hương" là ĐÚNG theo tỉ lệ, không phải lỗi — viền ô
   Mẻ đổi màu vàng để tự thấy ngay khi nào 2 giá trị đang KHÁC mẻ chuẩn, cộng chú thích
   (chạm/rê chuột vào để xem công thức tính) ở cả 2 ô. */
.me.khac .meinp{border-color:var(--warnTx);color:var(--warnTx)}

.det{display:none;padding:2px 12px 14px;border-top:1px solid var(--line)}
.r.open .det{display:block}
.calc{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:11px 13px;margin-top:11px;
  font-family:var(--mono);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.calc .l{font-size:12.5px;color:var(--txt-2)}
.calc .v{font-size:22px;font-weight:700;color:var(--amber)}
.grid{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.fld label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--txt-3);
  text-transform:uppercase;margin-bottom:5px}
.fld input,.fld textarea{width:100%;font:inherit;font-size:15px;background:var(--bg);color:var(--txt);
  border:1px solid var(--line);border-radius:7px;padding:10px 11px}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--amber)}
.fld input[readonly],.fld textarea[readonly]{color:var(--txt-2);border-color:var(--line)}
.fld textarea{resize:vertical;min-height:52px}
.mn{font-family:var(--mono);font-weight:700}
.two{display:flex;gap:9px}
.two>.fld{flex:1;min-width:0}
/* 27/08/2026: ô còn thiếu bắt buộc phải điền trước khi lập hồ sơ sản xuất — khoanh đỏ toàn
   khối, giống cách hồ sơ tem đã khoanh đỏ từng ô (.thieu) — nhấn vào tên mặt hàng để mở thẻ
   ra là thấy ngay khối nào đang bị khoanh. */
.fld.need{border:1px solid var(--red);border-radius:8px;padding:9px 10px;background:var(--red-dim)}
.fld.need>label{color:var(--red)}
/* 27/08/2026: tên mặt hàng sửa được ngay tại chỗ hiển thị — bỏ ô "Tên sản phẩm" riêng phía
   dưới (khách phản hồi trùng lặp, sửa 1 nơi mà phải nhớ có 2 ô). */
.tennm{font:inherit;font-size:15px;font-weight:800;background:transparent;color:inherit;
  border:1px solid transparent;border-radius:5px;padding:1px 5px;margin:-2px -5px;width:100%;min-width:0}
.tennm:hover{border-color:var(--line-2)}
.tennm:focus{outline:none;border-color:var(--amber);background:var(--bg)}
/* 27/08/2026: nhấn thông báo "còn N mã chưa cấp" thì cuộn tới đúng dòng đang thiếu mã và
   nháy đỏ 1 lần cho dễ tìm — dòng thiếu mã vốn đã khoanh đỏ sẵn (.marow.trong), đây chỉ
   thêm hiệu ứng nháy để mắt bắt được ngay giữa danh sách dài. */
@keyframes flashRed{0%,100%{background:transparent}25%,75%{background:var(--red-dim)}}
/* 27/08/2026 (phản hồi lần 2): khách nói khối cảnh báo "Chưa đúng chuẩn..." cũ (1 đoạn văn
   dài, nhiều mệnh đề) là "vô nghĩa" — vẫn GIỮ đúng luật (khai đủ đúng bằng mẻ chuẩn mới
   dùng làm căn cứ pha chế), chỉ đổi CÁCH HIỂN THỊ: 1 dòng số liệu to rõ + 1 thanh tiến độ
   màu theo trạng thái, thay cho đoạn văn dài. */
.nlsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.nlsum .so{font-family:var(--mono);font-weight:800;font-size:15px}
.nlsum .badge{padding:2px 9px;border-radius:999px;font-weight:700;font-size:12px}
.nlsum.ok .badge{background:var(--okBg);color:var(--ok)}
.nlsum.thieu .badge{background:var(--red-dim);color:var(--red)}
.nlsum.du .badge{background:var(--warnBg);color:var(--warnTx)}
.nlbar{height:6px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.nlbar>i{display:block;height:100%;border-radius:99px}
.nlbar>i.ok{background:var(--ok)}
.nlbar>i.thieu{background:var(--red)}
.nlbar>i.du{background:var(--warnTx)}
.marow.flash{animation:flashRed 1.3s ease}

.hnow{background:var(--cyan-dim);border:1px solid var(--infoLine);border-radius:7px;padding:10px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.hnow .a{font-size:15px;font-weight:700;color:var(--cyan)}
.hnow .b{font-family:var(--mono);font-size:11px;color:var(--txt-2);text-align:right;white-space:nowrap}
.hnow.empty{background:var(--red-dim);border-color:var(--badLine)}
.hnow.empty .a{color:var(--red)}
.hset{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.h{font:inherit;font-size:13.5px;font-weight:600;background:var(--bg);color:var(--txt-2);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px;cursor:pointer;text-align:left}
.h.on{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan)}
.h.add{border-style:dashed;border-color:var(--amber);color:var(--amber);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.h .x{color:var(--red);margin-left:8px;font-weight:800}
.hsave{margin-top:9px;width:100%;font:inherit;font-size:14px;font-weight:800;padding:12px;
  border-radius:7px;cursor:pointer;border:none;background:var(--cyan);color:var(--onAcc)}
.hsave[disabled]{background:var(--row);color:var(--txt-3);border:1px solid var(--line);cursor:default}
.pend{margin-top:8px;font-size:12px;line-height:1.5;color:var(--warnTx);background:var(--warnBg);
  border-left:3px solid var(--warnTx);border-radius:0 6px 6px 0;padding:8px 10px}
.log{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--txt-3);line-height:1.75}
.log b{color:var(--txt-2);font-weight:600}

.tt{display:flex;gap:6px;margin-bottom:4px}
.ttb{flex:1;font:inherit;font-size:12.5px;font-weight:700;padding:10px 6px;border-radius:7px;
  cursor:pointer;background:var(--bg);color:var(--txt-3);border:1px solid var(--line);text-align:center}
.ttb.on.ok{background:var(--okBg);border-color:var(--ok);color:var(--ok)}
.ttb.on.tam{background:var(--warnBg);border-color:var(--warnTx);color:var(--warnTx)}
.ttb.on.dinh{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.bdg.dr{background:var(--c2);color:var(--txt-2);text-transform:none;letter-spacing:.02em;font-size:10.5px;font-weight:700;font-family:var(--mono)}
.bdg.s-ok{background:var(--okBg);color:var(--ok)}
.bdg.s-tam{background:var(--warnBg);color:var(--warnTx)}
.bdg.s-dinh{background:var(--red-dim);color:var(--red)}
.r.dinh .nm b{color:var(--red)}
.r.dinh{opacity:.72}
.cpbtn{width:100%;margin-top:9px;font:inherit;font-size:13px;font-weight:700;padding:10px;
  border-radius:7px;cursor:pointer;background:var(--bg);color:var(--cyan);
  border:1px solid var(--infoLine);text-align:left}
.cpbtn:after{content:'▾';float:right;color:var(--txt-3)}
.cpbtn.mo:after{content:'▴'}
.ctbox{margin-top:8px;background:var(--infoBg);border:1px solid var(--infoLine);border-radius:7px;padding:11px}
.ctbox label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--cyan);
  text-transform:uppercase;margin-bottom:6px}
.ctbox textarea{width:100%;font-family:var(--mono);font-size:13px;line-height:1.6;min-height:110px;
  background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical}
.ctbox textarea:focus{outline:none;border-color:var(--cyan)}
.ctbox .sub{margin-top:12px;padding-top:11px;border-top:1px solid var(--infoLine)}
.ctbox .sub label{color:var(--warnTx)}
.ctbox textarea.rieng{border-color:var(--warnLine);background:var(--bg)}
.ctbox textarea.rieng:focus{border-color:var(--warnTx)}
.tembox{margin-top:8px;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:11px}
.tembox .tf{margin-bottom:9px}
.tembox label{display:block;font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--txt-3);
  text-transform:uppercase;margin-bottom:4px}
.tembox label i{font-style:normal;color:var(--red);margin-left:3px}
.tembox input,.tembox textarea{width:100%;font:inherit;font-size:13.5px;background:var(--bg);color:var(--txt);
  border:1px solid var(--line);border-radius:6px;padding:8px 9px}
.tembox textarea{min-height:62px;line-height:1.55;resize:vertical}

/* ═══ BẢN IN TEM — TRẮNG ĐEN HOÀN TOÀN ═══ */
#temIn{display:none}
@media print{
  @page{size:A4;margin:6mm}
  html,body{background:#fff!important}
  body>*{display:none!important}
  #temIn{display:block!important;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;padding:0;margin:0}
  /* Mỗi .to là MỘT tờ A4, dàn lưới cột×hàng do admin chọn (mặc định 5×4).
     Nhiều .to nối tiếp = nhiều tờ, đủ số lượng tem cần (xem trangTem()). */
  #temIn .to{display:grid;gap:1.5mm;page-break-after:always;width:100%;height:100%;box-sizing:border-box}
  #temIn .to:last-child{page-break-after:auto}
  #temIn .tem{border:1pt solid #000;padding:5pt 6pt;box-sizing:border-box;overflow:hidden;width:100%}
  #temIn .t1{text-align:center;font-weight:bold;letter-spacing:.5pt;margin:0 0 2pt}
  #temIn .t2{text-align:center;font-weight:bold;margin:0 0 1pt;line-height:1.15}
  #temIn .t3{text-align:center;margin:0 0 3pt}
  #temIn table{width:100%;border-collapse:collapse}
  #temIn td{border:.5pt solid #000;padding:1.5pt 2.5pt;vertical-align:top}
  #temIn td.k{width:34%;font-weight:bold}
  #temIn .kh{border:.5pt solid #000;border-top:none;padding:2.5pt;line-height:1.3}
  #temIn .cb{font-style:italic;margin-top:2pt;line-height:1.25}
  /* 3 mức cỡ chữ theo mật độ tem/tờ — càng nhiều tem/tờ càng phải chữ nhỏ để không tràn ô */
  #temIn .to-lon .t1{font-size:9pt} #temIn .to-lon .t2{font-size:14pt} #temIn .to-lon .t3{font-size:9pt}
  #temIn .to-lon table,#temIn .to-lon .kh{font-size:8.5pt} #temIn .to-lon .cb{font-size:7.5pt}
  #temIn .to-vua .t1{font-size:7.5pt} #temIn .to-vua .t2{font-size:11pt} #temIn .to-vua .t3{font-size:7.5pt}
  #temIn .to-vua table,#temIn .to-vua .kh{font-size:6.8pt} #temIn .to-vua .cb{font-size:6pt}
  #temIn .to-nho .t1{font-size:6pt} #temIn .to-nho .t2{font-size:8.5pt} #temIn .to-nho .t3{font-size:6pt}
  #temIn .to-nho table,#temIn .to-nho .kh{font-size:5.3pt} #temIn .to-nho .cb{font-size:4.6pt}
}

  font-weight:700;padding:9px 18px;border-radius:6px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ══ LỚP BỐ CỤC THEO MẪU FIGMA (S10/R8) — đặt cuối để đè lên kiểu cũ, chỉ đổi hiển thị ══ */
html,body{background:var(--bg);min-height:100%}
.stick{background:var(--card);box-shadow:var(--shadowSm);border-bottom:1px solid var(--line)}
.bar{background:var(--card);color:var(--tx)}
.bar h1{letter-spacing:0}
.bar h1 i{color:var(--tx3)}
/* chấm tròn cam trước tên app — như logo quả cam của mẫu */
.bar h1::before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));vertical-align:0}
.tabs{background:var(--card);border-top:0;border-bottom:0}
.tab{font-weight:600;letter-spacing:0;text-transform:none;color:var(--tx2);border-bottom:3px solid transparent;line-height:1.2}
.tab .ic{display:block;width:19px;height:19px;margin:0 auto 4px}
.tab.on{color:var(--tx);border-bottom-color:var(--acc);background:var(--accSoft)}
.tab.on .ic{color:var(--acc)}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.toast{border-radius:14px;box-shadow:var(--shadow)}
.bdg{border-radius:8px}
#btnSangToi{font-size:15px;line-height:1;padding:7px 10px;flex:none}
@media(min-width:900px){
  /* MÁY TÍNH: thanh menu nổi bên trái như mẫu. Dùng lại đúng khối .stick có sẵn (thanh tiêu đề +
     tab) — chỉ đổi vị trí hiển thị, không đổi HTML/JS nào đang dùng các phần tử này. */
  :root{--sideW:236px}
  body{padding-left:calc(var(--sideW) + 30px)}
  .stick{position:fixed;left:14px;top:14px;bottom:14px;width:var(--sideW);z-index:30;display:flex;flex-direction:column;
    border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px 12px 70px;overflow-y:auto;overflow-x:hidden}
  .bar{flex-wrap:wrap;padding:4px 8px 16px;margin-bottom:10px;border-bottom:1px solid var(--line)}
  .bar h1{flex:1 1 100%;font-size:16px}
  .tabs{flex-direction:column;gap:3px;overflow:visible}
  .tab{flex:none;display:flex;align-items:center;gap:11px;text-align:left;padding:10px 12px;border-radius:12px;
    border-bottom:0;font-size:14px;font-weight:500;white-space:nowrap}
  .tab .ic{margin:0;width:18px;height:18px;flex:none}
  .tab:hover{background:var(--c2);color:var(--tx)}
  .tab.on{background:var(--accSoft);color:var(--tx);font-weight:700}
  /* nút sáng/tối xuống đáy thanh menu, có chữ — như mục "Settings" của mẫu */
  #btnSangToi{position:absolute;left:12px;right:12px;bottom:14px;display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:12px;font-size:15px;text-align:left}
  #btnSangToi::after{content:attr(data-nhan);font-size:13.5px;font-weight:600}
}
.tab{font-size:12px;padding:10px 2px 9px}
.adm{background:var(--accSoft);color:var(--accTx);border-radius:6px}
.tbtn{background:var(--c2);color:var(--tx);border-color:var(--line);border-radius:12px}
.tbtn.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}
/* nút chính: cam như điểm nhấn của mẫu */
.bigbtn,.dbtn.ok,.hsave,.okbtn,.sbtn.pri{background:linear-gradient(135deg,var(--btnA) 0%,var(--btnB) 100%);
  color:var(--onAcc);border:none;box-shadow:var(--btnGlow)}
.hsave[disabled]{background:var(--row);color:var(--txt-3);border:1px solid var(--line);box-shadow:none}
.bigbtn.alt{background:var(--c2);color:var(--tx);border:1px solid var(--line2);box-shadow:none}
.bigbtn.warn{background:var(--badBg);color:var(--badTx);border:1px solid var(--badLine);box-shadow:none}
.dbtn.ok.warn{background:var(--bad);color:var(--onAcc);box-shadow:none}
.abtn,.ainp,.find input,.fld input,.fld textarea,.dlg input,.pbrow select,.pbrow input,.ncc-card select,
.marow .kgi,.marow .mi,.tembox input,.tembox textarea,.tembox .tccsval,.ctbox textarea,.meinp{border-radius:12px}
.bigbtn,.dbtn,.okbtn,.hsave,.inbtn,.cpbtn,.tra,.rm,.ctdel,.huy,.sbtn,.addbtn,.tccsbtn,.tpnl,.ttb{border-radius:14px}
.bk,.bcc,.lot,.kpi,.ncc-card,.calc,.hnow,.lotbox,.rec,.pkbox,.ctbox,.tembox,.canh,.temstat,.trab,.tk-row{border-radius:16px}
.bk,.bcc,.lot,.kpi,.ncc-card{background:var(--card);border-color:var(--line);box-shadow:var(--shadowSm)}
.kpi b{color:var(--tx);font-family:var(--sans);font-weight:600}
.note,.pend{border-radius:14px}
.q,.h,.xosua,.pbrow .xo,.marow .xo{border-radius:10px}
.marow .tag,.cpbtn .rg{border-radius:8px}
.r.open{background:var(--rowOn)}
.status{background:var(--card);border-top:1px solid var(--line);box-shadow:0 -10px 26px -20px rgba(0,0,0,.35)}
.bk input[type=url],.bk input[type=text]{background:var(--bg);color:var(--txt);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.bk input[type=url]:focus,.bk input[type=text]:focus{outline:none;border-color:var(--acc)}
/* S10: khung "Còn N ô chưa điền" của hồ sơ tem mang class "temstat no" — trùng tên với .no (cột số
   thứ tự: rộng 22px, chữ đơn cách) nên bị ép còn 22px, chữ xếp dọc từng từ. Lỗi có từ trước, gỡ phần trùng. */
.temstat.no{width:auto;font-family:var(--sans);font-weight:400}
#traLot{font:inherit;font-size:14px;max-width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line2);border-radius:12px;padding:9px 10px}

/* ── TRANG TỔNG QUAN (S10) — lưới ô kiểu mẫu Figma ── */
.tq{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.w{grid-column:span 12;min-width:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:18px 20px;box-shadow:var(--shadowSm)}
.w h4{margin:0 0 10px;font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.w h4 small{font-size:12px;font-weight:500;color:var(--tx2)}
.w .so{font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.w .so small{font-size:15px;color:var(--tx2);font-weight:500}
.w .tang{color:var(--ok);font-size:15px;font-weight:700}.w .giam{color:var(--badTx);font-size:15px;font-weight:700}
.w .mo{font-size:12.5px;color:var(--tx2);margin-top:6px;line-height:1.5}
.w .xem{margin-top:auto;padding:14px 0 0;align-self:flex-start;font:inherit;font-size:12.5px;font-weight:700;color:var(--accTx);
  background:none;border:0;cursor:pointer}
.w .xem:hover{text-decoration:underline}
.gauge{display:block;width:100%;max-width:210px;margin:0 auto}
.gauge .nen{stroke:var(--c2)}.gauge .gt{stroke:var(--acc)}
.gauge text{fill:var(--tx);font-size:26px;font-weight:600;font-family:var(--sans)}
.w.giua{align-items:center;text-align:center}.w.giua .xem{align-self:center}
.tqr{display:flex;align-items:center;gap:12px;padding:9px 10px;margin:0 -10px;border-radius:12px;cursor:pointer}
.tqr:hover{background:var(--accSoft)}
.tqr .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.tqr .t{flex:1;min-width:0}.tqr .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tqr .t span{display:block;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tqr .k{text-align:right;flex:none;font-size:13.5px;font-weight:700}.tqr .k span{display:block;font-size:11.5px;color:var(--tx2);font-weight:500}
.tqphai{grid-column:span 12;min-width:0;display:flex;flex-direction:column;gap:12px}
.tqchart{display:block;width:100%;height:auto}
.tqchart .luoi{stroke:var(--line);stroke-width:1}.tqchart .nhan{fill:var(--tx2);font-size:11px;font-family:var(--sans)}
.tqchart .duong{fill:none;stroke:var(--chart);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.tqchart .cham{fill:var(--card);stroke:var(--chart);stroke-width:2.5}
.tqchart .mien0{stop-color:var(--chart);stop-opacity:.32}.tqchart .mien1{stop-color:var(--chart);stop-opacity:0}
.tqmini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tqmini .w{grid-column:auto;padding:14px 16px}
.tqmini .w h4{font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:8px}
.tqmini .lon{font-size:19px;font-weight:700;color:var(--accTx);line-height:1.2;overflow-wrap:anywhere}
.tqmini .nho{font-size:12px;color:var(--tx2);margin-top:3px}
.tqviec{display:flex;align-items:center;gap:12px;padding:9px 10px;margin:0 -10px;border-radius:12px;cursor:pointer;font-size:13.5px}
.tqviec:hover{background:var(--accSoft)}
.tqviec b{min-width:34px;height:34px;padding:0 8px;border-radius:17px;display:grid;place-items:center;background:var(--warnBg);color:var(--warnTx);font-size:14px;flex:none}
.tqviec.xau b{background:var(--badBg);color:var(--badTx)}
.tqxong{font-size:13.5px;color:var(--ok);font-weight:600;padding:6px 0}
.tqbars{display:flex;flex-direction:column;gap:8px}
.tqbar{position:relative;height:30px;border-radius:9px;background:var(--c2);overflow:hidden}
.tqbar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.tqbar span{position:absolute;left:10px;right:10px;top:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12.5px;font-weight:700;color:var(--onAcc)}
.tqbar span b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* bản tối: thanh cam nhạt trong suốt để chữ sáng trên thanh vẫn đạt tương phản >= 4.5 */
:root.toi .tqbar i{background:linear-gradient(90deg,rgba(245,165,36,.16),rgba(245,165,36,.4))}
:root.toi .tqbar span{color:var(--tx)}
.tqchips{display:flex;flex-wrap:wrap;gap:8px}
.tqchip{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:600;color:var(--tx);cursor:pointer;
  background:var(--card);border:1px solid var(--warnLine);border-radius:10px;padding:6px 10px}
.tqchip i{font-style:normal;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--acc);display:grid;place-items:center;font-size:11px;color:var(--accTx);line-height:1}
.tqchip em{font-style:normal;font-weight:500;color:var(--tx2)}
.tqchip.sap{background:var(--warnBg)}.tqchip.sap em{color:var(--warnTx);font-weight:700}
.tqchip.het{background:var(--badBg);border-color:var(--badLine)}.tqchip.het em{color:var(--badTx);font-weight:700}.tqchip.het i{border-color:var(--badTx);color:var(--badTx)}
.tqtrong{font-size:13px;color:var(--tx2);padding:4px 0}
@media(min-width:620px){.w-3{grid-column:span 6}}
@media(min-width:1100px){.w-3{grid-column:span 3}.w-4{grid-column:span 4}.w-5{grid-column:span 5}.tqphai{grid-column:span 7}}
@media(max-width:520px){.tqmini{grid-template-columns:1fr}}

@media(min-width:900px){
  .app{max-width:1200px;margin:0 auto;padding:16px 16px 0 0}
  .stick{padding-bottom:118px}
  /* nút Quản lý (chỉ hiện ở tab Công thức) nằm trên nút sáng/tối ở đáy menu */
  #editBtn{position:absolute;left:12px;right:12px;bottom:62px;padding:10px 12px;text-align:left;font-size:13.5px}
  /* khối "Áp mẻ cho tất cả" của tab Công thức: nằm trong menu, dưới danh sách tab */
  .apply{border:0;border-top:1px solid var(--line);padding:14px 8px 4px;margin-top:12px}
  .arow{flex-wrap:wrap}.alab{flex:1 1 100%}.ainp{flex:1;width:auto;min-width:0}
  .quick{flex-wrap:wrap;overflow:visible}
  .pg{padding:0 0 12px}
  #viewCT{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadowSm)}
  .status{left:calc(var(--sideW) + 30px);right:16px;bottom:14px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .sin{max-width:none}
  body{padding-bottom:90px}
}
</style>
</head>

<div class="app">
  <div class="stick">
    <div class="bar">
      <h1>Pha hương liệu <em class="adm">ADMIN</em><i>ĐỊNH MỨC &amp; CÔNG THỨC · BẢN 10/09/2026-S10</i></h1>
      <button class="tbtn" id="btnSangToi" type="button">☀</button>
      <button class="tbtn" id="editBtn">Quản lý</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="tq"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="5" rx="2"/><rect x="13.5" y="11" width="7.5" height="10" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span>Tổng quan</span></button>
      <button class="tab" data-tab="ct"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6.2L4.6 18.4A1.8 1.8 0 0 0 6.2 21h11.6a1.8 1.8 0 0 0 1.6-2.6L14 9.2V3"/><path d="M7.2 15h9.6"/></svg><span>Công thức</span></button>
      <button class="tab" data-tab="ma"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg><span>Danh mục</span></button>
      <button class="tab" data-tab="bc"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M7 17v-6M12 17V5M17 17v-9"/></svg><span>Báo cáo</span></button>
      <button class="tab" data-tab="sl"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v6c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-6M4.5 11.5v6c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-6"/></svg><span>Sao lưu</span></button>
    </div>
    <div class="apply" id="applyBox">
      <div class="arow">
        <span class="alab">Áp mẻ cho tất cả</span>
        <input class="ainp" id="allKg" type="text" inputmode="decimal" placeholder="kg">
        <button class="abtn" id="allBtn">Áp</button>
      </div>
      <div class="quick" id="quick"></div>
    </div>
  </div>

  <div id="viewTQ" class="pg"></div>
  <div id="viewCT">
    <div class="find"><input id="q" type="search" placeholder="Tìm sản phẩm, hương, nguyên liệu…" autocomplete="off"></div>
    <div class="thead">
      <span class="c-no">#</span><span class="c-nm">Sản phẩm</span>
      <span class="c-me">Mẻ / kg</span><span class="c-cd">Cần dùng (theo Mẻ)</span>
    </div>
    <div class="rows" id="rows"></div>
  </div>

  <div id="viewMA" class="pg" style="display:none"></div>
  <div id="viewBC" class="pg" style="display:none"></div>
  <div id="viewSL" class="pg" style="display:none"></div>
</div>

<div class="status">
  <div class="sin">
    <span class="stat" id="stat"></span>
    <span class="stat" id="dbDen" style="cursor:pointer" title="Bấm để đồng bộ ngay">⚪ Đồng bộ</span>
    <button class="sbtn" id="resetBtn">Mặc định</button>
    <button class="sbtn pri" id="addBtn">Thêm</button>
  </div>
</div>
<div id="temIn"></div>
<div class="toast" id="toast"></div>
<div class="mask" id="mask"><div class="dlg">
  <h3 id="dlgT"></h3><p id="dlgM"></p><input id="dlgI">
  <div class="dbtns"><button class="dbtn" id="dlgC">Hủy</button><button class="dbtn ok" id="dlgO">Xác nhận</button></div>
</div></div>

<script>
/* ── GIAO DIỆN SÁNG / TỐI — 10/09/2026 (S9/R7, đổi mặc định sang SÁNG ở S10/R8 theo mẫu Figma) ──
   Chỉ là tuỳ chọn hiển thị của TỪNG MÁY, lưu riêng khoá 'peroma:sangtoi' ('sang'/'toi'). KHÔNG nằm
   trong cấu hình đồng bộ hay file sao lưu (không đụng H1), máy nào chọn riêng máy đó. */
const SANGTOI_KEY='peroma:sangtoi';
function veNutSangToi(){
  const toi=document.documentElement.classList.contains('toi');
  const b=document.getElementById('btnSangToi');
  if(b){b.textContent=toi?'\u2600':'\u{1F319}';b.dataset.nhan=toi?'Giao diện sáng':'Giao diện tối';
    b.title=toi?'Đổi sang giao diện sáng':'Đổi sang giao diện tối';b.setAttribute('aria-label',b.title);}
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content',toi?'#1C1C1F':'#FFFFFF'));
}
function doiSangToi(){
  const toi=!document.documentElement.classList.contains('toi');
  document.documentElement.classList.toggle('toi',toi);
  try{localStorage.setItem(SANGTOI_KEY,toi?'toi':'sang')}catch(e){}
  veNutSangToi();
}
document.getElementById('btnSangToi').addEventListener('click',doiSangToi);
veNutSangToi();

/* ═══ Lưu trữ ═══ */
const KEY='huonglieu:v4';
const mem={};
const store={
  async get(){
    try{ if(window.storage){const r=await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value);} }catch(e){}
    try{ const v=localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
    return mem[KEY]||null;
  },
  async set(d){ mem[KEY]=d; const s=JSON.stringify(d);
    try{ if(window.storage){ await window.storage.set(KEY,s); return; } }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
  },
  async clear(){ delete mem[KEY];
    try{ if(window.storage) await window.storage.delete(KEY); }catch(e){}
    try{ localStorage.removeItem(KEY); }catch(e){}
  }
};

/* ═══ Đồng bộ Apps Script (đối-đối với bản Nhân viên) ═══
   Admin: đẩy CẤU HÌNH (danh mục, công thức, mã) lên máy chủ mỗi khi có thay đổi;
          kéo NHẬT KÝ (mẻ do nhân viên ghi) về mỗi 20 giây, tự gộp — không cần
          nhận file .json tay nữa (nút "Nhận mẻ từ máy nhân viên" vẫn giữ làm dự phòng
          khi mất mạng lâu ngày). */
/* 10/09/2026 — bản S7: ĐỊA CHỈ ĐỒNG BỘ + MẬT KHẨU KHÔNG CÒN VIẾT CỨNG TRONG MÃ NGUỒN.
   Trước đây 2 giá trị này nằm ngay tại đây. Đưa ra ngoài vì hai lý do thật:
   (1) Mã nguồn nay đưa lên GitHub công khai. Nhúng sẵn link + mật khẩu nghĩa là bất kỳ ai
       đọc được repo cũng đọc/ghi/xoá được Sheet sản xuất.
   (2) Sự cố 10/09/2026: bộ test tự động (vốn viết cho container KHÔNG có mạng) được chạy trên
       máy CÓ mạng nên đã đẩy dữ liệu test đè lên Sheet thật — đổi tên hương, đổi kg/bao của
       quy cách "5 kg" thành 99. Khi link nằm ngoài mã nguồn, bản mã mà test mở là bản "trắng",
       không có đường ra Internet → chặn tận gốc đúng loại tai nạn đó.
   Mỗi máy nhập MỘT LẦN ở tab "Sao lưu" → khối "Kết nối Google Sheet". Giá trị lưu trong
   trình duyệt của riêng máy đó: KHÔNG đi kèm mã nguồn, KHÔNG đồng bộ lên Sheet.
   Để trống = app chạy hoàn toàn offline; mọi hàm db* đã có sẵn guard `if(!DONGBO_URL)return`.

   Giữ nguyên cảnh báo cũ: đây vẫn KHÔNG phải xác thực thật. Người ngồi tại máy đã cấu hình
   vẫn xem được giá trị này trong DevTools. Cái thay đổi là nó không còn công khai theo mã
   nguồn. Muốn bảo mật thật phải đổi cơ chế xác thực phía máy chủ (Code.gs). */
const KETNOI_KEY='peroma:ketnoi';
function docKetNoi(){try{return JSON.parse(localStorage.getItem(KETNOI_KEY))||{}}catch(e){return{}}}
function ghiKetNoi(url,mk){
  try{localStorage.setItem(KETNOI_KEY,JSON.stringify({url:String(url||'').trim(),mk:String(mk||'').trim()}));return true}
  catch(e){return false}
}
let DONGBO_URL=String(docKetNoi().url||'');
let LEGACY_SHARED_TOKEN=String(docKetNoi().mk||'');

/* 10/09/2026 — ADMIN TRÊN ĐIỆN THOẠI = CHẾ ĐỘ CHỈ XEM (khách quyết: "tạm thời admin mobile ngừng
   hoạt động, sau khi cập nhật chuẩn admin pc thì sau này hãy dựng lại admin mobile").
   Lý do kỹ thuật (lỗi H4 / D): mọi máy Admin đẩy-kéo NGUYÊN KHỐI cấu hình, ai gửi sau thắng. Hai máy
   Admin cùng sửa → máy gửi sau đè mất thay đổi của máy kia. Nặng hơn, sau khi kênh Sheet được sửa để
   trừ tồn kho (ghiNhanMeLanDau), rà đối kháng chỉ ra: nk[] lưu RIÊNG từng máy nhưng nguonHuong (có
   daDungKg) lại đồng bộ chung — nên máy thứ hai nhận cùng một mẻ sẽ TRỪ TỒN KHO LẦN NỮA rồi đẩy lên.
   Chỉ còn đúng MỘT máy được ghi thì cả hai vấn đề cùng biến mất.
   Ở chế độ chỉ xem: vẫn kéo về và xem được mọi thứ; KHÔNG gửi bất cứ gì lên Sheet (chặn ở dbGoi cho
   mọi POST, và dbDayCauHinh dừng êm để không báo "mất mạng" giả); KHÔNG trừ tồn kho khi nhận mẻ.
   Nhận diện điện thoại = thiết bị cảm ứng làm con trỏ chính + cạnh ngắn màn hình < 900px. Máy tính
   dùng chuột/touchpad không bị ảnh hưởng. Có nút gỡ phòng khi nhận nhầm (VD máy tính bảng dùng như PC).
   Khi dựng lại Admin mobile chuẩn: bỏ khối này là quay về hành vi cũ. */
const ADMIN_SUA_KEY='peroma:adminChoPhepSua';
function laDienThoai(){
  try{return matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<900}catch(e){return false}
}
function daChoPhepSuaTrenMayNay(){try{return localStorage.getItem(ADMIN_SUA_KEY)==='1'}catch(e){return false}}
let adminChiXem=laDienThoai()&&!daChoPhepSuaTrenMayNay();
let dbTT='tat', dbHen2=null, dbDangKeo=false, dbDangKeoBc=false, dongBoCauHinhTs='';
function dbGio(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function dbVeTT(t,ghiChu){
  dbTT=t; const el=document.getElementById('dbDen'); if(!el)return;
  const map={tat:['⚪','Đồng bộ tắt'],dang:['🟡','Đang gửi…'],ok:['🟢','Đã đồng bộ '+dbGio()],loi:['🔴','Mất mạng — đang giữ lại'+(ghiChu?' ('+ghiChu+')':'')]};
  const [dot,txt]=map[t]||map.tat; el.textContent=dot+' '+txt;
}
async function dbGoi(url,tuychon){
  // 10/09/2026: lưới an toàn cho chế độ chỉ xem — chặn MỌI lệnh ghi (POST), kể cả đường ghi thêm sau này
  if(adminChiXem&&tuychon&&String(tuychon.method||'').toUpperCase()==='POST')
    throw new Error('Admin trên điện thoại đang ở chế độ chỉ xem — không gửi thay đổi lên hệ thống');
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch(url,Object.assign({signal:ctl.signal},tuychon||{}));
    clearTimeout(to);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.loi) throw new Error(j.loi);
    return j;
  }catch(e){ clearTimeout(to); throw e; }
}
/* Chỉ giữ trường DANH MỤC/CÔNG THỨC khi gửi lên máy chủ làm "cấu hình" — bỏ mọi
   trường "đang ghi mẻ dở" (sl,pb,huongMe,lot,ngaysx,nv,me). Nếu không lọc, mỗi lần
   admin gõ dở vào ô kg của một mẻ đang mở cũng bị đẩy lên và ghi đè máy nhân viên
   (bug H1 — xem PRODUCTION-PROJECT-AUDIT.md). Không đụng cấu trúc sp[] cục bộ,
   chỉ lọc tại thời điểm đóng gói để gửi đi. */
function sachCauHinh(mang){
  return (mang||[]).map(p=>({
    ten:p.ten, kg:p.kg, ml:p.ml, pkb:p.pkb, huongs:p.huongs||[], tam:p.tam||[],
    dauRa:p.dauRa||[], maSP:p.maSP||'', ngay:p.ngay||'', lichSu:p.lichSu||[],
    hstem:p.hstem||temMoi(), nguyenlieu:p.nguyenlieu||'',
    congThucNL:(Array.isArray(p.congThucNL)?p.congThucNL:[]).map(x=>({ten:String((x&&x.ten)||''),kg:num(x&&x.kg)})),
    pkbPhut:p.pkbPhut||'', pkbChat:p.pkbChat||'', pkbCT:p.pkbCT||'',
    ghi:p.ghi||'', tt:p.tt||'ok', ttLyDo:p.ttLyDo||'', ttNgay:p.ttNgay||'', qc:p.qc||'',
    /* PATCH V1.1 mục P1-A: metadata phiên bản công thức — thuộc tính tĩnh của công thức,
       không phải trạng thái đang ghi mẻ dở, nên an toàn khi đưa vào whitelist sync (không vi
       phạm H1: không có sl/pb/huongMe/lot/ngaysx/nv/daInPhieu/xacNhanCT ở đây). */
    recipeVersion:num(p.recipeVersion)||1, recipeEffectiveFrom:p.recipeEffectiveFrom||'',
    recipeUpdatedAt:p.recipeUpdatedAt||'',
    /* 27/08/2026 — bản S2: chọn/khoá nguồn hương liệu RIÊNG từng mặt hàng cũng là dữ liệu
       cấu hình (không phải trạng thái ghi mẻ dở — không vi phạm H1), phải đồng bộ cùng công
       thức, nếu không thì mở lại ở máy/bản khác sẽ mất lựa chọn đã khoá. */
    nguonHuongChon:(p.nguonHuongChon&&typeof p.nguonHuongChon==='object')?p.nguonHuongChon:{},
    nguonHuongKhoa:!!p.nguonHuongKhoa
  }));
}
async function dbDayCauHinh(){
  if(!DONGBO_URL)return;
  if(adminChiXem)return;   // 10/09/2026: chế độ chỉ xem — dừng êm, không báo "mất mạng" giả (dbGoi cũng chặn)
  dbVeTT('dang');
  try{
    /* 27/08/2026 — bản S2: trước đây thiếu nguonHuong/huongDangDung/tonKhoHuong trong gói gửi
       lên Sheet — nghĩa là nhà cung cấp/giá/tồn kho hương liệu KHÔNG được sao lưu lên máy chủ,
       y hệt lỗi đã sửa ở "Bản sao đầy đủ" .json cùng đợt. Sửa ở đây để cấu hình đồng bộ lên
       Sheet là ĐẦY ĐỦ, dùng lại được khi mở bản phần mềm mới (xem dbKeoCauHinhNeuMoiHon()). */
    const j=await dbGoi(DONGBO_URL,{method:'POST',body:JSON.stringify({mk:LEGACY_SHARED_TOKEN,a:'luuCauHinh',cauhinh:{sp:sachCauHinh(sp),kho,cp,dr,maHuong,maQC,kgQC,nvDS,nlDM,nguonHuong,huongDangDung,tonKhoHuong,nguonNguyenLieu,nlDangDung,tonKhoNguyenLieu,nlTong,nlNgayKhai,nlGhiChu}})});
    if(j&&j.ts)dongBoCauHinhTs=j.ts;
    dbVeTT('ok');
  }catch(e){ dbVeTT('loi', e.message); }
}
function dbDayChoDL(){ clearTimeout(dbHen2); dbHen2=setTimeout(dbDayCauHinh,1500); }
/* 27/08/2026 — bản S2: "lưu trữ trên Google Sheet, không mất khi đổi bản phần mềm" (khách
   yêu cầu). Mỗi lần mở app: so mốc thời gian cấu hình đã lưu trên Sheet (server) với mốc lần
   này ĐÃ ĐỒNG BỘ gần nhất mà máy đang mở biết (dongBoCauHinhTs, lưu cùng dữ liệu cục bộ) —
   Sheet MỚI HƠN (hoặc máy này CHƯA từng đồng bộ, ví dụ vừa mở bản phần mềm mới/máy mới) thì
   tự kéo về, không cần bấm gì (khách chọn phương án này khi được hỏi). Có mạng lúc này thì
   dùng, mất mạng thì bỏ qua lặng lẽ — không chặn mở app, dữ liệu cục bộ vẫn dùng được như cũ.
   KHÔNG động vào trạng thái ghi mẻ dở (nk/sl/pb/huongMe/lot/ngaysx/nv...) — chỉ áp lại đúng
   phần "cấu hình" đã lọc whitelist ở sachCauHinhServer() phía Code.gs (H1 vẫn giữ nguyên). */
function apDungCauHinhTuServer(c){
  if(!c||typeof c!=='object')return;
  if(Array.isArray(c.sp)&&c.sp.length){
    sp=napSP(c.sp);
    sp.forEach(x=>{if(!(x.dauRa||[]).length)x.dauRa=drMacDinh(x.ten);pbTuDong(x)});
  }
  if(Array.isArray(c.kho)&&c.kho.length)kho=c.kho;
  if(!kho.includes('Không mùi'))kho.push('Không mùi');
  if(Array.isArray(c.cp))cp=c.cp;
  if(Array.isArray(c.dr)&&c.dr.length)dr=c.dr;
  if(!dr.includes('500 g'))dr.unshift('500 g');
  DR_CHUAN.forEach(q=>{if(!dr.includes(q))dr.push(q)});
  if(c.maHuong&&typeof c.maHuong==='object')maHuong=c.maHuong;
  if(c.maQC&&typeof c.maQC==='object')maQC=c.maQC;
  if(c.kgQC&&typeof c.kgQC==='object')kgQC=c.kgQC;
  if(Array.isArray(c.nvDS))nvDS=c.nvDS;
  if(Array.isArray(c.nlDM))nlDM=c.nlDM.filter(x=>typeof x==='string'&&x.trim());
  if(c.nguonHuong&&typeof c.nguonHuong==='object')nguonHuong=c.nguonHuong;
  if(c.huongDangDung&&typeof c.huongDangDung==='object')huongDangDung=c.huongDangDung;
  if(c.tonKhoHuong&&typeof c.tonKhoHuong==='object')tonKhoHuong=c.tonKhoHuong;
  if(c.nguonNguyenLieu&&typeof c.nguonNguyenLieu==='object')nguonNguyenLieu=c.nguonNguyenLieu;
  if(c.nlDangDung&&typeof c.nlDangDung==='object')nlDangDung=c.nlDangDung;
  if(c.tonKhoNguyenLieu&&typeof c.tonKhoNguyenLieu==='object')tonKhoNguyenLieu=c.tonKhoNguyenLieu;
  if(Number.isFinite(+c.nlTong)&&+c.nlTong>0)nlTong=+c.nlTong;
  if(typeof c.nlNgayKhai==='string')nlNgayKhai=c.nlNgayKhai;
  if(typeof c.nlGhiChu==='string')nlGhiChu=c.nlGhiChu;
  sp.forEach(x=>{const t=String(x.pkbChat||'').trim();
    if(t&&!cp.some(y=>y.ten===t))cp.push({ten:t,ct:''})});
  sp.forEach(x=>bumpRecipeVersion(x));
  buMa();
}

   đó, apDungCauHinhTuServer() sẽ THAY THẾ TOÀN BỘ mảng sp/kho/... bằng bản ở server, xoá mất chữ
   đang gõ dở trên máy này. Chặn bằng dbCoDangGoTiepXuc() bên dưới: đang có ô nhập/textarea/select
   nào đang được bấm vào (focus) thì BỎ QUA lượt này, đợi vòng kế tiếp (không quá 9-10 giây sau,
   nhẹ nhàng) khi đã rời khỏi ô đó rồi mới áp — không chặn mở app, không mất chữ đang gõ. */
function dbCoDangGoTiepXuc(){
  const a=document.activeElement;
  if(!a)return false;
  const tag=(a.tagName||'').toUpperCase();
  return (tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') && !a.readOnly && !a.disabled;
}
async function dbKeoCauHinhNeuMoiHon(){

      apDungCauHinhTuServer(j.cauhinh);

/* 10/09/2026 — HÀM DÙNG CHUNG cho mọi kênh nhận mẻ từ máy nhân viên.
   Lỗi đã sửa: logic "nhận mẻ lần đầu" (snapshot giá hương + trừ tồn kho nhà cung cấp) trước đây CHỈ
   nằm trong nhánh nhận file .json tay (#nvIn). Bản S2 (27/08/2026) thêm kênh đồng bộ qua Sheet
   (dbKeoNhatKy) — nay là kênh CHÍNH, 20 giây/lần — nhưng không mang theo logic này, chỉ nk.push(r).
   Hậu quả: mẻ nhận qua Sheet không có giá lúc sản xuất → chiPhiHuongRecord() rơi về giá HIỆN TẠI
   theo huongDangDung chung (sai nguồn riêng của mặt hàng, hoặc 0đ nếu chưa đặt); và dòng NCC không
   bao giờ bị trừ daDungKg → "còn lại" không giảm, cảnh báo sắp hết nguồn không bao giờ bật.
   Đây đúng dạng lỗi gốc rễ của dự án: một nghiệp vụ nằm ở 2 chỗ, thêm chỗ thứ 2 mà không mang theo.
   Sửa bằng cách gom về MỘT hàm, cả hai kênh cùng gọi — không chép thêm bản thứ hai.

   Bất biến giữ nguyên từ bản gốc (PATCH V1 mục D2 + 26/08/2026-S):
   - CHỈ snapshot lần đầu: mẻ đã có giá (khác null/undefined) thì TUYỆT ĐỐI không tính lại, dù giá
     hiện tại đã đổi — giữ đúng lịch sử chi phí.
   - Trừ tồn kho gắn với đúng điều kiện đó, nên mỗi mẻ chỉ bị trừ MỘT lần. Lớp chặn thứ hai: cả hai
     kênh đều chỉ gọi hàm này cho mẻ có id CHƯA có trong nk[].
   - Giá theo NGUỒN RIÊNG của đúng mặt hàng (nguonDangDungCuaMatHang), không theo huongDangDung chung.
   - mlDung là GRAM; soKg/daDungKg là KG → chia 1000.
   Hàm chỉ ghi vào bản ghi r và vào nguonHuong; KHÔNG đẩy vào nk[] (việc đó do nơi gọi làm). */
function ghiNhanMeLanDau(r){
  delete r.daGui;   // cờ "đã gửi" chỉ có nghĩa bên máy nhân viên
  if(r.giaHuongTheoGLucSX!==undefined&&r.giaHuongTheoGLucSX!==null)return;
  const pMh=sp.find(x=>x.ten===r.sp);
  const nguon=pMh?nguonDangDungCuaMatHang(pMh,r.huong):null;
  const giaG=nguon?nguon.e.gia/(nguon.e.soKg*1000):0;
  r.giaHuongTheoGLucSX=giaG||null;
  r.chiPhiHuongLucSX=giaG>0?Math.round(num(r.mlDung)*giaG):null;
  // trừ tồn kho ĐÚNG dòng NCC/giá vừa dùng — mlDung là GRAM, soKg/daDungKg tính bằng KG.
  // Chế độ chỉ xem (Admin trên điện thoại) KHÔNG trừ: máy đó không phải nguồn sự thật, trừ ở đây là
  // trừ chồng lên phần máy chính đã trừ (xem chú thích adminChiXem). Giá thì vẫn ghi để màn hình
  // điện thoại hiện đúng chi phí — giá chỉ nằm trong bản ghi mẻ cục bộ, không bị đẩy lên.
  if(nguon&&num(r.mlDung)>0&&!adminChiXem){
    const e=nguonHuong[r.huong]&&nguonHuong[r.huong][nguon.ix];
    if(e)e.daDungKg=Math.round((num(e.daDungKg||0)+num(r.mlDung)/1000)*1000)/1000;
  }
}

/* MẶT HÀNG ĐÃ "KHOÁ THEO TCCS" — thử nghiệm 24/08/2026, khách yêu cầu không gõ tay nữa,
   hồ sơ tem lấy 100% từ TCCS_DATA (không phải chỉ điền ô trống như apTCCS() thường).
   Khoá theo MÃ SẢN PHẨM. Chỉ có mã '32' (HAMBII Little Mars) để thử — CHƯA áp cho mặt hàng
   khác, chờ khách xác nhận cách này ổn rồi mới mở rộng thêm (xem project doc). */
const TCCS_KHOA=['32'];
/* Áp TOÀN BỘ hstem từ TCCS_DATA cho 1 mặt hàng đã khoá — ghi đè hoàn toàn (khác apTCCS()
   chỉ điền ô trống), vì mặt hàng khoá thì không có "ô đã nhập tay" để giữ nữa. */
function apTCCSKhoa(i){
  const p=sp[i]; if(!p) return {ok:false,ly_do:'Không tìm thấy mặt hàng'};
  const ma=hai(p.maSP);
  if(!TCCS_KHOA.includes(ma)) return {ok:false,ly_do:'Mặt hàng này chưa nằm trong danh sách khoá theo TCCS'};
  const d=TCCS_DATA[ma];
  if(!d) return {ok:false,ly_do:'Thiếu dữ liệu TCCS_DATA cho mã '+ma+' — báo lại để bổ sung'};
  p.hstem={...temTrong(),...d};
  luuNgay();ve();
  return {ok:true,ly_do:'Đã áp lại toàn bộ hồ sơ tem từ TCCS '+(d.soTCCS||'')};
}
/* Đồng bộ âm thầm lúc khởi động — mặt hàng đã khoá luôn khớp TCCS_DATA hiện có trong code,
   không chờ admin bấm nút (vì không còn chỗ nào cho admin tự gõ để mà "giữ" nữa). */
function dongBoTCCSKhoaLucNap(){
  sp.forEach(p=>{const ma=hai(p.maSP);
    if(TCCS_KHOA.includes(ma)&&TCCS_DATA[ma])p.hstem={...temTrong(),...TCCS_DATA[ma]}});
}
/* 25/08/2026 — khoá "Xuất xứ": không cho gõ tay nữa (xem veTem()), chỉ đảm bảo mặt hàng nào
   đang trống ô này thì có giá trị mặc định "Sản xuất tại Việt Nam". KHÔNG đụng vào nội dung
   khác nhau đã có sẵn của từng mặt hàng (VD CITYCAT/ZAKA PRO/Little Mars ghi rõ có nguyên liệu
   nhập khẩu) — chỉ backfill ô đang rỗng thật. */
function khoaXuatXu(){
  sp.forEach(p=>{p.hstem=p.hstem||temMoi(); if(!String(p.hstem.xuatXu||'').trim())p.hstem.xuatXu=XUATXU_MD});
}

const temMoi=()=>({tenVN:'',tenEN:'',thanhPhan:'',congDung:'',kichThuoc:'',doAm:'< 10%',

/* Lấy dữ liệu hồ sơ tem từ TCCS_DATA theo mã sản phẩm — CHỈ điền vào ô đang TRỐNG,
   không bao giờ ghi đè ô admin đã tự nhập/tự sửa tay (an toàn cho dữ liệu đã có).
   Trả về {ok, ly_do} để nơi gọi tự thông báo phù hợp. */
function apTCCS(i){
  const p=sp[i]; if(!p) return {ok:false,ly_do:'Không tìm thấy mặt hàng'};
  if(TCCS_KHONG_CO.includes(p.ten))
    return {ok:false,ly_do:p.ten+' KHÔNG CÓ hồ sơ TCCS — không được lấy dữ liệu, không được in tem.'};
  if(TCCS_CHUA_RO.includes(p.ten))
    return {ok:false,ly_do:'TCCS của '+p.ten+' chưa xác định số hiệu — chưa thể tự động điền, chờ chốt.'};
  const ma=hai(p.maSP);
  const d=ma?TCCS_DATA[ma]:null;
  if(!d)
    return {ok:false,ly_do:'Chưa có dữ liệu TCCS lưu sẵn cho mã '+(ma||'(chưa cấp mã)')+' — cần bổ sung vào TCCS_DATA hoặc nhập tay.'};
  p.hstem={...temMoi(),...(p.hstem||{})};
  let soDaDien=0;
  Object.keys(d).forEach(k=>{
    if(k==='hdsdNhom'){
      if(!String(p.hstem.hdsd||'').trim()){p.hstem.hdsd=HDSD_NHOM[d.hdsdNhom][1];soDaDien++}
      return;
    }
    if(!String(p.hstem[k]||'').trim()){p.hstem[k]=d[k];soDaDien++}
  });
  luuNgay();ve();
  return {ok:true,ly_do:'Đã lấy '+soDaDien+' ô từ TCCS '+(d.soTCCS||'')+'. Kiểm tra lại nội dung trước khi in tem — ô đã điền tay từ trước KHÔNG bị ghi đè.'};
}

/* ---- Tải file TCCS (.docx) lên và tự tách dữ liệu — 25/08/2026 ----
   Đọc trực tiếp trong trình duyệt (không gửi file đi đâu cả), dùng fflate để giải nén
   .docx (vốn là 1 file ZIP) và lấy văn bản trong word/document.xml. Sau đó DÒ (không phải
   lấy chắc chắn 100%) các trường theo đúng khuôn mẫu TCCS của công ty (mục đánh số 1-13).
   NGUYÊN TẮC AN TOÀN: hàm này KHÔNG tự ghi thẳng vào hồ sơ tem. Nó chỉ trả về dữ liệu dò
   được để đổ vào các Ô ĐANG HIỂN THỊ TRÊN MÀN HÌNH (vẫn là input/textarea bình thường) —
   admin phải nhìn thấy, tự kiểm tra và có thể sửa trước khi nó được lưu, giống hệt như
   gõ tay. Không có trường nào tự động khoá hay tự in tem chỉ vì đọc được từ file. */
async function docxLayVanBan(buf){
  const files=fflate.unzipSync(new Uint8Array(buf));
  const xmlBytes=files['word/document.xml'];
  if(!xmlBytes) throw new Error('Không đọc được word/document.xml — file có phải .docx hợp lệ không?');
  const xml=fflate.strFromU8(xmlBytes);
  const doans=xml.split(/<w:p[ >]/).slice(1);
  const giaiMa=s=>s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");
  const dong=doans.map(doan=>giaiMa([...doan.matchAll(/<w:t[^>]*>([^<]*)<\/w:t>/g)].map(m=>m[1]).join('')).trim());
  return dong.filter(Boolean);
}

function tccsTachTruong(dong){
  const text=dong.join('\n');
  const timSauNhan=(nhan,cach=1)=>{const idx=dong.findIndex(d=>d.includes(nhan));return idx>=0?(dong[idx+cach]||''):''};
  const timDoanGiua=(batDau,ketThuc)=>{
    const i1=dong.findIndex(d=>batDau.test(d));
    if(i1<0)return '';
    const i2=dong.findIndex((d,i)=>i>i1&&ketThuc.test(d));
    return dong.slice(i1+1,i2>=0?i2:i1+8).join(' ').replace(/^--?\s*/,'').trim();
  };
  const soTCCS=(text.match(/TCCS\s+(\d{2}:\d{4}\/[A-ZÀ-ỸĐ]+)/)||[])[1]||'';
  let tenVN='';
  {const i=dong.findIndex(d=>/Căn cứ Luật/i.test(d));
    if(i>0)for(let k=i-1;k>=0&&k>i-6;k--){
      const d=dong[k];
      if(d&&d===d.toUpperCase()&&d.length>6&&!/^TCCS|^TIÊU CHUẨN/.test(d)){tenVN=d;break}
    }}
  const doAm=(text.match(/Độ ẩm[^\n%<>]{0,15}?([<>≤≥]\s*\d+\s*%)/i)||[])[1]||timSauNhan('Độ ẩm');
  const hsdNam=(text.match(/Hạn sử dụng[:\s]*?(\d+)\s*năm/i)||[])[1]||'';
  const baoQuan=timDoanGiua(/^10\.2\.?\s*Bảo quản/i,/^10\.3\.?/);
  const hdsd=timDoanGiua(/^9\.\s*Hướng dẫn sử dụng/i,/^10\.?\s/);
  const tpChinh=(text.match(/Thành phần chính[:\s]*([^\.\n]+)\./i)||[])[1]||'';
  const tpPhu=(text.match(/Thành phần phụ[:\s]*([^\.\n]+)\./i)||[])[1]||'';
  const thanhPhan=[tpChinh,tpPhu].filter(Boolean).join('; ');
  const xuatXu=(text.match(/(Sản xuất tại Việt Nam[^\.\n]*)/i)||[])[1]||'';
  const kichThuoc=timSauNhan('Hình dạng');
  return {tenVN,soTCCS,doAm,hsdNam,baoQuan,hdsd,thanhPhan,xuatXu,kichThuoc};
}

const hanDung=(iso,nam)=>{const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/),y=parseInt(nam,10);
  if(!m||!isFinite(y)||y<=0)return '';
  return `${m[3]}/${m[2]}/${+m[1]+y}`};

const hai=v=>{const t=String(v??'').replace(/\D/g,'');return t?t.slice(0,2).padStart(2,'0'):''};
const mmyy=iso=>{const m=String(iso||'').match(/^(\d{4})-(\d{2})-/);return m?m[2]+m[1].slice(2):''};

/* Sinh số lô. Trả {lot, thieu[]} — thieu rỗng nghĩa là sinh được. */
function sinhLot(p,huong,quyCach,ngaysx){
  const thieu=[];
  const ten=(p&&p.ten)||'?';
  const ss=hai(p&&p.maSP); if(!ss)thieu.push('mã sản phẩm của '+ten);
  const hh=huong?hai(maHuong[huong]):'';
  if(!huong)thieu.push('chưa chọn hương'); else if(!hh)thieu.push('mã hương "'+huong+'"');
  const qq=quyCach?hai(maQC[quyCach]):'';
  if(!quyCach)thieu.push('chưa chọn quy cách'); else if(!qq)thieu.push('mã quy cách "'+quyCach+'"');
  const my=mmyy(ngaysx); if(!my)thieu.push('ngày sản xuất');
  // trùng mã = số lô trùng → chặn hẳn
  const g=(o,k)=>{const v=o[k];return v&&v.length>1?v:null};
  const a=ss?g(trungMaSP(),ss):null; if(a)thieu.push(`mã sản phẩm ${ss} trùng giữa ${a.join(' và ')}`);
  const b=hh?g(trungMaH(),hh):null;  if(b)thieu.push(`mã hương ${hh} trùng giữa ${b.join(' và ')}`);
  const c=qq?g(trungMaQ(),qq):null;  if(c)thieu.push(`mã quy cách ${qq} trùng giữa ${c.join(' và ')}`);
  return thieu.length?{lot:'',thieu}:{lot:ss+hh+qq+my,thieu:[]};
}
const lotDep=l=>String(l||'').length===10?`${l.slice(0,2)} ${l.slice(2,4)} ${l.slice(4,6)} ${l.slice(6)}`:String(l||'');

/* Đoán khối lượng tịnh từ tên quy cách: "500 g" → 0.5 · "3,7 kg" → 3.7 · "20 kg" → 20
   Đoán được thì điền sẵn, admin sửa lại trong tab Danh mục nếu sai. */
function doanKg(ten){
  const t=String(ten||'').toLowerCase().replace(',','.');
  const m=t.match(/(\d+(?:\.\d+)?)\s*(kg|kilo|g|gam|gram|tấn|tan)?/);
  if(!m)return 0;
  const v=parseFloat(m[1]); if(!isFinite(v)||v<=0)return 0;
  const dv=m[2]||'kg';
  if(dv==='g'||dv==='gam'||dv==='gram')return v/1000;
  if(dv==='tấn'||dv==='tan')return v*1000;
  return v;
}
const kgCua=q=>{const v=+kgQC[q];return isFinite(v)&&v>0?v:0};
/* Chia kg ra số bao + phần dư */
function chiaBao(kg,q){
  const dv=kgCua(q); if(dv<=0)return null;
  const so=Math.floor(num(kg)/dv);
  return {so,du:Math.round((num(kg)-so*dv)*1000)/1000,dv};
}

/* Phát hiện trùng — trả Map: giá trị → [tên1, tên2…] chỉ giữ nhóm có ≥2 phần tử */
function nhomTrung(cap){
  const m={};
  cap.forEach(([ten,val])=>{const v=String(val||'').trim();if(!v)return;(m[v]=m[v]||[]).push(ten)});
  const r={}; Object.keys(m).forEach(k=>{if(m[k].length>1)r[k]=m[k]});
  return r;
}
const trungMaSP=()=>nhomTrung(sp.map(x=>[x.ten,hai(x.maSP)]));
const trungMaH =()=>nhomTrung(kho.map(h=>[h,hai(maHuong[h])]));
const trungMaQ =()=>nhomTrung(dr.map(q=>[q,hai(maQC[q])]));
function demTrung(){
  const d=o=>Object.values(o).reduce((a,v)=>a+v.length,0);
  return d(trungMaSP())+d(trungMaH())+d(trungMaQ());
}
/* Trùng TÊN trong cùng một danh mục */
const trungTen=arr=>{const m={},r=new Set();
  arr.forEach(t=>{const k=String(t||'').trim().toLowerCase();if(!k)return;m[k]=(m[k]||0)+1});
  arr.forEach(t=>{const k=String(t||'').trim().toLowerCase();if(m[k]>1)r.add(t)});
  return r};

/* ĐỔI TÊN — tên đang được dùng làm khoá liên kết, nên phải sửa lan ra MỌI chỗ,
   kể cả nhật ký cũ (khách chốt 22/08/2026: đổi tên = sửa cho đúng, không phải đổi thành thứ khác).
   demAnhHuong() đếm trước để hộp thoại nói rõ sẽ động vào bao nhiêu bản ghi. */
function demAnhHuong(loai,cu){
  if(loai==='sp')  return nk.filter(r=>r.sp===cu).length;
  if(loai==='h')   return nk.filter(r=>r.huong===cu||(r.huongList||[]).includes(cu)).length;
  if(loai==='q')   return nk.filter(r=>r.quyCach===cu||(r.dauRa||[]).includes(cu)).length;
  if(loai==='cp')  return nk.filter(r=>r.pkbChat===cu).length;
  if(loai==='nv')  return nk.filter(r=>r.nv===cu).length;
  if(loai==='nl')  return sp.filter(x=>(x.congThucNL||[]).some(it=>it&&it.ten===cu)).length;
  return 0;
}
function doiTen(loai,cu,moi){
  cu=String(cu);moi=String(moi).trim();
  if(!moi||moi===cu)return false;
  const thay=(a,i)=>{const j=a.indexOf(cu);if(j>=0)a[j]=moi;return a};
  const doiKhoa=(o)=>{if(Object.prototype.hasOwnProperty.call(o,cu)){o[moi]=o[cu];delete o[cu]}};

  if(loai==='sp'){
    sp.forEach(x=>{if(x.ten===cu)x.ten=moi});
    nk.forEach(r=>{if(r.sp===cu)r.sp=moi});
  }
  else if(loai==='h'){
    thay(kho); doiKhoa(maHuong); doiKhoa(nguonHuong); doiKhoa(tonKhoHuong);
    if(Object.prototype.hasOwnProperty.call(huongDangDung,cu)){huongDangDung[moi]=huongDangDung[cu];delete huongDangDung[cu]}
    sp.forEach(x=>{
      thay(x.huongs=x.huongs||[]); thay(x.tam=x.tam||[]);
      if(x.huongMe===cu)x.huongMe=moi;
      (x.lichSu||[]).forEach(l=>thay(l.hs=l.hs||[]));
      if(x.nguonHuongChon)doiKhoa(x.nguonHuongChon); // đổi tên hương thì lựa chọn nguồn riêng của mặt hàng cũng đi theo
    });
    nk.forEach(r=>{if(r.huong===cu)r.huong=moi; if(Array.isArray(r.huongList))thay(r.huongList)});
  }
  else if(loai==='q'){
    thay(dr); doiKhoa(maQC); doiKhoa(kgQC);
    sp.forEach(x=>{
      thay(x.dauRa=x.dauRa||[]); if(x.qc===cu)x.qc=moi;
      (x.pb||[]).forEach(d=>{if(d.qc===cu)d.qc=moi});
    });
    nk.forEach(r=>{if(r.quyCach===cu)r.quyCach=moi; if(Array.isArray(r.dauRa))thay(r.dauRa)});
  }
  else if(loai==='cp'){
    cp.forEach(c=>{if(c.ten===cu)c.ten=moi});
    sp.forEach(x=>{if(x.pkbChat===cu)x.pkbChat=moi});
    nk.forEach(r=>{if(r.pkbChat===cu)r.pkbChat=moi});
  }
  else if(loai==='nv'){
    thay(nvDS); sp.forEach(x=>{if(x.nv===cu)x.nv=moi});
    if(nvCuoi===cu)nvCuoi=moi;
    nk.forEach(r=>{if(r.nv===cu)r.nv=moi});
  }
  else if(loai==='nl'){
    thay(nlDM); doiKhoa(nguonNguyenLieu); doiKhoa(tonKhoNguyenLieu);
    if(Object.prototype.hasOwnProperty.call(nlDangDung,cu)){nlDangDung[moi]=nlDangDung[cu];delete nlDangDung[cu]}
    sp.forEach(x=>{(x.congThucNL||[]).forEach(it=>{if(it&&it.ten===cu)it.ten=moi})});
  }
  else return false;
  return true;
}

/* Số lệnh sản xuất — 5 số: YY + 3 số chạy liên tục trong năm, bắt đầu 001 (mục 10) */
function lenhKe(iso){
  const yy=(String(iso||'').match(/^(\d{4})/)||[])[1];
  const y2=yy?yy.slice(2):String(new Date().getFullYear()).slice(2);
  const max=nk.reduce((a,r)=>{const m=String(r.soLenh||'').match(/^(\d{2})(\d{3})$/);
    return m&&m[1]===y2?Math.max(a,+m[2]):a},0);
  return y2+String(max+1).padStart(3,'0');
}

let nlDM=[];

/* 25/08/2026 — nguồn hương liệu: nhà cung cấp + giá theo từng hương, lưu lịch sử (khách chốt).

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
const U8=s=>new TextEncoder().encode(s);
const XE=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function colL(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s}
function sheetXml(rows){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((row,r)=>{x+=`<row r="${r+1}">`;
    row.forEach((v,c)=>{const ref=colL(c)+(r+1);
      if(v===null||v===undefined||v==='')return;
      if(typeof v==='number'&&isFinite(v))x+=`<c r="${ref}"><v>${v}</v></c>`;
      else x+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${XE(v)}</t></is></c>`;});
    x+='</row>';});
  return x+'</sheetData></worksheet>';
}

  let q=0;parts.forEach(p=>{out.set(p,q);q+=p.length});out.set(cdU,q);q+=cdU.length;out.set(eo,q);

}
function taiVe(name,data,mime){

    const b=new Blob([data],{type:mime});

    const a=document.createElement('a');a.href=u;a.download=name;

   cáo/sản lượng theo đúng số kg THỰC TẾ đã dùng (r.slThucTe) — phần nguyên liệu đầu vào còn
   dư (kgVao - slThucTe) sẽ KHÔNG bị tính là "đã dùng" trong tongDaSanXuat(), nên tự động
   quay lại thành tồn kho để đưa sang dự án khác (khách yêu cầu). Bắt buộc nhập lý do ngừng. */
async function ngungLo(id){
  const r=nk.find(x=>x.id===id); if(!r)return;
  if(r.ngungSX){
    const c=await hoi('Tiếp tục sản xuất lại?',`Lô <b>${lotDep(r.lot)}</b> sẽ tính lại đủ <b>${fmt(num(r.kgVao!==undefined?r.kgVao:r.sl))}</b> kg nguyên liệu đầu vào như ban đầu (không còn coi là dư để đưa dự án khác).`,{nutOK:'Tiếp tục sản xuất'});
    if(!c)return;
    r.ngungSX=false; r.ngungLyDo=''; r.ngungLuc=''; r.slThucTe=undefined;
    ghiAudit('batch',r.id,'STOP',{ngungSX:true},{ngungSX:false});
    luuNgay(); ve(); bao('Đã bỏ đánh dấu ngừng'); return;
  }
  const lyDo=await hoi('Lý do ngừng sản xuất',`Vì sao mẻ <b>${lotDep(r.lot)}</b> · ${esc(r.sp)} phải ngừng hẳn để điều chỉnh?`,{nhap:true,goiY:'VD: lỗi máy trộn, sai công thức, chờ kiểm định...',nutOK:'Tiếp'});
  if(lyDo===null||!String(lyDo).trim())return;
  const kgVaoGoc=num(r.kgVao!==undefined?r.kgVao:r.sl);
  const ttS=await hoi('Thực tế đã dùng bao nhiêu kg',
    `Mẻ này khai đầu vào <b>${fmt(kgVaoGoc)}</b> kg. Thực tế đã dùng bao nhiêu kg nguyên liệu trước khi ngừng? Phần còn dư sẽ tự động tính lại vào tồn kho để đưa sang dự án khác.`,
    {nhap:true,goiY:String(kgVaoGoc),giaTri:String(kgVaoGoc),nutOK:'Xác nhận ngừng'});
  if(ttS===null||!String(ttS).trim())return;
  const tt=num(ttS);
  if(!(tt>=0)){bao('Số kg thực tế phải từ 0 trở lên, chưa lưu được');return}
  r.ngungSX=true; r.ngungLyDo=String(lyDo).trim(); r.ngungLuc=new Date().toISOString(); r.slThucTe=tt;
  ghiAudit('batch',r.id,'STOP',{ngungSX:false},{ngungSX:true,ngungLyDo:r.ngungLyDo,slThucTe:tt});
  luuNgay(); ve(); bao('Đã đánh dấu ngừng sản xuất');
}
/* 26/08/2026 — PATCH KIẾN TRÚC V1 (bản O), mục D3: chi phí hương liệu của MỘT bản ghi (r).
   Ưu tiên số đã "chốt cứng" lúc sản xuất (r.chiPhiHuongLucSX) — không bao giờ tính lại bằng
   giá hiện tại nếu đã có snapshot, để lịch sử chi phí không đổi khi giá hương thay đổi sau
   này (test case 6 của bản đặc tả). Chỉ record CŨ chưa từng snapshot (trước bản patch này)
   mới rơi vào fallback tính bằng giá hiện tại — UI phải tự ghi rõ "~ giá ước tính hiện tại". */
function chiPhiHuongRecord(r){
  if(isUnscented(r.huong))return 0; // P0.2: Không mùi luôn 0đ, không suy ra từ giá/mlDung
  if(r.chiPhiHuongLucSX!==undefined&&r.chiPhiHuongLucSX!==null)return num(r.chiPhiHuongLucSX);
  const g=giaHuongHienTai(r.huong);
  return g>0?num(r.mlDung)*g:0;
}
function gom(list,key,val){
  const m={};list.forEach(r=>{const k=key(r)||'—';m[k]=m[k]||{n:0,kg:0,ml:0,cp:0};
    m[k].n++;m[k].kg+=num(r.sl);m[k].ml+=num(r.mlDung);
    m[k].cp+=chiPhiHuongRecord(r)});
  return Object.entries(m).sort((a,b)=>b[1].kg-a[1].kg);
}

   "Áp lại từ TCCS" — đây là bản thử nghiệm thu nhỏ của cơ chế "Đồng bộ" khách đang bàn. */
function veTemKhoa(p,i,ma){
  const th=temThieu(p), d=TCCS_DATA[ma]||{};

  o+=th.length

    :`<div class="temstat ok">Hồ sơ tem lấy trọn từ TCCS ${esc(d.soTCCS||ma)} — đã đủ để in.</div>`;
  o+=`<div class="hint"><b>Mặt hàng này đã khoá theo TCCS</b> — không còn ô nào gõ tay được nữa.
    Tất cả lấy thẳng từ hồ sơ TCCS đã ban hành. Muốn sửa nội dung, phải cập nhật hồ sơ TCCS trước.</div>`;
  o+=`<button class="tccsbtn" data-tccskhoa="${i}">Áp lại từ TCCS</button>`;
  TEM_O.forEach(([k,nhan,hint,bb])=>{
    const v=(p.hstem||{})[k]||'';
    o+=`<div class="tf"><label>${esc(nhan)}${bb?'<i>*</i>':''}</label>`;
    o+=v?`<div class="tccsval">${esc(v)}</div>`:`<div class="tccsval trong">— chưa có trong TCCS —</div>`;
    if(hint)o+=`<div class="hint">${esc(hint)}</div>`;
    o+=`</div>`;
  });
  return o+`</div>`;
}

/* Chỉ dựng ĐÚNG 1 trang A4 dàn kín tem giống nhau (temCot x temHang ô, đã canh khổ A4).

   tự làm bằng tính năng "in nhiều bản" (Ctrl+P → Số bản in) của trình duyệt/máy in.
   Quyết định 25/08/2026: đơn giản hoá theo yêu cầu, đồng thời loại bỏ luôn gốc rễ rủi ro
   treo máy khi lô có số bao rất lớn (vd 27.000 bao) — trước đây chặn bằng TEM_TOI_DA,
   giờ không còn cách nào sinh nhiều trang nữa nên không còn nguy cơ đó. */
function trangTem(r,p){
  const cot=Math.max(1,Math.min(10,+temCot||5)), hang=Math.max(1,Math.min(10,+temHang||4));
  const moiTo=cot*hang;
  const mot=temHTML(r,p);
  const cls=moiTo<=2?'to-lon':(moiTo<=6?'to-vua':'to-nho');
  return `<div class="to ${cls}" style="grid-template-columns:repeat(${cot},1fr);grid-template-rows:repeat(${hang},1fr)">`
    +Array.from({length:moiTo}).map(()=>mot).join('')+`</div>`;
}

/* In tem cho MỘT BẢN GHI cụ thể — tra theo id, KHÔNG tra theo lot.
   Nhiều mẻ khác ngày trong cùng tháng, cùng SP/hương/quy cách CỐ Ý dùng chung
   một số lô (quy ước công ty) — tra bằng lot sẽ lấy nhầm bản ghi (bug H2,
   xem PRODUCTION-PROJECT-AUDIT.md). id là khoá duy nhất thật của từng bản ghi. */
async function inTem(id){
  const r=nk.find(x=>x.id===id);
  if(!r){bao('Không tìm thấy bản ghi');return}
  if(r.huy){await hoi('Lô này đã huỷ','Lô đã được đánh dấu huỷ nên không in tem được. Bỏ huỷ trước nếu muốn in lại.',{nutOK:'Đã hiểu',nutHuy:'Đóng'});return}
  const p=sp.find(x=>x.ten===r.sp);
  if(!p){await hoi('Không in được',

/* 25/08/2026: tổng kg đã sản xuất từ mốc ISO — 1 mẻ có thể ra nhiều dòng nk (mỗi quy cách 1
   dòng), phải gộp về đúng 1 nhóm mẻ gốc theo tiền tố id trước dấu "-" để khỏi đếm trùng.
   25/08/2026-H: nếu mẻ (nhóm) đã bị đánh dấu "ngừng sản xuất" ở BẤT KỲ dòng nào, tính theo
   đúng số kg THỰC TẾ đã dùng (r.slThucTe) thay vì trọn kgVao đã khai — phần dư coi như CHƯA
   dùng, tự động quay lại tồn kho để đưa sang dự án khác. */
function tongDaSanXuat(tuISO){
  const nhom={};
  nk.forEach(r=>{
    if(r.huy)return;
    if(tuISO && String(r.ts||'')<tuISO)return;
    const goc=String(r.id||'').split('-')[0]; if(!goc)return;
    (nhom[goc]=nhom[goc]||[]).push(r);
  });
  let tong=0;
  Object.values(nhom).forEach(ds=>{
    const rNgung=ds.find(r=>r.ngungSX);
    tong+=rNgung?num(rNgung.slThucTe):num(ds[0].kgVao!==undefined?ds[0].kgVao:ds[0].sl);
  });
  return Math.round(tong*1000)/1000;
}

/* 26/08/2026 — PATCH KIẾN TRÚC V1, mục E: theBC() cũ dùng CHUNG 1 khung cho 3 bảng có ý nghĩa

   — đây CHỈ là tỷ trọng kg của dòng đó trên tổng kg của CHÍNH bảng đang xem, không phải %

/* 25/08/2026 — khối "Nguồn hương liệu": nhà cung cấp + giá theo từng hương (lưu lịch sử),
   và ô "Hương hiện tại đang dùng" chọn từ các nhà cung cấp đã khai cho hương đó, để đối
   chiếu khai báo với thực tế đang mua (khách yêu cầu, tránh nhầm/khó kiểm tra). */
function veNguonHuong(){
  /* 26/08/2026 — PATCH V1.1 mục P0.2: "Không mùi" không phải hương thật nên KHÔNG quản lý
     NCC/giá/tồn kho/cảnh báo cho nó — loại khỏi danh sách render ở đây trước khi tính toán. */
  const khoNguon=kho.filter(h=>!isUnscented(h));
  const sap=khoNguon.filter(h=>{const tk=tonKhoHuong[h];if(tk&&!(num(tk.con)>0))return true;const d=uocConLai(h);return d!==null&&d<=nguongCanhBaoNgay});
  let o=`<div class="sec">Nguồn hương liệu — nhà cung cấp &amp; giá</div>`;
  if(duLieuCu)o+=`<div class="canh">Dữ liệu này được tạo TRƯỚC bản cập nhật đơn vị hương liệu — đơn vị đúng theo nghiệp vụ là <b>GRAM (g)</b>, không phải mg như nhãn cũ. Số liệu đã lưu KHÔNG bị tự động đổi (app không tự nhân/chia gì cả) — vui lòng kiểm tra lại <b>Định lượng hương</b> của từng mặt hàng và <b>tồn kho hương liệu</b> cho đúng ý nghĩa gram trước khi dùng tiếp.</div>`;
  if(sap.length)o+=`<div class="canh"><b>${sap.length}</b> hương sắp hết trong kho (ước còn dưới ${nguongCanhBaoNgay} ngày): <b>${sap.map(esc).join(' · ')}</b>.</div>`;
  o+=`<div class="log" style="margin:0 12px 6px">Mỗi hương khai được nhiều nhà cung cấp, mỗi lần khai/đổi giá đều lưu lại (không mất lịch sử cũ). Chọn "Hương hiện tại đang dùng" đúng với thực tế đang mua để đối chiếu cho dễ. Ngưỡng cảnh báo sắp hết: <input id="nguongCB" type="number" min="1" style="width:52px;font:inherit;font-family:var(--mono);background:var(--bg);color:var(--txt);border:1px solid var(--line-2);border-radius:6px;padding:3px 5px" value="${nguongCanhBaoNgay}"> ngày.</div>
  <div class="log" style="margin:0 12px 10px">"Không mùi" không cần khai nhà cung cấp/giá (không phải hương liệu thật) nên không hiện ở đây.</div>`;
  /* 26/08/2026-N2: mỗi hương gói lại thành 1 thẻ ĐÓNG/MỞ (giống bangTra) — khách phản hồi
     danh sách hương liệu bung hết ra rối mắt, khó dò. Đóng theo mặc định, bấm mở đúng hương
     cần xem/sửa thì cuộn tới (scrollIntoView) cho tiện, không phải dò tay giữa danh sách dài. */
  o+=khoNguon.map(h=>veKhoiNguon('h',h)).join('');

}
/* 27/08/2026 (phản hồi lần 3) — Nguồn nguyên liệu: nhà cung cấp + giá + tồn kho riêng TỪNG
   nguyên liệu, thay cho "Tiến độ sử dụng lô nguyên liệu đầu vào" cũ (1 số tổng, không theo
   loại). Dùng chung khối UI/hàm với hương liệu (veKhoiNguon('nl',...)). */
function veNguyenLieuNguon(){
  if(!nlDM.length)return '';
  let o=`<div class="sec">Nguồn nguyên liệu — nhà cung cấp &amp; giá</div>`;
  const het=nlDM.filter(v=>{const tk=tonKhoNguyenLieu[v];return tk&&!(num(tk.con)>0)});
  if(het.length)o+=`<div class="canh"><b>${het.length}</b> nguyên liệu đã hết tồn kho trong hệ thống: <b>${het.map(esc).join(' · ')}</b>.</div>`;
  o+=`<div class="log" style="margin:0 12px 10px">Mỗi nguyên liệu khai được nhiều nhà cung cấp, mỗi lần khai/đổi giá đều lưu lại (không mất lịch sử cũ). Tồn kho cập nhật tay — hệ thống chưa tự trừ theo sản xuất cho nguyên liệu (khác hương liệu).</div>`;
  o+=nlDM.map(v=>veKhoiNguon('nl',v)).join('');
  return o;
}
/* 27/08/2026 (phản hồi lần 3): 1 thẻ nguồn/giá — dùng CHUNG cho hương liệu (loai='h') và
   nguyên liệu (loai='nl'), xem khai báo moThemNguon/nguonMapCua ở trên. Nút "+ Thêm/đổi" và
   "Sửa" giờ mở PANEL 1 lần (tên NCC + giá + số kg [+ tồn kho nếu là thêm mới]) thay vì chuỗi
   hộp thoại hỏi từng bước — khách phản hồi "nhập xong cái này mới qua cái kia". */
function parseNguonKey(raw){ // "h:Ten" | "h:Ten:2" | "nl:Ten" | "nl:Ten:2" — ten có thể chứa ":" (hiếm)
  const p=String(raw||'').split(':'), loai=p[0];
  const coIx=p.length>2 && /^\d+$/.test(p[p.length-1]);
  const ix=coIx?+p[p.length-1]:undefined;
  const ten=p.slice(1,coIx?p.length-1:p.length).join(':');
  return {loai,ten,ix};
}
function nguonMapCua(loai){ return loai==='h'?nguonHuong:nguonNguyenLieu; }

function tonKhoMapCua(loai){ return loai==='h'?tonKhoHuong:tonKhoNguyenLieu; }

// 27/08/2026-R2: khách phản hồi tồn kho hương liệu để đơn vị "gram" khó nhập/khó đọc (mua/đếm
// theo kg) — đổi màn hình nhập/hiển thị tồn kho hương liệu sang KG như nguyên liệu, hệ thống tự
// nhân/chia 1000 để quy đổi sang gram khi lưu/đọc (nội bộ vẫn giữ đơn vị gram như cũ cho tieuHaoNgay/
// uocConLai — chỉ đổi lớp hiển thị+nhập, không đổi cách tính đã đúng).
function dvTonKho(loai){ return 'kg'; }
function giaTrenDonVi(loai,e){ // đ/g cho hương (mua theo kg nhưng dùng theo g), đ/kg cho nguyên liệu
  if(!e.soKg)return 0;
  return loai==='h'?e.gia/(e.soKg*1000):e.gia/e.soKg;
}
// 27/08/2026 (rà lỗi "ít lỗi hơn"): dvGia() tách RIÊNG khỏi dvTonKho() — 2 hàm tưởng giống nhau
// (đều trả "kg") nhưng dùng cho 2 việc khác semantic: dvTonKho() là đơn vị Ô NHẬP tồn kho (đổi
// sang kg cho cả 2 loại — xem ghi chú trên), còn dvGia() là đơn vị của giaTrenDonVi() (giá/g cho
// hương, giá/kg cho nguyên liệu — KHÔNG đổi, hương vẫn tính giá theo gram). Trước khi tách, dòng
// hiển thị giá NCC hương liệu dùng nhầm dvTonKho() làm nhãn, sau khi dvTonKho() đổi thành 'kg'
// thì giá "đ/g" bị ghi nhãn sai thành "đ/kg" (sai 1000 lần) — lỗi thật do sửa ở trên gây ra.
function dvGia(loai){ return loai==='h'?'g':'kg'; }
function veThemNguonPanel(loai,ten,ix){
  const key=loai+':'+ten+(ix!==undefined?':'+ix:'');
  if(!moThemNguon.has(key))return '';
  const sua=ix!==undefined;
  const ds=nguonMapCua(loai)[ten]||[];
  const e0=sua?ds[ix]:null;
  const tk=tonKhoMapCua(loai)[ten];
  return `<div class="nguonform" data-nguonform="${esc(key)}" style="background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:10px;margin-top:8px">

/* Tồn kho hương liệu — cảnh báo sắp hết (khách chọn: tự tính từ tốc độ tiêu hao thực tế) */
function ngayTruoc(n){const d=new Date();d.setDate(d.getDate()-n);return `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`}
function tieuHaoNgay(h,soNgay=30){
  const tu=ngayTruoc(soNgay);
  const tong=nk.filter(r=>!r.huy&&r.huong===h&&(r.ngaysx||'')>=tu).reduce((a,r)=>a+num(r.mlDung),0);
  return tong/soNgay;
}
/* Nhắc lô ghi lâu mà chưa in tem — xét TOÀN BỘ nk (không phụ thuộc bộ lọc ngày đang chọn),
   để không bị bỏ sót khi admin đang lọc khoảng ngày khác. */
function loChuaInTem(){
  const bd=ngayTruoc(ngayNhacInTem);
  return nk.filter(r=>!r.huy&&!r.daInTem&&(r.ngaysx||'')<=bd);
}
function uocConLai(h){
  const tk=tonKhoHuong[h]; if(!tk||!(num(tk.con)>0))return null;
  const th=tieuHaoNgay(h); if(!(th>0))return null;
  return Math.floor(num(tk.con)/th);
}
/* 25/08/2026-I: sửa lỗi hiện "còn dùng được ~null ngày" — trước đây khi tồn kho = 0 nhưng vẫn

  else o+=`<span style="color:var(--txt-3)">Chưa đủ 30 ngày dữ liệu ghi mẻ để ước tính</span>`;
  o+=`</div><button class="addbtn" data-suatk="${esc(h)}" style="margin:6px 0 0;width:100%">Cập nhật tồn kho hiện có</button>`;

/* Giá hương liệu hiện tại (đ/g) — theo NCC đang dùng, dùng để tự tính chi phí mỗi mẻ.
   25/08/2026: khách chốt hương liệu mua theo KG (không theo lít/ml) — khai giá theo kg.
   26/08/2026 — PATCH KIẾN TRÚC V1, mục C1: SỬA LỖI nghiệp vụ — đơn vị hương liệu thật sự là
   GRAM (g), không phải mg (xem business rule A4). Trước đây quy đổi kg→"mg" (chia 1e6) làm
   giá/đơn vị sai lệch 1000 lần. Quy đổi ĐÚNG là 1kg = 1.000g, nên chia soKg*1000.
   LEGACY FIELD NAME: p.ml/r.mlDung/r.mlChuan — vẫn giữ tên field để không phá dữ liệu cũ,
   nhưng từ bản này giá trị được HIỂU là GRAM (g), không phải ml/mg — chỉ đổi semantic/nhãn
   hiển thị, KHÔNG đổi số học/tên field (xem mục B1 bản đặc tả PEROMA_PATCH_ARCHITECTURE_V1). */
function giaHuongHienTai(h){
  if(isUnscented(h))return 0; // P0.2: Không mùi không có NCC/giá
  const ncc=huongDangDung&&huongDangDung[h]; if(!ncc)return 0;
  const ds=(nguonHuong[h]||[]).filter(e=>e.ncc===ncc&&num(e.soKg)>0);
  if(!ds.length)return 0;
  const e=ds[ds.length-1];
  return e.gia/(e.soKg*1000);
}
/* 26/08/2026-S — Nguồn hương liệu theo từng mặt hàng + tồn kho riêng từng dòng NCC/giá. */
function conLaiNguon(e){ return Math.round((num(e.soKg)-num(e.daDungKg||0))*1000)/1000; }
// các dòng NCC/giá của 1 hương mà VẪN CÒN TỒN KHO (>0kg) — kèm chỉ số (ix) trong mảng gốc
function nguonConHang(h){
  return (nguonHuong[h]||[]).map((e,ix)=>({e,ix})).filter(({e})=>conLaiNguon(e)>0);
}
// nguồn ĐANG DÙNG cho 1 hương, RIÊNG theo mặt hàng p — chỉ tính trong số nguồn còn tồn kho
function nguonDangDungCuaMatHang(p,h){
  if(isUnscented(h))return null;
  const conHang=nguonConHang(h);
  if(!conHang.length)return null;
  if(conHang.length===1)return conHang[0];
  const ix=p.nguonHuongChon&&p.nguonHuongChon[h];
  return conHang.find(x=>x.ix===ix)||null;
}
function giaHuongChoMatHang(p,h){
  const c=nguonDangDungCuaMatHang(p,h);
  return c?c.e.gia/(c.e.soKg*1000):0;
}
// danh sách tên hương mà mặt hàng p đang dùng nhưng CHƯA XÁC ĐỊNH rõ nguồn (phải chọn tay)
function thieuNguonMatHang(p){
  return (p.huongs||[]).filter(h=>{
    if(isUnscented(h))return false;
    if(nguonDangDungCuaMatHang(p,h))return false;
    const conHang=nguonConHang(h).length, tongKhai=(nguonHuong[h]||[]).length;
    return conHang>1 || (conHang===0 && tongKhai>0); // ≥2 nguồn còn hàng, hoặc từng có nguồn mà nay hết sạch
  });
}

   .json sẵn có, xem xuatMe()/nvIn ở bản Nhân viên). Hiện 10 báo cáo gần nhất, mới nhất trước.
   25/08/2026-J: khách yêu cầu gắn báo cáo với ĐÚNG LÔ đã ghi (r.lot/kgKeHoach) thay vì ghi
   chú tự do theo mặt hàng — so sánh trực tiếp kế hoạch/thực tế của đúng lô đó. Đồng thời hiện
