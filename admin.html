   thống không lưu giá lịch sử; chỉ hiện khi có giá). */
/* 26/08/2026 — PATCH V1.1 mục P0.1 (H2): TRƯỚC ĐÂY tra cứu bằng `nk.find(x=>x.lot===r.lot)`
   — SAI vì `lot` là mã truy xuất nghiệp vụ, KHÔNG phải khóa duy nhất của 1 bản ghi (1 lần ghi
   mẻ có thể sinh nhiều dòng theo quy cách, và dữ liệu có thể trùng lot ở biên — xem H2 trong
   peroma-safety-guard). Nếu Nhân viên đã gửi kèm `recordId` (=nk.id, bản patch mới) thì tra
   ĐÚNG bản ghi đó — không đoán. Báo cáo CŨ (trước bản patch, chưa có recordId) fallback bằng
   khóa tổ hợp lot+sp+quyCach+kgKeHoach; nếu tổ hợp đó khớp 0 hoặc NHIỀU HƠN 1 bản ghi thì
   TUYỆT ĐỐI không tự chọn đại — trả về "không xác định duy nhất" để Admin biết cần đối chiếu
   tay, còn hơn gắn nhầm chi phí/sản lượng vào bản ghi sai. KHÔNG đổi sinhLot()/format lot. */
/* 26/08/2026 — PATCH V1.1 mục P1-B: trạng thái vòng đời tối giản của MỘT DÒNG đã ghi trong
   nk[] — TÍNH TỪ dữ liệu sẵn có (nk + bcNgay), không thêm field mới phải giữ đồng bộ tay,
   không tạo hệ thống trạng thái song song với nk[]/bcNgay[] đã có (đúng yêu cầu "dùng batchId,
   nk[] và bcNgay[] hiện có làm bridge"). PLANNED/CONFIRMED là chuyện của phía Nhân viên trước
   khi ghi mẻ (p.daInPhieu/p.xacNhanCT) — Admin chỉ thấy record TỪ RECORDED trở đi. */
const TRANG_THAI_SX={CANCELLED:{n:'Đã huỷ',mau:'var(--red)'},RECORDED:{n:'Đã ghi — chờ chốt thực tế',mau:'var(--amber)'},COMPLETED:{n:'Đã chốt thực tế',mau:'var(--cyan)'}};
function trangThaiSXCua(r){
  if(!r)return null;
  if(r.huy)return 'CANCELLED';
  const co=bcNgay.some(b=>b.recordId===r.id);
  return co?'COMPLETED':'RECORDED';
}
function resolveBcRecord(r){
  if(r.recordId){const x=nk.find(y=>y.id===r.recordId&&!y.huy);return {rec:x||null,ambiguous:false}}
  if(!r.lot)return {rec:null,ambiguous:false};
  const ung=nk.filter(x=>!x.huy&&x.lot===r.lot&&x.sp===r.sp&&x.quyCach===r.quyCach&&num(x.sl)===num(r.kgKeHoach));
  if(ung.length===1)return {rec:ung[0],ambiguous:false};
  if(ung.length>1)return {rec:null,ambiguous:true};
  return {rec:null,ambiguous:false};
}
function veBaoCaoNgay(){
  /* 25/08/2026-K: khách phản hồi "đã đẩy dữ liệu từ nhân viên qua nhưng không thấy báo cáo
     đâu" — trước đây bcNgay rỗng thì hàm này trả về '' (im lặng, không hiện gì cả), rất dễ
     hiểu nhầm là tính năng biến mất/lỗi. Giờ LUÔN hiện khối này (có tiêu đề cố định), kèm
     dòng gợi ý khi chưa có báo cáo nào — để khách biết chắc: đã nhận file nhưng nhân viên
     chưa gửi báo cáo nào, hay đang xem nhầm chỗ, thay vì đoán mò. */
  if(!bcNgay.length)
    return `<div class="sec">Chốt thực tế sản xuất theo lô</div><div class="card">
      <div class="hint">Chưa nhận được xác nhận số thực tế nào từ nhân viên. Từ 27/08/2026, báo cáo tự gửi về khi nhân viên bấm "Xác nhận số thực tế" (không cần xuất/nhận file tay nữa) — nếu máy nhân viên không có mạng lúc đó, gửi tay qua tab Dữ liệu → "Nhận file mẻ từ nhân viên", giống nhận mẻ.</div></div>`;
  const ds=bcNgay.slice().reverse().slice(0,10);
  return `<div class="sec">Chốt thực tế sản xuất theo lô (gần nhất)</div>`+
    ds.map(r=>{
      const {rec:nkr,ambiguous:bcAmbig}=resolveBcRecord(r);
      const cp=nkr?chiPhiHuongRecord(nkr):0;
      const coSnap=nkr&&nkr.chiPhiHuongLucSX!==undefined&&nkr.chiPhiHuongLucSX!==null;
      const kh=num(r.kgKeHoach), tt=num(r.kgThucTe), v=Math.round((tt-kh)*1000)/1000;
      const pct=kh>0?Math.round((v/kh)*10000)/100:0;
      const vNoi=kh>0&&Math.abs(v)>0.001;
      const vDau=v>0?'+':(v<0?'-':''), pDau=pct>0?'+':'';
      return `<div class="lot"><h5>${esc(r.sp)}${r.quyCach?' · '+esc(r.quyCach):''} — ${vnNgay(r.ngay)}</h5>
      ${r.lot?`<div class="kv"><span>Số lô</span><b>${lotDep(r.lot)}</b></div>`:''}
      ${kh>0?`<div class="kv"><span>Kế hoạch (lúc ghi mẻ)</span><b>${fmt(kh)} kg</b></div>`:''}
      <div class="kv"><span>Thực tế đã chốt</span><b style="color:${vNoi?'var(--amber)':'var(--cy)'}">${fmt(tt)} kg</b></div>
      ${vNoi?`<div class="kv"><span>Chênh lệch</span><b style="color:${Math.abs(pct)>2?'var(--red)':'var(--amber)'}">${vDau}${fmt(Math.abs(v))} kg (${pDau}${pct.toFixed(2).replace('.',',')}%)</b></div>`:''}
      ${cp>0?`<div class="kv"><span>${coSnap?'Chi phí hương liệu lúc sản xuất':'Chi phí hương liệu ~ giá ước tính hiện tại'}</span><b>${fmt(Math.round(cp))} đ</b></div>`:''}
      ${bcAmbig?`<div class="kv"><span>Chi phí hương liệu</span><b style="color:var(--red)">Không xác định duy nhất — cần đối chiếu tay</b></div>`:''}
      ${r.lyDo?`<div class="kv"><span>Lý do</span><b style="color:var(--amber)">${esc(r.lyDo)}</b></div>`:''}
      <div class="kv"><span>Người báo cáo</span><b>${esc(r.nv)}</b></div>
      <div class="kv"><span>Lúc</span><b>${esc(String(r.ts||'').replace('T',' ').slice(0,19))}</b></div>
      </div>`}).join('');
}

   chuẩn + đủ hồ sơ tem + đã cấp mã; mặt hàng đình chỉ không tính vào mẫu số. */
const TQ_MAU_AV=['#C2410C','#15803D','#1D4ED8','#7E22CE','#B45309','#0F766E'];
function tqChuDau(t){const w=String(t||'?').trim().split(/\s+/).filter(Boolean);return (w.length>1?w.slice(-2).map(x=>x[0]).join(''):(w[0]||'?').slice(0,2)).toUpperCase()}
function tqMauAv(t){let h=0;for(const c of String(t))h=(h*31+c.charCodeAt(0))>>>0;return TQ_MAU_AV[h%TQ_MAU_AV.length]}
function tqGon(v){return v>=10000?Math.round(v/1000)+'k':v>=1000?(Math.round(v/100)/10)+'k':fmt(Math.round(v))}
function tqTran(max){if(!(max>0))return 10;const p=10**Math.floor(Math.log10(max)),m=max/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}
function tqXuHuong(nay,truoc){
  if(!(truoc>0))return '';
  const pct=Math.round((nay-truoc)/truoc*100);
  if(pct===0)return '<span class="mo" style="margin:0">→ 0%</span>';
  return pct>0?'<span class="tang">↗ '+pct+'%</span>':'<span class="giam">↘ '+Math.abs(pct)+'%</span>';
}
function tqBieuDo(ngay,giaTri){
  // bề ngang SVG theo đúng ô chứa để chữ trục luôn đọc được (điện thoại không bị thu nhỏ còn 5px)
  const W=Math.max(300,Math.min(900,(document.getElementById('viewTQ').clientWidth||660)-(innerWidth>=1100?560:48))),H=210,L=40,R=26,T=12,B=28,tran=tqTran(Math.max(0,...giaTri)),n=giaTri.length;
  const x=i=>L+(W-L-R)*(n>1?i/(n-1):0), y=v=>T+(H-T-B)*(1-v/tran);
  const duong=giaTri.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  let o='<svg class="tqchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sản lượng kg theo ngày, '+n+' ngày gần nhất">'
    +'<defs><linearGradient id="tqMien" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="mien0"/><stop offset="1" class="mien1"/></linearGradient></defs>';
  for(let k=0;k<=4;k++){const yy=y(tran*k/4).toFixed(1);
    o+='<line class="luoi" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text class="nhan" x="'+(L-8)+'" y="'+(+yy+4)+'" text-anchor="end">'+tqGon(tran*k/4)+'</text>'}
  const buoc=W<420?3:2;
  ngay.forEach((d,i)=>{if((n-1-i)%buoc)return;
    o+='<text class="nhan" x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===n-1?'end':'middle')+'">'+d.slice(8,10)+'/'+d.slice(5,7)+'</text>'});
  o+='<path d="'+duong+' L'+x(n-1).toFixed(1)+' '+(H-B)+' L'+L+' '+(H-B)+' Z" fill="url(#tqMien)"/>'
    +'<path class="duong" d="'+duong+'"/><circle class="cham" r="4" cx="'+x(n-1).toFixed(1)+'" cy="'+y(giaTri[n-1]).toFixed(1)+'"/>';
  return o+'</svg>';
}
function tqGauge(pct){
  const p=Math.max(0,Math.min(100,pct));
  return '<svg class="gauge" viewBox="0 0 200 118" role="img" aria-label="'+p+'%">'
    +'<path class="nen" d="M22 104 A78 78 0 0 1 178 104" fill="none" stroke-width="18" stroke-linecap="round"/>'
    +(p>0?'<path class="gt" d="M22 104 A78 78 0 0 1 178 104" fill="none" stroke-width="18" stroke-linecap="round" pathLength="100" stroke-dasharray="'+p+' 100"/>':'')
    +'<text x="100" y="100" text-anchor="middle">'+p+'%</text></svg>';
}

  // Biểu đồ sản lượng 14 ngày + 3 ô nhỏ — như khối "Growth" của mẫu

    const chu=tt==='het'?'hết hàng':d!==null?'~'+d+' ngày':tk?fmt(num(tk.con)/1000)+' kg':'chưa khai tồn';
    return {h,tt,chu,thu:tt==='het'?0:tt==='sap'?1:2};
  }).sort((a,b)=>a.thu-b.thu||a.h.localeCompare(b.h,'vi'));
  const canXem=huongDs.filter(x=>x.tt!=='ok').length;
  const viec=[
    [loChuaInTem().length,'lô chưa in tem (ghi quá '+ngayNhacInTem+' ngày)','bc',true],
    [chuaMa,'mã chưa cấp trong Danh mục','ma',true],
    [sp.filter(p=>!(p.huongs||[]).length).length,'mặt hàng chưa có hương','ct',false],
    [sp.filter(p=>!nhuNhau(p.huongs,p.tam)).length,'mặt hàng đổi hương chưa lưu','ct',false],
    [canXem,'hương sắp hết hoặc đã hết','ma',true],

    +(viec.length?viec.map(v=>'<div class="tqviec'+(v[3]?' xau':'')+'" data-tqgo="'+v[2]+'"><b>'+v[0]+'</b><span>'+v[1]+'</span></div>').join('')

  // Top mặt hàng 30 ngày — như khối "Top states" của mẫu
  const top5=top.slice(0,5), maxKg=top5.length?top5[0][1].kg:0;
  o+='<div class="w w-4"><h4>Top mặt hàng <small>30 ngày · kg</small></h4>'
    +(top5.length?'<div class="tqbars">'+top5.map(([k,v])=>'<div class="tqbar" title="'+esc(k)+': '+fmt(v.kg)+' kg, '+v.n+' mẻ"><i style="width:'+(maxKg>0?Math.max(8,Math.round(v.kg/maxKg*100)):0)+'%"></i><span><b>'+esc(k)+'</b>'+tqGon(v.kg)+'</span></div>').join('')+'</div>'
      :'<div class="tqtrong">30 ngày qua chưa có mẻ nào.</div>')
    +'<button class="xem" data-tqgo="bc">Xem báo cáo →</button></div>';

  // Tồn kho hương liệu — như khối "New deals" (các thẻ nhỏ) của mẫu
  o+='<div class="w w-4"><h4>Tồn kho hương liệu <small>'+(canXem?canXem+' cần xem':'')+'</small></h4>'
    +(huongDs.length?'<div class="tqchips">'+huongDs.map(x=>'<button class="tqchip '+x.tt+'" data-tqgo="ma" title="Mở tab Danh mục để xem nguồn và tồn kho"><i>+</i>'+esc(x.h)+' <em>'+esc(x.chu)+'</em></button>').join('')+'</div>'
      :'<div class="tqtrong">Chưa có hương nào trong danh mục.</div>')
    +'<button class="xem" data-tqgo="ma">Xem danh mục →</button></div>';

  $('viewTQ').innerHTML=o+'</div>';
}
function chuyenTab(t){
  tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));
  ve();window.scrollTo(0,0);
}

function ve(){
  requestAnimationFrame(docao);
  $('viewTQ').style.display = tab==='tq'?'':'none';
  $('viewCT').style.display = tab==='ct'?'':'none';
  $('viewMA').style.display = tab==='ma'?'':'none';
  $('viewBC').style.display = tab==='bc'?'':'none';
  $('viewSL').style.display = tab==='sl'?'':'none';
  $('applyBox').style.display = tab==='ct'?'':'none';
  $('editBtn').style.display = tab==='ct'?'':'none';
  const thieu=sp.filter(p=>!(p.huongs||[]).length).length;
  const chuaLuu=sp.filter(p=>!nhuNhau(p.huongs,p.tam)).length;
  const chan=sp.filter(p=>p.tt==='dinh').length;
  const tKg=nk.reduce((a,r)=>a+num(r.sl),0);
  const chuaMa=sp.filter(x=>!hai(x.maSP)).length+kho.filter(h=>!hai(maHuong[h])).length+dr.filter(q=>!hai(maQC[q])).length;
  const dupMa=demTrung();
  $('stat').innerHTML = tab==='ma'
    ? `<b>${sp.length}</b> mặt hàng · <b>${kho.length}</b> hương · <b>${dr.length}</b> quy cách · <b>${nvDS.length}</b> NV`
      +(chuaMa?` · <b>${chuaMa}</b> chưa cấp mã`:'')+(dupMa?` · <b>${dupMa}</b> TRÙNG MÃ`:'')
    : tab==='ct'
    ? `<b>${sp.length}</b> mặt hàng${chan?` · <b>${chan}</b> đình chỉ`:''}${thieu?` · <b>${thieu}</b> chưa hương`:''}${chuaLuu?` · <b>${chuaLuu}</b> chưa lưu`:''} · <b>${nk.length}</b> mẻ${sua?' · HIỆN NÚT XOÁ':''}`
    : `<b>${nk.length}</b> mẻ · <b>${fmt(tKg)}</b> kg thành phẩm`;
  if(tab==='tq')veTQ(); else if(tab==='ct')veCT(); else if(tab==='ma')veMa(); else if(tab==='bc')veBC(); else veSL();
}

/* Đổi tên — chỉ chạy khi rời ô, và hỏi lại vì sẽ sửa cả nhật ký cũ */
$('viewMA').addEventListener('focusout',async e=>{
  const el=e.target; if(el.dataset.ten===undefined)return;
  const loai=el.dataset.ten, cu=el.dataset.cu, moiT=String(el.value||'').trim();
  if(loai==='h'&&isUnscented(cu)){el.value=cu;bao('"Không mùi" là mục hệ thống — không đổi tên được');return}
  if(!moiT){el.value=cu;bao('Tên không được để trống');return}
  if(moiT===cu)return;
  const ds={sp:sp.map(x=>x.ten),h:kho,q:dr,cp:cp.map(c=>c.ten),nv:nvDS,nl:nlDM}[loai]||[];
  if(ds.some(t=>t!==cu&&t.toLowerCase()===moiT.toLowerCase())){
    el.value=cu; await hoi('Tên đã tồn tại',`Đã có mục tên <b>${esc(moiT)}</b> trong danh mục này.<br>Hai mục trùng tên sẽ không phân biệt được.`,{nutOK:'Đã hiểu',nutHuy:'Đóng'}); veMa(); return}
  const dem=demAnhHuong(loai,cu);
  const nhan={sp:'mặt hàng',h:'hương',q:'quy cách',cp:'chất phun',nv:'nhân viên',nl:'nguyên liệu'}[loai];
  const c=await hoi('Đổi tên '+nhan,
    `<b>${esc(cu)}</b><br>→ <b style="color:var(--amber)">${esc(moiT)}</b><br><br>`+
    (loai==='nl'
      ?(dem?`Sẽ sửa tên trong <b>${dem}</b> dòng "Hàm lượng nguyên liệu" của mặt hàng đang dùng tên này.`
            :`Chưa có mặt hàng nào đang dùng nguyên liệu này trong công thức.`)
      :(dem?`Sẽ sửa tên trong <b>${dem}</b> bản ghi nhật ký cũ để báo cáo không bị tách dòng.`
            :`Chưa có bản ghi nhật ký nào dùng tên này.`))+
    `<br><br>Tên cũ sẽ không còn ở bất kỳ đâu.`,
    {nutOK:'Đổi tên'});
  if(!c){el.value=cu;veMa();return}
  doiTen(loai,cu,moiT); luuNgay(); ve(); bao('Đã đổi tên · '+moiT);
});

$('viewMA').addEventListener('click',async e=>{
  const jt=e.target.closest('[data-jumpthieu]');
  if(jt){const el=document.querySelector('.marow.trong');
    if(el){el.scrollIntoView({block:'center',behavior:'smooth'});
      el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
      setTimeout(()=>el.classList.remove('flash'),1400);}
    return}
  const tr=e.target.closest('[data-tra]');
  if(tr){const k=tr.dataset.tra, dangMo=moTra.has(k);
    dangMo?moTra.delete(k):moTra.add(k); veMa();
    /* 26/08/2026-N2: mở ra thì cuộn tới đúng chỗ vừa mở — khối đóng/mở nằm rải rác trong
       danh sách dài (12+ hương, 3 bảng tra), không cuộn tới thì mở xong vẫn phải tự dò. */
    if(!dangMo)requestAnimationFrame(()=>{const el=document.querySelector(`[data-tra="${CSS.escape(k)}"]`);
      if(el)el.scrollIntoView({block:'start',behavior:'smooth'})});
    return}

  const th=e.target.closest('[data-them]');
  if(th){
    const loai=th.dataset.them;
    const cf={sp:{t:'Thêm mặt hàng',m:'Tên mặt hàng mới. Mẻ chuẩn, định mức và mã số điền sau.',g:'VD: Cát Hambi Gold'},
              h:{t:'Thêm hương',m:'Hương thêm vào đây dùng chung cho mọi mặt hàng.',g:'VD: Hương Bạc hà'},
              q:{t:'Thêm quy cách',m:'Ghi rõ khối lượng để app đoán được số kg mỗi bao.',g:'VD: 10 kg'},
              cp:{t:'Thêm chất phun',m:'Chất phun dùng chung, công thức pha điền sau ở từng mặt hàng.',g:'VD: Dung dịch khử bụi A'},
              nv:{t:'Thêm nhân viên',m:'Tên người pha, dùng để chọn nhanh khi ghi mẻ.',g:'VD: Nguyễn Thị Loan'},
              nl:{t:'Thêm nguyên liệu',m:'Nguyên liệu thêm vào đây dùng để chọn nhanh trong khối "Hàm lượng nguyên liệu" (tab Công thức), khỏi phải gõ tay.',g:'VD: Cát bentonite'}}[loai];
    const g=await hoi(cf.t,cf.m,{nhap:true,goiY:cf.g,nutOK:'Thêm'});
    if(g===null||!String(g).trim())return;
    const t=String(g).trim();
    const ds={sp:sp.map(x=>x.ten),h:kho,q:dr,cp:cp.map(c=>c.ten),nv:nvDS,nl:nlDM}[loai];
    if(ds.some(x=>x.toLowerCase()===t.toLowerCase())){bao('Đã có mục này');return}
    if(loai==='sp')sp.push(napSP([{ten:t,kg:0,ml:0,me:0,pkb:false}])[0]);
    else if(loai==='h'){kho.push(t);maHuong[t]=maHuong[t]||MA_HUONG_GOI_Y[t]||''}
    else if(loai==='q'){dr.push(t);const k=doanKg(t);if(k>0)kgQC[t]=k;maQC[t]=maQC[t]||MA_QC_GOI_Y[t]||''}
    else if(loai==='cp')cp.push({ten:t,ct:''});
    else if(loai==='nv')nvDS.push(t);
    else if(loai==='nl')nlDM.push(t);
    luuNgay();ve();bao('Đã thêm '+t);return}

  /* 27/08/2026 (phản hồi lần 3): mở/đóng panel "+ Thêm/đổi" hoặc "Sửa" — 1 panel gộp đủ
     NCC/giá/kg[/tồn kho] thay cho chuỗi hộp thoại hỏi từng bước cũ. Chỉ mở 1 panel/1 mục tại
     1 thời điểm (mở panel khác của CÙNG mục thì đóng panel cũ lại, khỏi rối). */
  const tn=e.target.closest('[data-themnguon]');
  if(tn){
    const {loai,ten}=parseNguonKey(tn.dataset.themnguon);
    [...moThemNguon].forEach(k=>{if(k===loai+':'+ten||k.startsWith(loai+':'+ten+':'))moThemNguon.delete(k)});
    moThemNguon.add(loai+':'+ten); veMa();
    requestAnimationFrame(()=>{const el=document.querySelector(`[data-nguonform="${CSS.escape(loai+':'+ten)}"] .ninp`);if(el)el.focus()});
    return}
  const sn=e.target.closest('[data-suanguon]');
  if(sn){
    const {loai,ten,ix}=parseNguonKey(sn.dataset.suanguon);
    [...moThemNguon].forEach(k=>{if(k===loai+':'+ten||k.startsWith(loai+':'+ten+':'))moThemNguon.delete(k)});
    moThemNguon.add(loai+':'+ten+':'+ix); veMa();
    return}
  const hn=e.target.closest('[data-huynguon]');
  if(hn){moThemNguon.delete(hn.dataset.huynguon);veMa();return}

  /* Lưu panel — chế độ THÊM (không có ix): thêm dòng mới, coi như đang dùng, tồn kho tuỳ chọn.
     Chế độ SỬA (có ix): chỉ sửa lại đúng dòng đó (gõ nhầm), không đụng tồn kho/lịch sử. */
  const ln=e.target.closest('[data-luunguon]');
  if(ln){
    const {loai,ten,ix}=parseNguonKey(ln.dataset.luunguon);
    const box=ln.closest('[data-nguonform]');
    const gv=nf=>{const el=box.querySelector(`[data-nf="${nf}"]`);return el?el.value:''};
    const ncc=String(gv('ncc')||'').trim();
    if(!ncc){bao('Chưa nhập tên nhà cung cấp');return}
    const gia=num(gv('gia'));
    if(!(gia>0)){bao('Số tiền phải lớn hơn 0');return}
    const soKg=num(gv('soKg'));
    if(!(soKg>0)){bao('Số kg phải lớn hơn 0');return}
    const nguonM=nguonMapCua(loai), dungM=dangDungMapCua(loai);
    nguonM[ten]=nguonM[ten]||[];
    if(ix===undefined){
      nguonM[ten].push(Object.assign({ncc,gia,soKg,ngay:homNay()},loai==='h'?{daDungKg:0}:{}));
      dungM[ten]=ncc; // vừa khai/đổi giá coi như đang dùng nguồn này
      const tonS=gv('ton');
      // 27/08/2026-R2: ô "ton" giờ nhập theo KG cho cả hương lẫn nguyên liệu (xem dvTonKho()) —
      // hương liệu lưu nội bộ theo GRAM như cũ nên nhân 1000 khi lưu; nguyên liệu giữ nguyên.
      if(String(tonS).trim())tonKhoMapCua(loai)[ten]={con:num(tonS)*(loai==='h'?1000:1),capNhat:homNay()};
      moThemNguon.delete(loai+':'+ten);
      luuNgay();ve();bao('Đã lưu nguồn '+tenLoaiNguon(loai));
    }else{
      const e0=nguonM[ten][ix]; if(!e0){bao('Không tìm thấy dòng này');return}
      const nccCu=e0.ncc;
      nguonM[ten][ix]={...e0,ncc,gia,soKg};
      if(dungM[ten]===nccCu&&nccCu!==ncc)dungM[ten]=ncc; // đổi tên NCC đang dùng thì cập nhật theo
      moThemNguon.delete(loai+':'+ten+':'+ix);
      luuNgay();ve();bao('Đã sửa lại dòng nguồn giá');
    }
    return}

  const stk=e.target.closest('[data-suatk]');
  if(stk){
    const h=stk.dataset.suatk;
    // 27/08/2026-R2: khách phản hồi hỏi theo gram khó nhập — đổi sang hỏi/nhập theo KG, tự nhân
    // 1000 khi lưu (nội bộ tonKhoHuong[].con vẫn giữ đơn vị gram như cũ, không đổi các chỗ tính
    // tieuHaoNgay/uocConLai đang dùng gram).
    const tkHienTai=tonKhoHuong[h]&&tonKhoHuong[h].con;
    const v=await hoi('Cập nhật tồn kho',`Hiện kho còn bao nhiêu kg hương <b>${esc(h)}</b>?`,
      {nhap:true,goiY:'VD: 3',giaTri:tkHienTai?String(Math.round(tkHienTai/1000*1000)/1000):'',nutOK:'Lưu'});
    if(v===null||!String(v).trim())return;

    if(loai==='nl')  {dung=sp.filter(x=>(x.congThucNL||[]).some(it=>it&&it.ten===v)).length;
                      them=dung?`Có <b>${dung}</b> mặt hàng đang dùng trong "Hàm lượng nguyên liệu", sẽ bị gỡ dòng đó khỏi công thức.`:''}

      sp.forEach(x=>{x.huongs=(x.huongs||[]).filter(t=>t!==v);x.tam=(x.tam||[]).filter(t=>t!==v);
        if(x.huongMe===v)x.huongMe='';

    else if(loai==='q'){dr=dr.filter(x=>x!==v);delete maQC[v];delete kgQC[v];
      sp.forEach(x=>{x.dauRa=(x.dauRa||[]).filter(t=>t!==v);if(x.qc===v)x.qc='';

    else if(loai==='cp'){cp=cp.filter(x=>x.ten!==v);sp.forEach(x=>{if(x.pkbChat===v)x.pkbChat=''});moCT.clear()}

$('viewSL').addEventListener('change',async e=>{
  if(e.target.id==='nvIn'){
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    try{
      const d=JSON.parse(await f.text());
      const dsNk=Array.isArray(d&&d.nk)?d.nk:[];
      /* 25/08/2026-I: file .json nhân viên xuất giờ có thể mang thêm bcNgay (báo cáo tiến độ
         cuối ngày) — không bắt buộc phải có mẻ mới thì mới nhận được, vì có khi nhân viên chỉ
         gửi báo cáo tiến độ (chưa ghi mẻ nào trong ngày). */
      const dsBc=Array.isArray(d&&d.bcNgay)?d.bcNgay:[];
      const dsAe=Array.isArray(d&&d.auditEvents)?d.auditEvents:[];
      if(!dsNk.length&&!dsBc.length&&!dsAe.length)throw 0;
      const daCo=new Set(nk.map(r=>r.id));
      const moi=dsNk.filter(r=>r&&r.id&&!daCo.has(r.id));
      const bo=dsNk.length-moi.length;
      const daCoBc=new Set(bcNgay.map(r=>r.id));
      const moiBc=dsBc.filter(r=>r&&r.id&&!daCoBc.has(r.id));
      const boBc=dsBc.length-moiBc.length;
      // PATCH V1.1 mục P1-C: nhận auditEvents CÙNG dedupe theo id — append-only, không sửa/xoá
      // event cũ, và không chặn nhận nk/bcNgay nếu chỉ có audit event mới (hoặc ngược lại).
      const daCoAe=new Set(auditEvents.map(r=>r.id));
      const moiAe=dsAe.filter(r=>r&&r.id&&!daCoAe.has(r.id));
      if(!moi.length&&!moiBc.length&&!moiAe.length){
        await hoi('Không có gì mới',`File có <b>${dsNk.length}</b> mẻ · <b>${dsBc.length}</b> báo cáo tiến độ nhưng máy này đã nhận hết rồi.`,{nutOK:'Đã hiểu',nutHuy:'Đóng'});
        e.target.value='';return}
      const c=await hoi('Nhận dữ liệu từ nhân viên',
        `Từ <b>${esc(d.nv||'nhân viên')}</b> · file <b>${esc(f.name)}</b><br><br>`
        +(moi.length?`<b>${moi.length}</b> mẻ mới sẽ được thêm.`+(bo?`<br><b>${bo}</b> mẻ đã có, sẽ bỏ qua.`:'')+'<br>':'')
        +(moiBc.length?`<b>${moiBc.length}</b> báo cáo tiến độ mới sẽ được thêm.`+(boBc?`<br><b>${boBc}</b> báo cáo đã có, sẽ bỏ qua.`:''):'')
        +`<br><br>Công thức và dữ liệu cũ <b>không bị đụng tới</b>.`,{nutOK:'Nhận'});
      if(!c){e.target.value='';return}
      /* 26/08/2026 — PATCH KIẾN TRÚC V1, mục D2: snapshot giá hương liệu TẠI THỜI ĐIỂM nhận
         mẻ lần đầu — bản Nhân viên không giữ bảng giá (nguonHuong/huongDangDung chỉ có ở
         Admin — mục D1), nên NV luôn gửi giaHuongTheoGLucSX/chiPhiHuongLucSX là null. Đây là
         nơi DUY NHẤT snapshot lần đầu; sau khi đã có giá trị (không null) thì TUYỆT ĐỐI không
         tính lại nữa dù giá hương hiện tại có đổi sau này — giữ đúng lịch sử chi phí (test
         case 6 của bản đặc tả). */
      /* 10/09/2026: logic snapshot giá + trừ tồn kho chuyển về hàm dùng chung ghiNhanMeLanDau()
         (khai báo cạnh dbKeoNhatKy) để kênh Sheet và kênh file này chạy CÙNG một đoạn mã — trước
         đây chỉ nhánh này có, kênh Sheet bỏ sót. Hành vi của nhánh file giữ nguyên 100%. */
      /* 10/09/2026 — LỌC LẠI ngay trước khi thêm (lỗi rà đối kháng bắt được sau bản sửa kênh Sheet):
         `moi`/`moiBc` được tính TRƯỚC hộp thoại hoi() ở trên. Trong lúc hộp thoại chờ người dùng bấm,
         vòng kéo 20 giây của kênh Sheet (dbKeoNhatKy/dbKeoBaoCao) vẫn chạy và có thể đã thêm đúng những
         mẻ đó. Không lọc lại thì bấm "Nhận" sẽ thêm TRÙNG, và — từ khi kênh Sheet cũng trừ tồn kho —
         bản ghi từ file (object khác, giá null) sẽ bị ghiNhanMeLanDau() TRỪ TỒN KHO LẦN THỨ HAI.
         Dùng mảng đã lọc cho cả việc thêm lẫn ghi nhật ký nhận file để số liệu nhật ký cũng đúng. */
      const moiThat=moi.filter(r=>!nk.some(x=>x.id===r.id));
      const moiBcThat=moiBc.filter(r=>!bcNgay.some(x=>x.id===r.id));
      moiThat.forEach(r=>{ ghiNhanMeLanDau(r); nk.push(r) });
      nk.sort((a,b)=>String(a.ts||'').localeCompare(String(b.ts||'')));
      // gom tên nhân viên mới vào danh mục
      moiThat.forEach(r=>{const t=String(r.nv||'').trim(); if(t&&!nvDS.includes(t))nvDS.push(t)});
      moiBcThat.forEach(r=>{delete r.daGui; bcNgay.push(r); const t=String(r.nv||'').trim(); if(t&&!nvDS.includes(t))nvDS.push(t)});
      bcNgay.sort((a,b)=>String(a.ts||'').localeCompare(String(b.ts||'')));
      moiAe.forEach(r=>{delete r.daGui; auditEvents.push(r)});
      auditEvents.sort((a,b)=>String(a.at||'').localeCompare(String(b.at||'')));
      /* 26/08/2026-M2: ghi lại nhật ký nhận file — khách phản hồi thông báo "Đã nhận..." tự
         tan mất, không có chỗ xem lại đã nhận file nào, lúc nào, từ ai, bao nhiêu mẻ/báo cáo. */
      nhanNhatKy.push({ts:new Date().toISOString(),nv:d.nv||'',file:f.name,soMe:moiThat.length,soBc:moiBcThat.length,soAe:moiAe.length});
      nhanNhatKy=nhanNhatKy.slice(-30);
      luuNgay();ve();bao(`Đã nhận ${moiThat.length} mẻ · ${moiBcThat.length} báo cáo tiến độ`
        +((moi.length-moiThat.length)+(moiBc.length-moiBcThat.length)>0?' (phần còn lại đã tự về qua Google Sheet trong lúc chờ)':''));
    }catch(err){bao('File không đọc được')}
    e.target.value='';return}
});

      huongDangDung=(d.huongDangDung&&typeof d.huongDangDung==='object')?d.huongDangDung:{};
      tonKhoHuong=(d.tonKhoHuong&&typeof d.tonKhoHuong==='object')?d.tonKhoHuong:{};
      nguonNguyenLieu=(d.nguonNguyenLieu&&typeof d.nguonNguyenLieu==='object')?d.nguonNguyenLieu:{};
      nlDangDung=(d.nlDangDung&&typeof d.nlDangDung==='object')?d.nlDangDung:{};
      tonKhoNguyenLieu=(d.tonKhoNguyenLieu&&typeof d.tonKhoNguyenLieu==='object')?d.tonKhoNguyenLieu:{};
      if(Number.isFinite(+d.nguongCanhBaoNgay)&&+d.nguongCanhBaoNgay>0)nguongCanhBaoNgay=+d.nguongCanhBaoNgay;
      if(Number.isFinite(+d.ngayNhacInTem)&&+d.ngayNhacInTem>0)ngayNhacInTem=+d.ngayNhacInTem;
      if(Number.isFinite(+d.nlTong)&&+d.nlTong>0)nlTong=+d.nlTong; else nlTong=0;
      nlNgayKhai=typeof d.nlNgayKhai==='string'?d.nlNgayKhai:'';
      nlGhiChu=typeof d.nlGhiChu==='string'?d.nlGhiChu:'';
      bcNgay=Array.isArray(d.bcNgay)?d.bcNgay:[];
      nhanNhatKy=Array.isArray(d.nhanNhatKy)?d.nhanNhatKy:[];
      auditEvents=Array.isArray(d.auditEvents)?d.auditEvents:[];
      duLieuCu=!(Number.isFinite(+d.dataUnitVersion)&&+d.dataUnitVersion>=2);
      dataUnitVersion=2;
      buMa();
      khoaXuatXu();
      mo.clear(); moCT.clear(); luuNgay(); ve(); bao('Đã phục hồi');
    }catch(err){bao('File không đọc được')}
  }
});

function buMa(){
  sp.forEach(x=>{if(!hai(x.maSP)&&MA_SP_GOI_Y[x.ten])x.maSP=MA_SP_GOI_Y[x.ten]});
  kho.forEach(h=>{if(!hai(maHuong[h])&&MA_HUONG_GOI_Y[h])maHuong[h]=MA_HUONG_GOI_Y[h];

    // (bỏ trống hẳn = undefined khiến ô nhập mã biến mất luôn trong tab Mã số — xem dong() ở veMa())
  dr.forEach(q=>{if(!hai(maQC[q])&&MA_QC_GOI_Y[q])maQC[q]=MA_QC_GOI_Y[q];
    if(maQC[q]===undefined)maQC[q]=''});
  dr.forEach(q=>{if(!(+kgQC[q]>0)){const g=doanKg(q);if(g>0)kgQC[q]=g}});
  // gom tên nhân viên đã từng ghi mẻ vào danh mục
  nk.forEach(r=>{const t=String(r.nv||'').trim();if(t&&!nvDS.includes(t))nvDS.push(t)});
  const t0=String(nvCuoi||'').trim(); if(t0&&!nvDS.includes(t0))nvDS.push(t0);

function napSP(arr){
  return arr.map(p=>{
    const o={me:num(p.me)||num(p.kg),huongs:[],tam:[],ngay:'',lichSu:[],
      maSP:'',huongMe:'',pb:[],hstem:temMoi(),nguyenlieu:'',congThucNL:[],pkbPhut:'',pkbChat:'',pkbCT:'',ghi:'',lot:'',ngaysx:'',sl:'',nv:'',
      tt:'ok',ttLyDo:'',ttNgay:'',dauRa:[],qc:'',...p};
    if(!TT[o.tt])o.tt='ok';
    if(!Array.isArray(o.dauRa))o.dauRa=[];
    if(!Array.isArray(o.pb))o.pb=[];
    if(!Array.isArray(o.congThucNL))o.congThucNL=[];
    o.congThucNL=o.congThucNL.filter(x=>x&&typeof x==='object').map(x=>({ten:String(x.ten||''),kg:num(x.kg)}));
    o.hstem={...temMoi(),...(o.hstem&&typeof o.hstem==='object'?o.hstem:{})};
    o.pb=o.pb.filter(x=>x&&typeof x==='object').map(x=>({qc:String(x.qc||''),kg:x.kg}));
    if(!Array.isArray(o.huongs))o.huongs=[];
    if(typeof p.chon==='string'&&p.chon&&!o.huongs.length)o.huongs=[p.chon];
    if(!Array.isArray(o.tam)||(!o.tam.length&&o.huongs.length))o.tam=[...o.huongs];
    o.lichSu=(o.lichSu||[]).map(x=>x.hs?x:{t:x.t,hs:x.h?[x.h]:[]});
    delete o.chon;return o;
  });
}

      +'Nếu là điện thoại hoặc máy Admin thứ hai, hai máy cùng sửa sẽ <b>ghi đè mất thay đổi của nhau</b> '
      +'và <b>trừ tồn kho hương liệu hai lần</b>.',
      {nutOK:'Đây là máy tính — bật',nguyHiem:true});
    if(!c)return;
    try{localStorage.setItem(ADMIN_SUA_KEY,'1')}catch(e){}
    adminChiXem=false; d.remove(); bao('Đã bật chỉnh sửa trên máy này');
  });
})();
/* 10/09/2026 — bản S7: đăng ký sw.js để app mở được khi mất mạng (khách duyệt như ngoại lệ có
   chủ đích với quy tắc 1 file — xem chú thích đầu sw.js). CHỈ đăng ký trên https hoặc máy
   cục bộ (để test). Bỏ qua êm, KHÔNG báo lỗi, khi:
   - mở từ file:// (gửi file qua Zalo như trước) — trình duyệt không cho Service Worker ở đó;
   - chạy trong Apps Script (?trang=admin, iframe googleusercontent) — không cùng nguồn với sw.js;
   - thiếu file sw.js (404) — app vẫn chạy đầy đủ, chỉ không có chế độ offline.
   Đăng ký sau sự kiện load để không tranh băng thông với lần tải đầu. */
(function(){
  const duocPhep=location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const trongAppsScript=/googleusercontent\.com$|script\.google\.com$/.test(location.hostname);
  if(!('serviceWorker' in navigator)||!duocPhep||trongAppsScript)return;
  addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
})();
</script>
